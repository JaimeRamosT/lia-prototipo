# Evaluación de la IA con el modelo real (pruebas/ia/evaluar.mjs). Se corre a mano desde la pestaña Actions,
# o en un PR con la etiqueta «ia». Usa la clave del proveedor guardada como secreto de GitHub (GROQ_API_KEY,
# GEMINI_API_KEY, CEREBRAS_API_KEY u OPENROUTER_API_KEY): nunca va en el repositorio. Por defecto, Groq (el de producción).
# Falla si «lo que ve la persona» baja de la meta (90 %).
name: Evaluación de la IA

on:
  workflow_dispatch:
    inputs:
      proveedor:
        description: Proveedor
        type: choice
        options: [groq, gemini, cerebras, openrouter]
        default: groq
      modelo:
        description: Modelo (vacío = el de la función)
        required: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  evaluar:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ia')
    runs-on: ubuntu-latest
    timeout-minutes: 50  # Groq gratis: una frase cada 21 s (unos 40 minutos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluar con el modelo real
        env:
          PROVEEDOR: ${{ github.event.inputs.proveedor || 'groq' }}
          MODELO: ${{ github.event.inputs.modelo }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          CLAVE=$(echo "${PROVEEDOR}" | tr a-z A-Z)_API_KEY
          if [ -z "${!CLAVE}" ]; then echo "Falta el secreto $CLAVE en Settings > Secrets and variables > Actions."; exit 1; fi
          node pruebas/ia/evaluar.mjs --proveedor=$PROVEEDOR ${MODELO:+--modelo=$MODELO} --salida=resultado-ia.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-ia
          path: resultado-ia.json
          if-no-files-found: ignore
          retention-days: 14
