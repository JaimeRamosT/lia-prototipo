// Semana es una cuadrícula de horas (iteración 3, grillaHTML en horario.js): en la computadora, los 7 días; en el celular,
// el día que eliges arriba, para que lo que pasa a la vez se lea lado a lado.
function vSemana(){if(ui.vista==='mes')return vMes();if(ui.vista==='ciclo')return vCiclo();const n=now(),t=ymd(n),p=P(),ancho=esAncho();
  const mon=addDays(n,-((n.getDay()+6)%7)+7*ui.weekOffset);const days=[...Array(7)].map((_,i)=>ymd(addDays(mon,i)));
  if(!ui.sel||!days.includes(ui.sel))ui.sel=days.includes(t)?t:days[0];
  const study=days.reduce((a,d)=>a+p.blocks.filter(b=>b.date===d).reduce((x,b)=>x+b.e-b.s,0)+state.done.filter(x=>x.date===d).reduce((x,y)=>x+y.min,0),0);
  const exams=state.evals.filter(e=>days.includes(e.date)).length;
  const selStudy=p.blocks.filter(b=>b.date===ui.sel).reduce((x,b)=>x+b.e-b.s,0);
  const d0=fromYmd(days[0]),d6=fromYmd(days[6]);  // «26 de octubre – 1 de noviembre» si la semana cruza de mes
  const range=d0.getMonth()===d6.getMonth()?`${d0.getDate()} – ${d6.getDate()} de ${MESES[d6.getMonth()]}`:`${d0.getDate()} de ${MESES[d0.getMonth()]} – ${d6.getDate()} de ${MESES[d6.getMonth()]}`;
  return `<div class="between"><div><div class="kicker">${range}</div><h1>Tu semana</h1></div><div class="row-h"><button class="pill ghost" data-a="wk" data-v="-1" aria-label="Semana anterior">${I.back.replace('<svg','<svg width="16" height="16"')}</button><button class="pill ghost" data-a="wk" data-v="1" aria-label="Semana siguiente">${I.next.replace('<svg','<svg width="16" height="16"')}</button></div></div>
  ${selectorVista()}${freeWeekLine()}${ancho?'':`<div class="days">${days.map(d=>{const dt=fromYmd(d);const hasS=p.blocks.some(b=>b.date===d);const hasE=state.evals.some(e=>e.date===d);
    const que=hasE&&hasS?', con evaluación y estudio':hasE?', con evaluación':hasS?', con estudio':'';
    return `<button class="day ${d<t?'past':''}" data-a="sel" data-d="${d}" aria-pressed="${d===ui.sel}" aria-label="${cap(DIAS[dt.getDay()])} ${dt.getDate()}${d===t?', hoy':''}${que}"><span>${DIAS_C[dt.getDay()]}</span><b class="tnum">${dt.getDate()}</b><i class="dot ${hasE?'x':''}" style="${hasS||hasE?'':'visibility:hidden'}"></i></button>`;}).join('')}</div>`}
  ${amanecidasHTML(days,p)}
  <div class="stats"><div class="card stat"><b class="tnum">${hrs(study)}</b><span>de estudio en esta semana</span></div><div class="card stat"><b class="tnum">${exams}</b><span>${exams===1?'evaluación':'evaluaciones'} esta semana</span></div></div>
  ${ancho?'':`<div><h2>${cap(fechaLarga(ui.sel))}</h2>${selStudy?`<span class="small" style="color:var(--pri);font-weight:600">${hrs(selStudy)} de estudio</span>`:''}</div>`}
  ${grillaHTML(ancho?days:[ui.sel],days,p)}`;}

// Contador de amanecidas de la semana: noches con estudio, cuántas sin pasar la medianoche y si el plan corre riesgo.
function amanecidasHTML(days,p){const t=ymd(now()),a=nochesDeEstudio(state,p,days[0],days[6]>t?t:days[6]),r=nochesDeEstudio(state,p,days[0]>t?days[0]:t,days[6]).riesgo;
  if(!a.noches&&!r)return '';
  const txt=a.noches?(a.tarde?`${a.salvadas} de ${a.noches} ${a.noches===1?'noche':'noches'} de estudio terminaron antes de medianoche.`:`${a.noches} ${a.noches===1?'noche':'noches'} de estudio esta semana, ninguna después de medianoche.`):'';
  const ri=r?` ${r===1?'Un bloque de esta semana termina':`${r} bloques de esta semana terminan`} después de medianoche: adelanta tu hora de dormir o libera un rato antes.`:'';
  return `<div class="${a.tarde||r?'warn':'note'}"><span class="ico" style="color:var(${a.tarde||r?'--exam-ink':'--pri'})">${I.moon||I.cal}</span><div class="grow small"><b>${a.tarde?'Te amaneciste':r?'Ojo con la medianoche':'Sin amanecidas'}</b><br>${txt}${ri}</div></div>`;}
function vEvals(){const t=ymd(now());const up=state.evals.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const past=state.evals.filter(e=>e.date<t);
  return `<div><div class="kicker">Exámenes y entregas</div><h1>Evaluaciones</h1></div>
  ${dictar('eval','“entrego el informe el viernes”')}
  <div class="stack">${up.map(evalItem).join('')||'<div class="card muted small">No tienes evaluaciones próximas.</div>'}
  <button class="dashed" data-a="add-eval">${I.plus.replace('<svg','<svg class="ico"')}<span class="grow">Agregar evaluación</span></button></div>
  ${past.length?`<h2>Pasadas</h2><div class="stack past">${past.map(evalItem).join('')}</div>`:''}`;}

function vLia(){const ph='Escríbele a Lía…';

  return `<div class="row-h">${AV(40)}<div class="grow"><b>Lía</b><div class="small" style="color:var(--ok-ink)">${iaActiva()?'Tu secretaria · con IA':'Tu secretaria · versión sin IA (entiende frases simples)'}</div></div></div>

  ${borradorVigente(state.borrador,now())?'':`<div class="chips">${sug.map(s=>`<button class="pill ghost" data-a="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}

function msgHTML(m,last){if(m.from==='me')return `<div class="msg me"><div class="bub">${esc(m.text)}</div></div>`;
  const undoB=m.undo&&last&&undoStack?'<button class="pill ghost" data-a="undo">Deshacer</button>':'';
  const ctaB=m.cta&&!isPro()?`<button class="pill solid" data-a="paywall" data-why="${esc(m.cta)}">Ver LIA Pro</button>`:'';
  // Respuestas rápidas: solo en la última pregunta de Lía mientras su borrador sigue vigente; al responder, se van.
  const ops=last&&Array.isArray(m.opciones)&&m.opciones.length&&borradorVigente(state.borrador,now())?`<div class="chips" role="group" aria-label="Respuestas rápidas" style="margin-top:8px">${m.opciones.map((o,k)=>`<button class="pill ghost" data-a="rapida" data-i="${k}">${esc(o.t)}</button>`).join('')}</div>`:'';
  return `<div class="msg">${AV(28)}<div class="bub">${esc(m.text)}${ops}${undoB||ctaB?`<div class="row-h" style="flex-wrap:wrap;gap:8px">${undoB}${ctaB}</div>`:''}</div></div>`;}
// "Trabajo, Lun a Vie, 22:00 – 06:00 del día siguiente" o "Parcial de Cálculo, jue 29 oct a las 09:00".
// Lo que dice Lía después de simular un cambio.
function textoSimulacion(x,congelado){const l=[congelado?'Lo probé sin cambiar nada. En Gratis tu semana armada no se mueve sola; si la rearmas con este cambio:':'Lo probé sin cambiar nada. Si pasa eso:'];
  const nom=e=>`${(EVAL_TYPES[e.type]||EVAL_TYPES.parcial).label.toLowerCase()} de ${e.course} (${fechaCorta(e.date)})`;
  if(x.semanaAntes!==x.semanaDespues)l.push(`• En los próximos 7 días tendrías ${hrs(x.semanaDespues)} de estudio, en vez de ${hrs(x.semanaAntes)}.`);
  else if(x.mueve)l.push(`• ${x.mueve===1?'Un bloque de estudio cambia':`${x.mueve} bloques de estudio cambian`} de hora o de día.`);
  for(const y of x.peor)l.push(`• A tu ${nom(y.e)} le faltarían ${hrs(y.despues)}: no hay más huecos libres antes.`);
  for(const y of x.mejor)l.push(`• Ganas tiempo para tu ${nom(y.e)}: ya te alcanzan las horas.`);
  if(!x.peor.length)l.push('• Igual te alcanzan las horas para todas tus evaluaciones.');
  if(!x.peor.length&&!x.mueve&&x.semanaAntes===x.semanaDespues)l[1]='• Tu estudio no cambia: no se cruza con nada.';
  l.push('Si quieres, lo anoto:');return l.join('\n');}

function itemLine(it){if(it.kind==='eval')return `${EVAL_TYPES[it.type].label} · ${it.course} — ${fechaCorta(it.date)} ${it.time} (${it.hours} h de estudio)`;

   ${botonesPropuesta(pe,'<div class="row-h"><button class="pill solid" data-a="confirm">Confirmar</button><button class="pill ghost" data-a="cancel">Corregir</button></div>')}</div></div>`;}

// ---------- Hojas (formularios) ----------
// ---------- Rutinas: un solo formulario, con uno o varios horarios ----------
// El formulario vive en ui.rutina mientras está abierto, para agregar o quitar horarios sin perder lo escrito.
const FRANJAS={manana:['08:00','12:00','Mañana'],tarde:['14:00','18:00','Tarde'],noche:['19:00','22:00','Noche']};
function rutinaDesde(id,pre){const c=id&&state.commitments.find(x=>x.id===id);
  if(c){const g=c.grupo?state.commitments.filter(x=>x.grupo===c.grupo):[c];
    return{id:c.id,ids:g.map(x=>x.id),grupo:c.grupo||null,type:tipoRutina(c.type),name:c.name,tramos:g.map(x=>({days:[...x.days],start:x.start,end:x.end}))};}
  if(pre&&pre.kind==='commit')return{id:'',ids:[],grupo:null,type:tipoRutina(pre.type),name:pre.name||'',tramos:[{days:[...(pre.days||[])],start:pre.start||'',end:pre.end||''}]};
  return{id:'',ids:[],grupo:null,type:'',name:'',tramos:[{days:pre&&pre.date?[fromYmd(pre.date).getDay()]:[],start:(pre&&pre.start)||'',end:(pre&&pre.end)||''}]};}
// Selector de categoría: opciones de radio con ícono y nombre (las flechas del teclado cambian la opción).
function tiposChips(name,sel,{req=false,titulo='Tipo'}={}){return `<fieldset class="tipos-f"><legend>${titulo}</legend><div class="tipos">${Object.entries(COMMIT_TYPES).map(([k,v])=>`<label class="tipo"><input type="radio" name="${name}" value="${k}" ${sel===k?'checked':''}${req?' required':''}><span class="k-${k}">${icoRutina(k)}${v}</span></label>`).join('')}</div></fieldset>`;}
// Con qué se cruza un horario del formulario: otras rutinas y los otros horarios de esta misma.
function crucesTexto(r,i){const t=r.tramos[i],otros=r.tramos.map((x,j)=>({...x,id:'#'+j,name:`el horario ${j+1}`})).filter((x,j)=>j!==i);
  const cs=[...crucesTramo(state.commitments,t,r.ids),...crucesTramo(otros,t,[])];if(!cs.length)return '';
  const c=cs[0];return `Se cruza con ${c.name} (${horario(c)})${cs.length>1?` y ${cs.length-1} más`:''}. Puedes guardarlo igual.`;}
const cruza=t=>t.start&&t.end&&toMin(t.end)<toMin(t.start);
function tramoHTML(r,i){const t=r.tramos[i],n=r.tramos.length,sfx=i?`-${i}`:'';
  return `<div class="tramo stack" role="group" aria-labelledby="tr${i}-t" style="gap:10px">
   <div class="between"><span class="eyebrow" id="tr${i}-t">${n>1?`Horario ${i+1}`:'Horario'}</span>${n>1?`<button type="button" class="linkbtn" data-a="tramo-quitar" data-i="${i}" aria-label="Quitar el horario ${i+1}${t.start&&t.end?`, de ${t.start} a ${t.end}`:''}">Quitar</button>`:''}</div>
   <div class="dpick" role="group" aria-label="Días del horario ${i+1}">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="d${i}" value="${d}" aria-label="${cap(DIAS[d])}" ${t.days.includes(d)?'checked':''}><span aria-hidden="true">${DIAS_C[d]}</span></label>`).join('')}</div>
   <div class="chips">${Object.entries(FRANJAS).map(([k,[a,b,l]])=>`<button type="button" class="pill ghost" data-a="franja" data-i="${i}" data-v="${k}" aria-label="${l}, de ${a} a ${b}">${l}</button>`).join('')}<button type="button" class="pill ghost" data-a="franja" data-i="${i}" data-v="otra">Otra hora</button></div>
   <div class="two"><label class="f">Desde<input type="time" id="c-start${sfx}" name="s${i}" required value="${t.start}"></label><label class="f">Hasta<input type="time" id="c-end${sfx}" name="e${i}" required value="${t.end}" aria-describedby="nx${i}"></label></div>
   <p class="small muted" id="nx${i}" style="margin:-4px 0 0"${cruza(t)?'':' hidden'}>Termina al día siguiente.</p>
   <p class="small aviso-cruce" id="cr${i}" aria-live="polite" style="margin:0">${esc(crucesTexto(r,i))}</p>
   ${r.err&&r.err.i===i?`<p class="ferr" role="alert">${esc(r.err.msg)}</p>`:''}</div>`;}
function sheetRutina(){const r=ui.rutina;
  return `<form class="stack" data-form="rutina" style="gap:14px"><div class="grab"></div><h2>${r.id?'Editar rutina':'Nueva rutina'}</h2>
  <p class="muted small" style="margin:0">Lo que se repite cada semana. Lía no pone estudio en esas horas.</p>
  ${tiposChips('ru-tipo',r.type,{req:true})}
  <label class="f">Nombre (opcional)<input id="c-name" name="nombre" maxlength="40" value="${esc(r.name)}" placeholder="${r.type?esc(COMMIT_TYPES[r.type]):'Clases en la U, Trabajo, Gimnasio…'}"></label>
  ${r.tramos.map((t,i)=>tramoHTML(r,i)).join('')}
  <button type="button" class="dashed" data-a="tramo-mas">${I.plus.replace('<svg','<svg class="ico" aria-hidden="true"')}<span class="grow">Agregar otro horario</span></button>
  ${r.choque?choqueFormHTML(r.choque,'rutina'):`<button class="btn pri" type="submit">Guardar</button>${r.id?`<button class="btn danger" type="button" data-a="del-commit" data-id="${r.id}">Eliminar rutina</button>`:''}`}<button class="btn sec" type="button" data-a="close">Cancelar</button></form>`;}
// Lee el formulario abierto (lo escrito manda sobre ui.rutina).
function leerRutina(){const r=ui.rutina,f=document.querySelector('form[data-form="rutina"]');if(!r||!f)return r;const fd=new FormData(f);
  r.type=String(fd.get('ru-tipo')||r.type||'');r.name=String(fd.get('nombre')||'');
  r.tramos=r.tramos.map((t,i)=>({days:fd.getAll('d'+i).map(Number),start:String(fd.get('s'+i)||''),end:String(fd.get('e'+i)||'')}));return r;}
function abrirRutina(id,pre){ui.rutina=rutinaDesde(id,pre);ui.agregarPre=null;ui.sheet=sheetRutina();render();}
function pintarRutina(foco){ui.sheet=sheetRutina();render();const el=foco&&document.querySelector(foco);if(el)el.focus();}
// Avisos que cambian mientras se escribe, sin volver a dibujar la hoja (así el foco no salta).
function refrescarTramos(){const r=leerRutina();if(!r)return;r.tramos.forEach((t,i)=>{const c=document.getElementById('cr'+i),nx=document.getElementById('nx'+i);
  if(c){const v=crucesTexto(r,i);if(c.textContent!==v)c.textContent=v;}if(nx)nx.hidden=!cruza(t);});}
// Guarda la rutina: un compromiso por horario y, si son varios, con un mismo grupo. Reusa los ids para no perder
// lo que se liberó solo un día; lo liberado de un horario que se quitó se borra con él.
function guardarRutina(r){snapshot();const name=r.name.trim()||COMMIT_TYPES[r.type],grupo=r.tramos.length>1?(r.grupo||uid()):null,usados=[];
  r.tramos.forEach((t,i)=>{const id=r.ids[i]||uid();usados.push(id);
    const o={name,type:r.type,days:[...new Set(t.days)].sort((a,b)=>a-b),start:t.start,end:t.end},cur=state.commitments.find(c=>c.id===id);
    if(cur){Object.assign(cur,o);if(grupo)cur.grupo=grupo;else delete cur.grupo;}else state.commitments.push({id,...o,...(grupo?{grupo}:{})});});
  quitarRutinas(r.ids.filter(id=>!usados.includes(id)));save();}
// Gratis (decisión 5): si algo de ocio cae sobre estudio ya armado, ese estudio pasa a otro hueco libre sin tocar lo demás,
// y se avisa. Lo que no entra queda como «falta» y Hoy propone qué hacer (entre otras cosas, usar el ocio).
function reubicarOcio(){const f=state.frozen;if(isPro()||!f)return '';const c=bloquesQueChocan(state,f,now(),esOcio);if(!c.length)return '';
  const r=reubicarCongelado(state,f,c,now()),mov=c.reduce((a,b)=>a+b.e-b.s,0),ids=c.map(b=>b.evalId);
  const ubic=Math.min(mov,r.nuevos.filter(b=>ids.includes(b.evalId)).reduce((a,b)=>a+b.e-b.s,0));f.blocks=r.blocks;save();
  const cursos=[...new Set(ids.map(id=>(evById(id)||{}).course).filter(Boolean))].join(' y ');
  if(ubic>=mov)return `Para respetar tu ocio, moví ${hrs(mov)} de estudio de ${cursos} a otro hueco libre.`;
  if(ubic)return `Para respetar tu ocio, moví ${hrs(ubic)} de estudio de ${cursos} a otro hueco libre. Para ${hrs(mov-ubic)} no encontré espacio: en Hoy te propongo qué hacer.`;
  return `Ese rato era de estudio de ${cursos} y no encontré otro hueco libre: en Hoy te propongo qué hacer.`;}

let pdfjsCarga=null;
function cargarPdfjs(){if(!pdfjsCarga)pdfjsCarga=import('./vendor/pdfjs/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='./vendor/pdfjs/pdf.worker.min.mjs';return m;}).catch(e=>{pdfjsCarga=null;throw e;});return pdfjsCarga;}
async function trozosDelPDF(archivo){const pdfjs=await cargarPdfjs();
  const doc=await pdfjs.getDocument({data:new Uint8Array(await archivo.arrayBuffer()),isEvalSupported:false,disableFontFace:true,useSystemFonts:false,verbosity:0}).promise;
  const out=[];let off=0;
  try{for(let p=1;p<=Math.min(doc.numPages,10);p++){const pg=await doc.getPage(p),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const t=pdfjs.Util.transform(vp.transform,it.transform);out.push({s:it.str,x:t[4],y:t[5]+off});}off+=vp.height;}}
  finally{doc.destroy();}
  return out;}

async function leerArchivoConsolidado(archivo){if(!archivo)return;

function waResumen(it){if(it.intent==='add')return it.items.map(resumenItem).join('; ');

function aplicarDeWhatsapp(filas){const ya=new Set(waHechas()),n0=now(),antes=JSON.stringify(state),fresco=!!state.frozen&&!planStale(),partes=[],fallas=[],nuevas=[],ids=[],cruces=[];let cambios=false;

    if(!v.ok){fallas.push(WA_MOTIVOS[v.motivo]||WA_MOTIVOS.rara);continue;}
    if(it.intent!=='quitaEval')partes.push(waResumen(it));
    cruces.push(...crucesWhatsapp(it));   // lo que se cruza se guarda igual (ya lo confirmó), pero se avisa
    if(it.intent==='add')for(const i of it.items){if(i.kind==='eval'){const id=uid();nuevas.push(id);state.evals.push({id,type:i.type,course:i.course,date:i.date,time:i.time,hours:i.hours>0?i.hours:EVAL_TYPES[i.type].h});}
      else state.commitments.push({id:uid(),name:i.name,type:i.type,days:i.days,start:i.start,end:i.end});}
    else if(it.intent==='except')for(const x of it.exs){cambios=true;state.exceptions.push({id:uid(),date:x.date,start:x.start,end:x.end,label:x.label,...(x.cat?{cat:x.cat}:{}),...(x.libre?{libre:true,ref:x.ref}:{})});}
    else if(it.intent==='log'){const hoy=it.date===ymd(n0);state.done.push({id:uid(),evalId:it.evalId,date:it.date,start:hoy?fmt(Math.max(0,n0.getHours()*60+n0.getMinutes()-it.min)):'20:00',min:it.min});}

  // «Guardé X; se cruza con Y» (iteración 3).
  const cz=!cruces.length?'':hechas===1&&cruces.length===1?`; ${cruces[0].texto}`:`; ${cruces.map(c=>`«${c.nombre}» ${c.texto}`).join('; ')}`;

// ---------- Conectar con Google (docs/google.md): Google Calendar al instante en los dos sentidos ----------
// lia-google guarda el permiso de Google (en Vault), avisa por Realtime (google_senal) cuando cambia el calendario
// principal y escribe lo de LIA en un calendario «LIA». La app no guarda nada de Google fuera de sus datos de siempre.
const KEY_GOOGLE_FIRMA='lia.google.firma';
async function llamarGoogle(accion,extra){const t=await tokenSesion();if(!t)throw{error:'sesion'};let res;
  try{res=await fetch(`${SB_CFG.url}/functions/v1/lia-google`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_CFG.key,Authorization:`Bearer ${t}`},body:JSON.stringify({accion,...(extra||{})})});}
  catch(e){throw{error:navigator.onLine===false?'red':'no_responde'};}
  const d=await res.json().catch(()=>null);if(!d||!d.ok)throw{error:(d&&d.error)||'no_responde'};return d;}
// ui.google: undefined (sin cargar), null (lia-google no responde: la tarjeta queda como antes) o {configurado, conectado, estado}.
async function cargarGoogle(){if(!state.cuenta||ui.googleCargando)return;ui.googleCargando=true;
  try{const d=await llamarGoogle('estado');ui.google={configurado:!!d.configurado,conectado:!!d.conectado,estado:d.estado||null,avisos:d.avisos!==false};}
  catch(e){ui.google=null;}
  finally{ui.googleCargando=false;}
  if(googleActivo()){suscribirGoogle();if(!ui.googleEscritoAlAbrir){ui.googleEscritoAlAbrir=true;escribirGoogle(true);}}  // por si borraron el calendario «LIA»
  if(ui.tab==='perfil'&&calm())rerenderKeepScroll();
  irAlBotonGoogle();}
const googleActivo=()=>!!(state.cuenta&&ui.google&&ui.google.conectado&&ui.google.estado==='activa');
// aria-disabled (no disabled): el botón ocupado no pierde el foco del teclado.
// Los recordatorios llegan también con la alerta de Google (iteración 3): una línea en cada estado de la tarjeta.
const ALERTA_GOOGLE='Todo lo del calendario «LIA» trae la alerta de Google: tu estudio, tus clases y tus eventos, 15 minutos antes; tus evaluaciones, 2 horas antes.';
function googleBloque(gg){const oc=ui.googleOcupado||ui.googleLeyendo?' aria-disabled="true"':'',head='<h3 style="font-size:inherit;margin:0">Google Calendar</h3>',alerta=`<p class="small muted" style="margin:0">${ALERTA_GOOGLE}</p>`;
  if(!gg.conectado)return `<div class="stack" style="gap:8px">${head}<div class="small muted">Conecta tu cuenta de Google y LIA queda unida a tu Google Calendar: lo que anotas allá aparece aquí en segundos, y tu estudio, tus evaluaciones, tus eventos y tus rutinas aparecen allá, en un calendario «LIA».</div>${alerta}
     ${ui.googleMsg?`<p class="ferr" id="google-msg" style="margin:0">${esc(ui.googleMsg)}</p>`:''}
     <button class="btn pri sm" data-a="google-conectar"${oc}${ui.googleMsg?' aria-describedby="google-msg"':''}>${ui.googleOcupado==='confirmar'?'Conectando…':ui.googleOcupado?'Abriendo Google…':'Conectar con Google'}</button>
     ${isIOS()&&isStandalone()?'<p class="small" style="margin:0">En la app instalada del iPhone, Google se abre aparte y no puede volver aquí: conecta desde Safari, con tu misma cuenta de LIA. Después, la conexión sirve también en esta app.</p>':''}
     <p class="small muted" style="margin:0">Verás «Google no verificó esta app» porque LIA está en prueba: toca «Continuar». Luego deja marcadas las dos casillas: ver tus eventos (LIA solo lee tu calendario principal) y crear el calendario «LIA». LIA no guarda tus eventos en su servidor, y puedes desconectar cuando quieras.</p></div>`;
  if(gg.estado!=='activa')return `<div class="stack" style="gap:8px">${head}<div class="small" role="status">Tu conexión con Google venció o quitaste el permiso. Vuelve a conectar para seguir al día.</div>
     <div class="row-h" style="flex-wrap:wrap"><button class="btn pri sm" data-a="google-conectar"${oc}>Volver a conectar</button><button class="btn sec sm" data-a="google-desconectar"${oc}>Desconectar</button></div></div>`;
  const g=state.gcal,eligio=!!(g&&g.fuente==='google'),ult=eligio&&g.ultima?` Última lectura: ${cuandoTxt(g.ultima)}.`:'';
  if(!eligio)return `<div class="stack" style="gap:8px">${head}<div class="small" role="status">Conectado. Lo de LIA ya está en tu calendario «LIA». Falta que elijas qué traer de tu Google Calendar; hasta entonces, no traigo nada.</div>${alerta}
     <div class="row-h" style="flex-wrap:wrap"><button class="btn pri sm" data-a="google-leer"${oc}>${ui.googleLeyendo?'Leyendo…':'Elegir qué traer'}</button><button class="btn sec sm" data-a="google-desconectar"${oc}>Desconectar</button></div></div>`;
  const cuando=gg.avisos?'aparece aquí en segundos':'aparece aquí al abrir LIA o al volver a esta pestaña';
  return `<div class="stack" style="gap:8px">${head}<div class="small muted" role="status">Conectado. Lo que cambies en tu Google Calendar ${cuando}, y lo de LIA está en tu calendario «LIA».${ult}</div>${alerta}
     <div class="row-h" style="flex-wrap:wrap"><button class="btn sec sm" data-a="google-leer"${oc}>${ui.googleLeyendo?'Leyendo…':'Traer ahora'}</button><button class="btn sec sm" data-a="google-desconectar"${oc}>Desconectar</button></div></div>`;}
// Al volver de Google (?google=ok|cancelado|permisos|error): se limpia la dirección y se lee el calendario.
const GOOGLE_MOTIVOS={cancelado:'No conecté Google porque cancelaste. Cuando quieras, toca «Conectar con Google».',permisos:'Faltó marcar una casilla en Google, así que no conecté nada. Toca «Conectar con Google» y deja marcadas las dos.',error:'No pude terminar la conexión con Google. Toca «Conectar con Google» otra vez en un momento.'};
// Al volver sin conectar, el motivo queda junto al botón y el foco va a él (el aviso solo dura unos segundos).
function avisarGoogle(m){ui.googleMsg=GOOGLE_MOTIVOS[m]||GOOGLE_MOTIVOS.error;ui.irAGoogle=true;toast(ui.googleMsg);}
// El nonce lo guarda este navegador al iniciar: sin él (o con otra cuenta), lia-google no confirma la conexión.
const KEY_GOOGLE_NONCE='lia.google.nonce';
function alVolverDeGoogle(){let m=null,e=null;try{const q=new URLSearchParams(location.search);m=q.get('google');e=q.get('e');if(!m)return;q.delete('google');q.delete('e');
    history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);}catch(err){return;}
  let nonce=null;try{nonce=sessionStorage.getItem(KEY_GOOGLE_NONCE);sessionStorage.removeItem(KEY_GOOGLE_NONCE);}catch(err){}
  try{nonce=nonce||localStorage.getItem(KEY_GOOGLE_NONCE);localStorage.removeItem(KEY_GOOGLE_NONCE);}catch(err){}
  ui.tab='perfil';render();
  if(m!=='ok'){avisarGoogle(m);if(ui.google)irAlBotonGoogle();return;}
  if(!e||!nonce||!state.cuenta){avisarGoogle('error');if(ui.google)irAlBotonGoogle();return;}
  ui.googleOcupado='confirmar';ui.googleRecien=true;rerenderKeepScroll();anunciar('Conectando con Google…');
  llamarGoogle('confirmar',{estado:e,nonce}).then(()=>{ui.google=undefined;ui.googleEscritoAlAbrir=true;return cargarGoogle();})
    .then(()=>{if(googleActivo()){toast('Listo: LIA está conectada con tu Google Calendar.');escribirGoogle(true);}})
    .catch(()=>{avisarGoogle('error');})
    .finally(()=>{ui.googleOcupado=false;if(calm())rerenderKeepScroll();irAlBotonGoogle();});}
function irAlBotonGoogle(){if(!ui.irAGoogle||ui.sheet)return;const b=document.querySelector('[data-a="google-conectar"]');if(b){ui.irAGoogle=false;b.scrollIntoView({block:'center'});b.focus({preventScroll:true});}}
// Volver con «Atrás» desde Google (Safari puede restaurar la página): el botón no queda en «Abriendo Google…».
window.addEventListener('pageshow',e=>{if(e.persisted&&ui.googleOcupado){ui.googleOcupado=false;if(calm())rerenderKeepScroll();}});
// Leer: la primera vez (o hasta que la persona elija) abre la vista previa; después, los cambios entran solos.
let googleUltima=0,googleLeerT=null,googleT=null;
async function leerGoogle(manual){if(ui.googleLeyendo||!googleActivo())return;ui.googleLeyendo=true;googleUltima=Date.now();if(ui.tab==='perfil'&&calm())rerenderKeepScroll();
  try{const d=await llamarGoogle('leer'),cand=deCalendario(leerIcs(d.ics),ymd(now())),g=state.gcal;
    const yaEligio=!!(g&&(g.fuente==='google'||(g.traidos&&g.traidos.length)));
    const vacio=!cand.rutinas.length&&!cand.evals.length&&!cand.eventos.length;
    // Sin nada que elegir, queda conectado: lo que agregue después en Google entra solo.
    if(!yaEligio&&vacio){aplicarGcal(cand,{fuente:'google'});if(manual||ui.googleRecien)toast('Tu Google Calendar no tiene nada de aquí a 60 días. Lo que agregues allá aparece aquí solo.');ui.googleRecien=false;return;}
    if(!yaEligio){if((manual||ui.googleRecien)&&!(ui.sheet&&ui.gcal&&ui.gcal.estado==='listo')){ui.googleRecien=false;ui.gcal={estado:'listo',cand,fuente:'google'};ui.sheet=sheetGcal();render();}return;}
    const {n,extra}=aplicarGcal(cand,{fuente:'google'});
    if(n){rerenderKeepScroll();toast(`Traje ${n} ${n===1?'cambio':'cambios'} de tu Google Calendar.${extra}`);}else if(manual)toast(`Tu Google Calendar no tiene cambios.${extra}`);}
  catch(e){const err=e&&e.error;if(err==='vencida'){ui.google={...ui.google,estado:'vencida'};soltarGoogle();toast('Tu conexión con Google venció: vuelve a conectar en Perfil.');}
    else if(manual)toast(GCAL_ERRORES[err]||'No pude leer tu Google Calendar. Inténtalo en un momento.');}
  finally{ui.googleLeyendo=false;if(ui.tab==='perfil'&&calm())rerenderKeepScroll();}}
// Un aviso de Google (Realtime) o volver a la pestaña: se lee en un momento; si hay un Deshacer pendiente, se espera.
function leerGoogleLuego(ms=1500){clearTimeout(googleLeerT);googleLeerT=setTimeout(()=>{if(deshacerVisible()){leerGoogleLuego(3000);return;}leerGoogle(false);},ms);}
function suscribirGoogle(){if(ui.googleCanal||!googleActivo())return;const uid=state.cuenta.id;ui.googleCanal='…';
  sb().then(c=>{if(ui.googleCanal!=='…')return;ui.googleCanal=c.channel('lia-google-'+uid)
    .on('postgres_changes',{event:'*',schema:'public',table:'google_senal',filter:`user_id=eq.${uid}`},()=>leerGoogleLuego()).subscribe();})
    .catch(()=>{ui.googleCanal=null;});
  leerGoogleLuego(0);}   // lo que cambió en Google mientras LIA estaba cerrada
function soltarGoogle(){const ch=ui.googleCanal;ui.googleCanal=null;if(ch&&ch!=='…')sb().then(c=>c.removeChannel(ch)).catch(()=>{});}
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-ical]'))ui.icalAbierto=e.target.open;},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&googleActivo()&&Date.now()-googleUltima>60000)leerGoogleLuego(500);});
// Escribir: cuando cambia el plan, en 3 segundos el calendario «LIA» queda igual a lo de LIA.
// Si Google falla, espera cada vez más (1, 2, 4… hasta 15 minutos) antes de reintentar.
let googleEsperaHasta=0,googleFallos=0,googleEscribiendo=false;
function googleLuego(){if(!googleActivo()||Date.now()<googleEsperaHasta)return;clearTimeout(googleT);googleT=setTimeout(()=>{escribirGoogle(false);},3000);}
async function escribirGoogle(forzar){if(!googleActivo()||googleEscribiendo||Date.now()<googleEsperaHasta)return;
  const ev=eventosGoogle(state,P(),now()),firma=JSON.stringify(ev);let previa=null;try{previa=localStorage.getItem(KEY_GOOGLE_FIRMA);}catch(e){}
  if(!forzar&&firma===previa)return;
  googleEscribiendo=true;
  try{await llamarGoogle('escribir',{eventos:ev});googleFallos=0;try{localStorage.setItem(KEY_GOOGLE_FIRMA,firma);}catch(e){}}
  catch(e){if(e&&e.error==='vencida'){ui.google={...ui.google,estado:'vencida'};soltarGoogle();if(calm())rerenderKeepScroll();}

const TABS=[['hoy','Hoy','sun'],['semana','Semana','cal'],['lia','Lía',null],['evals','Evaluaciones','list'],['perfil','Perfil','user']];
// Accesibilidad: al volver a dibujar, el foco vuelve al mismo control (o a su equivalente) en vez de perderse,
// y al cerrar una hoja vuelve al botón que la abrió.
function claveFoco(el){if(!el||el===document.body||!el.dataset)return null;
  if(el.id)return '#'+CSS.escape(el.id);
  const d=el.dataset;if(!d.a)return null;
  return `[data-a="${CSS.escape(d.a)}"]`+['t','d','v','id','ev','s','k','why'].filter(k=>d[k]!==undefined).map(k=>`[data-${k}="${CSS.escape(d[k])}"]`).join('');}
let abridor=null;
function render(){ensureState();canalesLuego();gcalLuego();googleLuego();const L=document.getElementById('layer'),a=document.activeElement,habia=!!L.firstElementChild,enCapa=habia&&L.contains(a),clave=claveFoco(a);
  dibujando=true;planDibujo=null;try{dibujar();}finally{dibujando=false;planDibujo=null;}
  const hay=!!L.firstElementChild,app=document.getElementById('app');if(hay&&!habia)abridor=clave;
  // Una capa que marca adónde va el foco ([data-foco], p. ej. la pregunta al salir de una sesión) manda sobre el foco anterior.
  const destino=hay?(enCapa&&!L.querySelector('[data-foco]')?clave:null):(habia?abridor:clave);if(!hay&&habia)abridor=null;
  let el=destino&&(hay?L:app).querySelector(destino);
  if(el&&habia&&!hay&&el.matches('input,textarea,select'))el=null;  // al cerrar una hoja no se reabre el teclado del celular
  else if(!el&&habia&&!hay){el=app.querySelector('main h1');if(el)el.setAttribute('tabindex','-1');}  // lo que abrió la hoja ya no está
  if(el&&el!==document.activeElement)el.focus({preventScroll:true});}
function dibujar(){const v=document.getElementById('view'),tabs=document.getElementById('tabs');
  const inOb=ui.welcome||!state.onboarded;
  tabs.hidden=inOb;
  if(ui.welcome)v.innerHTML=vWelcome();
  else if(!state.onboarded)v.innerHTML=vOnboarding();
  else v.innerHTML={hoy:vHoy,semana:vSemana,lia:vLia,evals:vEvals,perfil:vPerfil}[ui.tab]();
  document.body.classList.toggle('wm',!!ui.welcome);v.style.paddingTop=ui.welcome?'0':'';v.style.paddingBottom=ui.welcome?'0':'';
  v.classList.toggle('ancha',!inOb&&ui.tab==='semana'&&ui.vista==='semana');  // la cuadrícula de 7 días usa más ancho
  // El botón «+» va primero en la barra: en el celular flota sobre la vista (menos en el chat); en la computadora encabeza la barra lateral.
  tabs.innerHTML=fabHTML()+TABS.map(([k,l,ic])=>`<button class="tab" data-a="tab" data-t="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic?I[ic]:AV(40)}<span>${l}</span></button>`).join('');
  document.body.classList.toggle('con-fab',!inOb&&ui.tab!=='lia');
  const L=document.getElementById('layer');
  if(ui.session)L.innerHTML=vSession();
  else if(ui.listen)L.innerHTML=vListen();
  else if(ui.sheet){L.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hoja-t">${ui.sheet}</div></div>`;
    const ht=L.querySelector('.sheet h2');if(ht)ht.id='hoja-t';}
  else L.innerHTML='';
  focusLayer(L);
  const t=document.querySelector('#toastbox .toast');if(t)t.classList.toggle('arriba',avisoArriba());
  if(ui.tab==='lia'&&!inOb){const c=document.getElementById('view');c.scrollTop=c.scrollHeight;}}
// Accesibilidad: con una hoja o pantalla superpuesta abierta, el fondo queda inerte y el foco pasa a ella.
function focusLayer(L){const open=!!L.firstElementChild;document.getElementById('app').inert=open;
  if(!open)return;const box=L.querySelector('.sheet')||L.querySelector('.full .in');if(!box||box.contains(document.activeElement))return;
  const t=box.querySelector('[data-foco]')||box.querySelector('h1,h2')||box;t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(ui.listen){A['listen-cancel']();return;}
  if(ui.sheet&&!document.querySelector('.sheet .spin')){e.preventDefault();A.close();}});
function rerenderKeepScroll(){const v=document.getElementById('view');const y=v.scrollTop;render();v.scrollTop=y;}
let toastT;
// Avisos: van arriba cuando abajo hay botones que no deben taparse (bienvenida, registro, hojas y sesión),
// duran según lo que dicen y no se cierran mientras tienen el foco (para alcanzar «Deshacer» con el teclado).
// Si el aviso ya estaba abajo y se abre una hoja, sube con ella (dibujar() lo reubica).
function avisoArriba(){return!!(ui.sheet||ui.welcome||!state.onboarded||ui.session||ui.listen);}
function toast(msg,withUndo){const b=document.getElementById('toastbox');if(withUndo)marcarDeshacer();
  b.innerHTML=`<div class="toast${avisoArriba()?' arriba':''}"><span style="flex:1">${esc(msg)}</span>${withUndo?'<button data-a="undo">Deshacer</button>':''}</div>`;
  const ms=Math.min(10000,Math.max(withUndo?7000:4000,String(msg).length*65));clearTimeout(toastT);
  const cerrar=()=>{if(b.contains(document.activeElement)){toastT=setTimeout(cerrar,1500);return;}b.innerHTML='';};toastT=setTimeout(cerrar,ms);}

// ---------- Acciones ----------
function blockOf(ds){return{ev:ds.ev,d:ds.d,s:+ds.s,e:+ds.e};}
function moveBlock(b){const before=P().blocks.filter(x=>x.evalId===b.ev).map(x=>x.date+x.s);snapshot();
  state.exceptions.push({id:uid(),date:b.d,start:fmt(b.s),end:fmt(b.e),label:'No disponible'});save();
  const after=P();const nb=after.blocks.find(x=>x.evalId===b.ev&&!before.includes(x.date+x.s));const e=evById(b.ev);
  const msg=nb?`Moví ${e.course} a ${nb.date===b.d?'las':fechaCorta(nb.date)+','} ${fmt(nb.s)}.`:after.unmet[b.ev]>0?`No encontré otro hueco para ${e.course}: te ${faltaTxt(after.unmet[b.ev])}.`:`Reorganicé ${e.course}: ya está cubierto en otros bloques.`;
  ui.sheet=null;rerenderKeepScroll();toast(msg,true);return msg;}
// Guarda lo que Lía entendió. En Gratis, las evaluaciones nuevas entran solas al horario armado; devuelve sus minutos agendados.
function applyItems(items){snapshot();const ids=[];
  for(const it of items){if(it.kind==='eval'){const id=uid();ids.push(id);state.evals.push({id,type:it.type,course:it.course,date:it.date,time:it.time,hours:it.hours});}
    else state.commitments.push({id:uid(),name:it.name,type:it.type,days:it.days,start:it.start,end:it.end});}
  save();return{ids,agendado:agendarNuevas(ids)};}
// Quita una evaluación con lo que se estudió para ella (Deshacer la devuelve).
function quitarEval(id){snapshot();state.evals=state.evals.filter(e=>e.id!==id);state.done=state.done.filter(x=>x.evalId!==id);save();}
// Cambia la fecha o la hora de una evaluación, o la quita, y devuelve lo que dice Lía. Igual que al editarla en
// Evaluaciones: en Pro el estudio se reorganiza solo; en Gratis, el cambio entra cuando se rearma la semana.
function aplicarCambioEval(c){const e=evById(c.evalId);if(!e)return 'No encontré esa evaluación. Revísala en Evaluaciones.';
  const n=nombreEval(e),congelado=()=>!isPro()&&state.onboarded&&!!state.frozen;
  if(c.accion==='quitar'){quitarEval(e.id);return congelado()?`Listo, quité ${n}. Las horas que tenía agendadas quedan libres.`:`Listo, quité ${n} y reorganicé tu estudio.`;}
  snapshot();e.date=c.date;e.time=c.time;save();
  const dicho=`Listo, pasé ${n} al ${fechaCorta(e.date)} a las ${e.time}`;
  if(congelado()&&planStale())return `${dicho}. En Gratis, tu estudio tiene en cuenta el cambio cuando rearmas tu semana${canArm()?' (puedes hacerlo ahora desde Hoy)':` (desde el ${fechaCorta(nextArmDate())})`}.`;
  const f=(P().unmet||{})[e.id]||0;
  return `${dicho} y reorganicé tu estudio.${f?` Aún ${faltaTxt(f)} sin hueco libre.`:''}`;}
// Cuánto estudio quedó agendado para esas evaluaciones y cuánto falta, en el plan que se ve (Pro o Gratis).
function agendadoPara(ids){const p=P(),min=p.blocks.filter(b=>ids.includes(b.evalId)).reduce((a,b)=>a+b.e-b.s,0),falta=ids.reduce((a,id)=>a+((p.unmet&&p.unmet[id])||0),0);return{min,falta};}
// Lo que dice Lía después de agregar evaluaciones: lo que agendó y lo que no encontró.
function textoAgendado(ids){if(!ids.length)return '';const{min,falta}=agendadoPara(ids);if(!min&&!falta)return '';
  return min&&falta?` Agendé ${hrs(min)} de estudio; ${faltaTxt(falta)} sin hueco libre.`:min?` Agendé ${hrs(min)} de estudio en tus horas libres.`:` Todavía no encontré horas libres para estudiar: ${faltaTxt(falta)}.`;}
const AYUDA_CHAT='Todavía entiendo frases simples. Prueba con:\n• “Parcial de Cálculo el jueves a las 9”\n• “Pasaron mi parcial de Cálculo al viernes”\n• “Trabajo de lunes a viernes de 3 a 7”\n• “Hoy salgo del trabajo a las 9”\n• “Mañana no tengo clases”\n• “Ayer estudié 2 horas de Cálculo”\n• “¿Qué tengo mañana?”\nPara mover un bloque, tócalo en Hoy o en Semana.';
// Lo que responde Lía a un mensaje social. Al saludar, recuerda lo próximo: el estudio de hoy o la siguiente evaluación.
function textoCharla(tipo,n){const nombre=state.settings.name?`, ${state.settings.name}`:'';
  if(tipo==='ayuda')return AYUDA_CHAT;
  if(tipo==='quien')return 'Soy Lía, tu secretaria de estudio. Anoto tus horarios y tus evaluaciones, y te armo un horario para estudiar en tus horas libres.';
  if(tipo==='animo')return 'Descansar también cuenta. Si hoy no te da, dime por ejemplo “hoy no puedo estudiar en la noche” y lo tomo en cuenta.';
  if(tipo==='gracias')return `¡De nada${nombre}! Aquí estoy para lo que necesites.`;
  if(tipo==='ok')return 'Listo.';
  const t=ymd(n),ahora=n.getHours()*60+n.getMinutes();
  const blq=state.onboarded?P().blocks.filter(x=>x.date===t&&x.e>ahora).sort((a,b)=>a.s-b.s)[0]:null,eb=blq&&evById(blq.evalId);
  const prox=state.evals.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const luego=eb?`Hoy te toca estudiar ${eb.course} a las ${fmt(Math.max(blq.s,ahora))}.`:prox?`Tu próxima evaluación es ${nombreEval(prox).replace(/^tu /,'')}, ${prox.date===t?'hoy':'el '+fechaLarga(prox.date)} a las ${prox.time}.`:'';
  if(tipo==='despedida')return `¡Nos vemos${nombre}!${luego?' '+luego:''}`;
  return `¡Hola${nombre}! ${luego||'Cuéntame tus horarios o tu próxima evaluación y armo tu semana.'}`;}
function liaSay(text,opts={}){state.chat.push({from:'lia',text,...opts});if(opts.undo)marcarDeshacer();save();anunciar(`Lía: ${text}`);}
// Lo que dice Lía se lee en voz alta (lector de pantalla) sin volver a leer toda la pantalla.
function anunciar(t){const a=document.getElementById('anuncio');if(!a)return;a.textContent='';setTimeout(()=>{a.textContent=t;},60);}
function handleText(q,from){q=q.trim();if(!q)return;
  // Si Lía preguntó algo hace poco, la respuesta completa lo que ya entendió (sin gastar un mensaje con IA).
  const n0=now(),b=borradorVigente(state.borrador,n0)?state.borrador:null;
  if(b){const r=respuestaBorrador(b,q,state,n0);if(r){responder(q,from,r,n0);return;}}
  if(from==='chat'&&iaPosible()&&navigator.onLine!==false){
    if(ui.pensando){const i=document.getElementById('chat-in');if(i&&!i.value)i.value=q;anunciar('Espera un momento: Lía está respondiendo.');return;}
    // Primero las reglas (pideIA). Si entienden, responden al instante y sin gastar cupo; esto incluye cambiar o quitar
    // una evaluación, que la IA todavía no sabe hacer y leería como una nueva.
    const r0=interpret(q,state,n0);if(!pideIA(r0)){responder(q,from,r0,n0);return;}
    const el=iaEleccion();
    if(el===null){ui.iaPendiente=q;ui.sheet=sheetIA();render();return;}
    if(el==='si'){conIA(q);return;}}
  const n=now();responder(q,from,interpret(q,state,n),n);}
// Responde una intención (de las reglas o de la IA). Con eco:false, el mensaje de la persona ya está en el chat.
function responder(q,from,r,n,{eco=true}={}){
  if(from==='chat'&&eco)state.chat.push({from:'me',text:q});
  // En Gratis, sin cupo para otra evaluación, avisa del límite antes de preguntar lo que falta (no tiene sentido
  // pedir la hora de algo que no se va a poder guardar). Una evaluación sin fecha todavía cuenta como próxima.
  if(r.intent==='pregunta'&&r.borrador&&r.borrador.intent==='add'){const t=ymd(n),nuevas=r.borrador.items.filter(i=>i.kind==='eval'&&(!i.date||i.date>=t)).length;
    if(nuevas&&nuevas>evalRoom()){state.borrador=null;ui.pending=null;ui.blockedItems=null;
      if(from==='chat'){liaSay(limitMsg(),{cta:'evals'});render();}else{save();openPaywall('evals');}return;}}
  // Falta un dato: Lía lo pregunta y guarda lo entendido. En el chat, con respuestas rápidas.
  if(r.intent==='pregunta'){state.borrador={intent:r.borrador.intent,items:r.borrador.items,i:r.borrador.i,at:n.getTime()};ui.pending=null;  // la pregunta reemplaza una propuesta sin confirmar
    if(from==='chat'){liaSay(r.texto,{opciones:r.opciones||[]});render();}else{save();toast(r.texto);}return;}
  // «¿Y si…?»: Lía lo prueba sin cambiar nada, dice qué pasaría y deja la propuesta para confirmar.
  if(r.intent==='simula'){
    if(from!=='chat'){responder(q,from,r.base,n,{eco});return;}
    state.borrador=null;const t=textoSimulacion(simular(state,r.base,n),!isPro()&&!!state.frozen);
    liaSay(t);
    if(r.base.intent==='except'){ui.pending={exs:r.base.exs,q};render();anunciar('Si quieres anotarlo, confirma.');return;}
    responder(q,'chat',r.base,n,{eco:false});return;}
  // Si no entendió la respuesta a su pregunta, la repite (el borrador sigue).
  const b=borradorVigente(state.borrador,n)?state.borrador:null;
  // Un «hola», «gracias» u «ok»: Lía responde y, si estaba preguntando algo, lo vuelve a preguntar.
  if(r.intent==='charla'){const t=textoCharla(r.tipo,n),p=b?preguntaPara(b.items[b.i],faltaDe(b.items[b.i]),state,n):null;
    if(from!=='chat'){toast(r.tipo==='ayuda'?'Escríbele a Lía en el chat: ahí te dice qué puede hacer.':t);return;}
    liaSay(p?`${t} ${p.texto}`:t,p?{opciones:p.opciones}:{});render();return;}
  if(r.intent==='help'&&b){const it=b.items[b.i],p=preguntaPara(it,faltaDe(it),state,n);
    if(from==='chat'){liaSay(`No te entendí. ${p.texto}`,{opciones:p.opciones});render();}else toast(`No te entendí. ${p.texto}`);return;}
  state.borrador=null;
  // Una evaluación que cambió o se canceló: en el chat, Lía propone y la persona confirma; en la caja de Evaluaciones
  // se aplica de una vez, con Deshacer (como lo que se agrega ahí).
  if(r.intent==='cambiaEval'||r.intent==='quitaEval'){const e=evById(r.evalId),decir=t=>{if(from==='chat'){liaSay(t);render();}else toast(t);};
    if(!e){decir('No encontré esa evaluación. Revísala en Evaluaciones.');return;}
    const c=r.intent==='quitaEval'?{accion:'quitar',evalId:e.id}:{accion:'mover',evalId:e.id,date:r.date||e.date,time:r.time||e.time};
    if(c.accion==='mover'&&c.date===e.date&&c.time===e.time){decir(`${cap(nombreEval(e))} ya es el ${fechaCorta(e.date)} a las ${e.time}.`);return;}
    const ch=c.accion==='mover'?textoChoques(choques(state,{kind:'eval',type:e.type,course:e.course,date:c.date,time:c.time},n,[e.id])):'';
    if(from==='chat'&&ch){ui.pending={cambio:c,q,choque:ch};save();render();anunciar(`Lía entendió: ${nombreEval(e)} pasa al ${fechaCorta(c.date)} a las ${c.time}. ${ch} ¿Lo guardo igual?`);return;}
    if(from==='chat'){ui.pending={cambio:c,q};save();render();
      anunciar(c.accion==='quitar'?`Lía entendió: quitar ${nombreEval(e)} del ${fechaCorta(e.date)}. Elige Quitar o Mantener.`:`Lía entendió: ${nombreEval(e)} pasa del ${fechaCorta(e.date)} a las ${e.time} al ${fechaCorta(c.date)} a las ${c.time}. Confirma o corrige.`);return;}
    toast(aplicarCambioEval(c),true);rerenderKeepScroll();return;}
  if(r.intent==='aviso'&&r.deCambio&&from!=='chat'){toast(r.texto);return;}
  if(r.intent==='add'){const ok=r.items;
    if(newEvalCount(ok)>evalRoom()){ui.blockedItems=ok;if(from==='chat'){liaSay(limitMsg(),{cta:'evals'});render();}else openPaywall('evals',{items:ok});return;}
    // Antes de guardar, Lía avisa si ya está o si se cruza con algo (iteración 3): «Guardar igual» o «Volver».
    const ch=textoChoqueLista(ok);
    if(from==='chat'){ui.pending={items:ok,q,...(ch?{choque:ch}:{})};save();render();anunciar(`Lía entendió: ${ok.map(resumenItem).join('; ')}. ${ch?ch+' ¿Lo guardo igual?':'Confirma o corrige.'}`);return;}
    if(ch){ui.choqueDictar={items:ok,from,q,texto:ch};ui.sheet=sheetChoqueDictar();render();return;}
    const hecho=applyItems(ok);
    toast(`Lía agregó: ${ok.map(resumenItem).join('; ')}.${textoAgendado(hecho.ids)}`,true);rerenderKeepScroll();return;}
  if(from!=='chat'){toast(from==='commit'?'No te entendí. Prueba: “clases de lunes a viernes de 8 a 1”.':'No te entendí. Prueba: “parcial de Química el viernes a las 10”.');return;}
  if(r.intent==='except'){const exs=r.exs,ch=textoChoqueLista(exs.filter(x=>!x.libre));
    if(ch){ui.pending={exs,q,choque:ch};render();anunciar(`Lía entendió: ${exs.map(x=>`${x.label}, ${fechaCorta(x.date)}, ${horario(x)}`).join('; ')}. ${ch} ¿Lo guardo igual?`);return;}
    if(isPro()&&state.settings.autonomy==='ask'){ui.pending={exs,q};render();anunciar(`Lía entendió: ${exs.map(x=>`${x.label}, ${fechaCorta(x.date)}, ${horario(x)}`).join('; ')}. Confirma o corrige.`);return;}
    const m=aplicarCambio(exs);liaSay(m.texto,m.opts);ui.pending=null;render();return;}
  if(r.intent==='aviso'){liaSay(r.texto);render();return;}
  if(r.intent==='log'){
    const e=evById(r.evalId),hoy=r.date===ymd(n);snapshot();
    state.done.push({id:uid(),evalId:e.id,date:r.date,start:hoy?fmt(Math.max(0,n.getHours()*60+n.getMinutes()-r.min)):'20:00',min:r.min});save();
    const falta=Math.max(0,Math.round(e.hours*60)-doneFor(state,e.id));
    liaSay(`Anoté ${hrs(r.min)} de ${e.course} (${hoy?'hoy':fechaCorta(r.date)}). ${falta?`Te ${faltaTxt(falta)}.`:'Ya completaste las horas que pedía.'}`,{undo:true});render();return;}
  if(r.intent==='agenda'){const p=P();const it=agendaFor(state,p,r.date);
    liaSay(it.length?`${cap(fechaLarga(r.date))}:\n${it.map(x=>`${fmt(x.s)}–${fmt(x.e)}  ${x.label}`).join('\n')}\nDuermes a las ${state.settings.sleep}.`:`${cap(fechaLarga(r.date))} lo tienes libre.`);render();return;}
  if(r.intent==='progress'){const p=P();const up=state.evals.filter(e=>e.date>=ymd(n));
    liaSay(up.length?up.map(e=>{const d=doneFor(state,e.id),need=e.hours*60;return `${e.course}: ${hrs(d)} de ${hrs(need)}${p.unmet[e.id]>0?` (${faltaTxt(p.unmet[e.id])} sin hueco)`:''}`;}).join('\n'):'No tienes evaluaciones próximas. ¿Me dices cuándo es la siguiente?');render();return;}
  if(r.intent==='next'){const e=state.evals.filter(e=>e.date>=ymd(n)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
    liaSay(e?`Tu próxima evaluación es ${EVAL_TYPES[e.type].label.toLowerCase()} de ${e.course}, el ${fechaLarga(e.date)} a las ${e.time}.`:'No tienes evaluaciones registradas.');render();return;}
  if(r.intent==='replan'&&!isPro()){
    if(canArm()){const p0=armWeek(false);liaSay(`Listo, armé tu semana: tienes ${hrs(p0.blocks.reduce((a,b)=>a+b.e-b.s,0))} de estudio agendadas.`);}
    else liaSay(`Ya armaste tu semana. En Gratis puedes volver a armarla desde el ${fechaLarga(nextArmDate())}. Con LIA Pro la reorganizo cuando quieras.`,{cta:'rearm'});
    render();return;}
  if(r.intent==='replan'){liaSay(`Listo, reorganicé todo: tienes ${hrs(P().blocks.reduce((a,b)=>a+b.e-b.s,0))} de estudio agendadas.`);render();return;}
  liaSay(AYUDA_CHAT);render();}
// ---------- Lía con IA: envío a la función lia-ia ----------
const IA_TIEMPO=15000;  // ms; la función corta a los 12 s, esto cubre la red del teléfono
const IA_NIVEL_GRATUITO=true;  // el respaldo es el nivel gratuito de Gemini: el aviso dice que Google puede usar los mensajes
// Desde el 2-nov-2026 la función pide primero a Groq (IA_PROVEEDOR) y, si no responde, a Gemini (IA_RESPALDO). Si cambia, cambia este aviso y el texto de iaCard().
// Los topes (25 al día y 300 al mes) los pone usar_ia() en Supabase (migración cupo_ia); si cambian, cambia también estos textos y el aviso.
const IA_AVISOS={
  cupo_dia:'Ya usaste tus 25 mensajes con IA de hoy. Hasta mañana te respondo con lo básico.',
  cupo_mes:'Ya usaste tus 300 mensajes con IA de este mes. Hasta el próximo mes te respondo con lo básico.',
  sesion:'Tu sesión venció: vuelve a iniciarla en Perfil para usar la IA. Mientras, te respondo con lo básico.',
  solo_pro:'La IA es parte de LIA Pro. Te respondo con lo básico.',
  ocupado:'La IA no respondió esta vez, así que te respondo con lo básico.'};
function pedirIA(cuerpo){
  return sb().then(c=>c.auth.getSession()).then(({data})=>{const t=data&&data.session&&data.session.access_token;
    if(!t)return{ok:false,error:'sesion'};
    const ctl=new AbortController(),reloj=setTimeout(()=>ctl.abort(),IA_TIEMPO);
    return fetch(`${SB_CFG.url}/functions/v1/lia-ia`,{method:'POST',signal:ctl.signal,
        headers:{'Content-Type':'application/json',apikey:SB_CFG.key,Authorization:`Bearer ${t}`},body:JSON.stringify(cuerpo)})
      .then(res=>res.json().catch(()=>null).then(d=>res.ok&&d&&d.ok?d:{ok:false,error:(d&&d.error)||'ocupado'}))
      .finally(()=>clearTimeout(reloj));});}
// Con IA: el mensaje aparece de inmediato, Lía "piensa" y responde con la propuesta revisada por validarIA().
// Sin respuesta útil (error, sin cupo, o la IA no entendió), responde con las reglas como siempre.
// El historial y el contexto se toman al enviar: lo que pase mientras Lía piensa no cambia lo que se preguntó.
async function conIA(q){const n=now(),cuerpo={mensaje:q,historial:historialIA(state.chat),contexto:contextoIA(state,n)};
  state.chat.push({from:'me',text:q});save();ui.pensando=true;render();anunciar('Lía está pensando…');
  let r=null,aviso='';
  try{const d=await pedirIA(cuerpo);
    if(d.ok){if(typeof d.restantes_dia==='number')ui.iaRestantes=d.restantes_dia;const v=validarIA(d.respuesta,state,n);if(v.intent!=='help')r=v;}
    else{aviso=IA_AVISOS[d.error]||IA_AVISOS.ocupado;if(d.error==='cupo_dia'||d.error==='cupo_mes')ui.iaRestantes=0;
      if(d.error==='solo_pro')refrescarPlan(true).catch(()=>{});}}
  catch(e){aviso=IA_AVISOS.ocupado;}
  conservarBorrador(()=>{ui.pensando=false;if(aviso)liaSay(aviso);responder(q,'chat',r||interpret(q,state,n),n,{eco:false});});}
// Si la persona empezó a escribir mientras Lía pensaba, lo que escribió sigue en la caja cuando llega la respuesta.
function conservarBorrador(fn){const i=document.getElementById('chat-in'),v=i?i.value:'';fn();const j=document.getElementById('chat-in');if(j&&v&&!j.value)j.value=v;}
function sheetIA(){return `<div class="grab"></div><h2>Lía con IA</h2>
  <p class="muted" style="margin:0">Para entender lo que escribes, Lía envía tu mensaje y un resumen de tu horario (cursos, evaluaciones y rutinas) a servicios de IA de empresas de Estados Unidos: Groq y, si no responde, Gemini de Google. No envía tu nombre ni tu correo.</p>
  <p class="muted" style="margin:0">${IA_NIVEL_GRATUITO?'Groq no guarda tus mensajes, salvo registros temporales para revisar fallas o abusos. Gemini, en su versión gratuita, sí puede usarlos para mejorar los productos de Google. No escribas datos personales que no quieras compartir.':'Ni Groq ni Google usan esos mensajes para mejorar sus productos.'}</p>
  <p class="small muted" style="margin:0">Tienes 25 mensajes con IA al día. Sin internet o si la IA falla, Lía sigue entendiendo frases simples. Puedes apagarla cuando quieras en Perfil.</p>
  <button class="btn pri" data-a="ia-si">Usar Lía con IA</button><button class="btn sec" data-a="ia-no">Ahora no</button>`;}
// Si la persona cierra el aviso sin elegir, su mensaje se responde con las reglas y la próxima vez se le vuelve a preguntar.
function soltarPendienteIA(){const q=ui.iaPendiente;ui.iaPendiente=null;if(q){const n=now();responder(q,'chat',interpret(q,state,n),n);}else render();}
// Aplica cambios de un día (algo que ocupa o algo que se libera) y devuelve qué decirle a la persona.
// Con quitar, reemplaza un evento que se editó (Deshacer lo devuelve como estaba).
function aplicarCambio(exs,{quitar}={}){const p0=P(),fresco=!!state.frozen&&!planStale();snapshot();if(quitar)state.exceptions=state.exceptions.filter(x=>x.id!==quitar&&!(x.libre&&x.ref===quitar));for(const ex of exs)state.exceptions.push({id:uid(),...ex});save();
  const p1=P(),ex=exs[0],r=intervalo(ex.start,ex.end),dia=fechaCorta(ex.date);
  const nuevos=()=>p1.blocks.filter(b=>b.date===ex.date&&!p0.blocks.some(x=>x.date===b.date&&x.s===b.s&&x.evalId===b.evalId));
  if(ex.libre){const que=ex.label==='Salida temprano'?`el ${dia} sales a las ${ex.start}`:ex.label==='Entrada más tarde'?`el ${dia} entras a las ${ex.end}`:`el ${dia} no tienes ${exs.map(x=>x.label.replace(/^Sin /,'')).join(' ni ')}`;
    if(!isPro())return{texto:`Listo: ${que}. En Gratis no reorganizo sola: ${canArm()?'rearma tu semana para usar ese tiempo':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}.`,opts:{undo:true,cta:canArm()?null:'reorg'}};
    const cursos=[...new Set(nuevos().map(b=>evById(b.evalId).course))];
    return{texto:`Listo: ${que}.${cursos.length?` Usé ese tiempo para estudiar ${cursos.join(' y ')}.`:''}`,opts:{undo:true}};}
  const msg=`Anotado: ${ex.label.charAt(0).toLowerCase()+ex.label.slice(1)} el ${dia} de ${ex.start} a ${ex.end}.`,choca=b=>b.date===ex.date&&b.s<r.e&&b.e>r.s;
  if(!isPro()){const hit=p1.blocks.filter(choca);
    if(!hit.length){alDiaSiNoChoca(fresco);return{texto:msg+' No choca con tu estudio.',opts:{undo:true}};}
    if(esOcio({kind:'excepcion',cat:ex.cat})&&state.frozen){const t=reubicarOcio();alDiaSiNoChoca(fresco);return{texto:`${msg} ${t}`,opts:{undo:true}};}
    const e=evById(hit[0].evalId);
    return{texto:msg+` Choca con tu bloque de ${e?e.course:'estudio'} a las ${fmt(hit[0].s)}. En Gratis no reorganizo sola: ${canArm()?'puedes rearmar tu semana ahora':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}. Con LIA Pro lo muevo al instante.`,opts:{undo:true,cta:'reorg'}};}
  let extra=' No chocaba con tu estudio.';
  if(p0.blocks.some(choca)){const g={};for(const b of nuevos()){const c=evById(b.evalId).course;(g[c]=g[c]||[]).push(fmt(b.s));}
    extra=Object.keys(g).length?` Moví ${Object.entries(g).map(([c,ts])=>`${c} a las ${ts.join(' y ')}`).join('; ')}.`:' Reacomodé tus bloques en otros días.';}
  return{texto:msg+extra+` Igual duermes a las ${state.settings.sleep}.`,opts:{undo:true}};}

 'cuenta-registrar':d=>abrirCuenta('registro',d.pro==='1'),
 'cuenta-ingresar':d=>abrirCuenta('ingreso',d.pro==='1'),
 'cuenta-recuperar':()=>{const f=ui.cuentaForm;abrirCuenta('recuperar',!!(f&&f.paraPro));},
 'cuenta-reenviar':()=>{const f=ui.cuentaForm;if(!f||f.cargando||f.esperaHasta>Date.now())return;f.error=null;f.aviso=null;f.cargando=true;
   sb().then(c=>c.auth.resend({type:'signup',email:f.email,options:{emailRedirectTo:location.origin+location.pathname}})).then(({error})=>{if(error)throw error;
       anotarRegistro();f.cargando=false;f.esperaHasta=Date.now()+60000;f.aviso='Te lo volvimos a enviar. Si no llega en unos minutos, revisa la carpeta de spam.';if(ui.cuentaForm===f&&ui.sheet)pintarCuenta();})
     .catch(e=>{f.cargando=false;f.error=mensajeError(e);if(ui.cuentaForm===f&&ui.sheet)pintarCuenta();});},
 'ver-clave':(d,el)=>{const i=document.getElementById('cu-pass'),f=ui.cuentaForm;if(!i)return;const ver=i.type==='password';i.type=ver?'text':'password';
   el.textContent=ver?'Ocultar':'Mostrar';el.setAttribute('aria-label',`${ver?'Ocultar':'Mostrar'} contraseña`);if(f){f.ver=ver;f.pass=i.value;ui.sheet=sheetCuenta();}},
 'cuenta-salir':()=>{ui.sheet=`<div class="grab"></div><h2>¿Cerrar sesión?</h2><p class="muted" style="margin:0">En este dispositivo vuelves a LIA Gratis. Tus horarios y evaluaciones no se borran${isPro()?', y tu plan Pro sigue en tu cuenta':''}.</p><button class="btn pri" data-a="cuenta-salir-ok">Cerrar sesión</button><button class="btn sec" data-a="close">Cancelar</button>`;render();},
 'cuenta-salir-ok':()=>{ui.sheet=null;render();ui.authBusy=true;
   const fin=()=>{ui.authBusy=false;try{localStorage.removeItem('lia.auth');}catch(e){}quitarCuenta();rerenderKeepScroll();toast('Cerraste sesión. Estás en LIA Gratis.');};
   sb().then(c=>c.auth.signOut({scope:'local'})).then(fin,fin);},
});

// ---------- Versión y modo de la app ----------
const APP_VERSION='0.12.0';
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function calm(){const a=document.activeElement;return !ui.sheet&&!ui.session&&!ui.listen&&!(a&&a.matches('input,select'));}
// ---------- Métricas de uso (anónimas) ----------
// Para saber si LIA sirve: cuántas instalaciones terminan el registro y cuántas vuelven al día 1 y al día 3.
// Solo se envía un identificador al azar de esta instalación, el evento, el día, el tipo de teléfono, si la app está
// instalada y si es Pro. Nunca horarios, cursos, mensajes, nombre ni correo. Se puede apagar en Perfil.
// En localhost no se envía nada (salvo con lia.metricas = 'forzar', para probar).
const METRICAS_KEY='lia.metricas',METRICAS_ENV='lia.metricas.enviado',INSTALACION_KEY='lia.instalacion';
function metricasActivas(){try{const v=localStorage.getItem(METRICAS_KEY);if(v==='no')return false;if(v==='forzar')return true;}catch(e){return false;}
  return !!(SB_CFG.url&&SB_CFG.key)&&!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);}
function idInstalacion(){try{let id=localStorage.getItem(INSTALACION_KEY);
  if(!id){const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
    id=`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;localStorage.setItem(INSTALACION_KEY,id);}
  return id;}catch(e){return null;}}
// Cada evento sale una vez (instalacion, registro) o una vez por día (abre).
function evento(nombre,diaDe){if(!metricasActivas())return;const id=idInstalacion();if(!id)return;
  const dia=diaDe||ymd(now());let env={};try{env=JSON.parse(localStorage.getItem(METRICAS_ENV)||'{}')||{};}catch(e){}
  const porDia=nombre==='abre'||nombre==='estudio'||nombre==='madrugada',clave=porDia?nombre+':'+dia:nombre;if(env[clave])return;
  const plataforma=isIOS()?'ios':/android/i.test(navigator.userAgent)?'android':'otro';
  fetch(SB_CFG.url+'/rest/v1/rpc/registrar_evento',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',apikey:SB_CFG.key,Authorization:'Bearer '+SB_CFG.key},
    body:JSON.stringify({p_instalacion:id,p_evento:nombre,p_dia:dia,p_plataforma:plataforma,p_instalada:isStandalone(),p_pro:isPro()})})
    .then(r=>{if(!r.ok)return;try{const e2=JSON.parse(localStorage.getItem(METRICAS_ENV)||'{}')||{};const viejo=ymd(addDays(now(),-3));for(const k of Object.keys(e2))if(/^(abre|estudio|madrugada):/.test(k)&&k.split(':')[1]<viejo)delete e2[k];e2[clave]=1;localStorage.setItem(METRICAS_ENV,JSON.stringify(e2));}catch(e){}})
    .catch(()=>{});}
// Noches con estudio de ayer y hoy, y si pasaron la medianoche (sin cursos ni horas: solo el día y el evento).
function eventosEstudio(){const n=now(),hoy=ymd(n),ayer=ymd(addDays(n,-1)),a=nochesDeEstudio(state,{blocks:[]},ayer,hoy);
  for(const d of a.dias)evento('estudio',d);for(const d of a.diasTarde)evento('madrugada',d);}
function metricasCard(){if(!SB_CFG.url)return '';let on=true;try{on=localStorage.getItem(METRICAS_KEY)!=='no';}catch(e){}
  return `<label class="opt"><input type="checkbox" data-metricas ${on?'checked':''}><span><b>Ayudar a mejorar LIA</b><br><span class="small muted">Contamos de forma anónima cuántas personas abren la app, terminan el registro y en qué noches estudian (y si fue después de medianoche). No enviamos tus horarios, cursos, mensajes ni tu nombre.</span></span></label>`;}
// Dónde viven los datos (desde la 0.12.0 ya no se ofrece instalar LIA; quien la instaló la sigue usando igual).
function datosCard(){return isStandalone()?'<div class="card small muted">Todo se guarda solo en este dispositivo, dentro de la app. Si la desinstalas o borras los datos del navegador, se pierde.</div>'
  :'<div class="card small muted">Todo se guarda solo en este navegador. Si borras los datos del navegador, se pierde.</div>';}
// Sin esto, Chrome en Android muestra su propia barra de «Instalar»: LIA ya no lo ofrece (decisión del 4-nov).
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});

// Otra pestaña (o la app instalada) guardó cambios: se adoptan para no pisarlos después con una copia vieja.
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;let nuevo=null;try{nuevo=JSON.parse(e.newValue);}catch(err){return;}
  if(!nuevo||nuevo.v!==1)return;state=nuevo;undoStack=null;ensureState();if(calm())rerenderKeepScroll();});

render();
limpiarAvisosViejos();
evento('instalacion');evento('abre');eventosEstudio();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){evento('abre');eventosEstudio();}});
// Retoma una sesión de estudio que seguía abierta; si el tiempo se acabó con la app cerrada, la registra.
(function(){let g=null;try{g=JSON.parse(localStorage.getItem(KEY_SES));}catch(e){}if(!g)return;
  if(!evById(g.ev)||![g.total,g.acc,g.since].every(Number.isFinite)||!(g.total>0)){ui.session=null;guardarSesion();return;}
  if(!Number.isFinite(g.inicio))delete g.inicio;
  ui.session=nuevaSesion(g);ui.session.preguntar=false;
  if(ui.session.running&&ui.session.elapsed()>=ui.session.total){const s=ui.session,e=evById(s.ev),min=minutosSesion(s);cerrarSesion();registrarSesion(s,min);render();
    toast(`Tu sesión terminó mientras LIA estaba cerrada. Registré ${hrs(min)} de ${e.course}.`,true);return;}
  render();tick();pedirPantalla();})();
iniciarCuentas();
alVolverDeGoogle();
if(state.cuenta&&state.gcal&&state.gcal.fuente==='google')cargarGoogle();
if(state.cuenta)cargarCanales();   // lo que se confirmó por WhatsApp mientras LIA estaba cerrada, y la agenda al día
setInterval(()=>{if(!ui.session&&!ui.sheet&&!ui.listen&&!document.activeElement.matches('input,select'))rerenderKeepScroll();},60000);
</script>
