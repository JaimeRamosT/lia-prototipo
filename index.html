<style>
/* Base: márgenes seguros del teléfono (notch y barra inferior). */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
/* Inter 4 (SIL Open Font License 1.1, ver fonts/OFL.txt), alojada aquí para que la app funcione sin internet. */
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: one-column phone app (max 440px) — scrolling view + fixed tab bar; sheets slide up from the bottom. */
/* Colores: --x es el acento (texto, bordes, foco), --x-fill el relleno que lleva texto blanco encima, --x-soft el fondo suave
   y --x-ink el texto sobre ese fondo. Cada par texto/fondo llega a 4.5:1 en claro y en oscuro (pruebas de contraste). */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1C1B29; --mute:#6B6A7B; --line:#E6E2D9;
  --pri:#3D3BF3; --pri-ink:#FFFFFF; --pri-soft:#ECEBFF; --pri-sub:#C9C8FF;
  --clase:#E8EBF2; --clase-ink:#1C1B29; --trabajo:#FFE6BA; --trabajo-ink:#5A3B00;
  /* Categorías de rutinas y eventos: fondo / texto (4.5:1 o más, también el texto pequeño al 85 %) */
  --traslado:#DCEEF7; --traslado-ink:#0B4763; --comida:#EEF2D3; --comida-ink:#4A5210; --curso:#D7F1EE; --curso-ink:#0B4A44;
  --deporte:#E4F1EA; --deporte-ink:#1F4D33; --ocio:#FBE3EE; --ocio-ink:#7A1C47; --casa:#ECE6F8; --casa-ink:#43307A;
  --otro:#EDEBE5; --otro-ink:#3D3B36; --exam:#FF5A4E; --exam-soft:#FFEFEC; --exam-ink:#B4271B;
  --ok:#1E9E5A; --ok-soft:#E3F7EC; --ok-ink:#13703F; --pri-strong:#3D3BF3; --night:#16153A; --night-ink:#FFFFFF; --shadow:rgba(28,27,41,.10);
  --badge-bg:#3D3BF3; --badge-ink:#FFFFFF;
  /* Rellenos con texto blanco encima (4.5:1 o más) y enlace dentro del aviso */
  --pri-fill:#3D3BF3; --exam-fill:#CF3529; --toast-link:#C9C8FF;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121220; --surface:#1C1B2E; --ink:#EEEDF7; --mute:#A3A2B8; --line:#2D2C44;
  --pri:#8A88FF; --pri-ink:#FFFFFF; --pri-soft:#26254A; --pri-sub:#D3D2FF;
  --clase:#26283A; --clase-ink:#E0E2EE; --trabajo:#3D2F14; --trabajo-ink:#FFD891;
  --traslado:#13303D; --traslado-ink:#A6DDF5; --comida:#2B2F16; --comida-ink:#D9E59A; --curso:#123532; --curso-ink:#93E0D6;
  --deporte:#1D3327; --deporte-ink:#A8E6C3; --ocio:#3B1C2B; --ocio-ink:#F7B3D2; --casa:#2A2340; --casa-ink:#D2C5F5;
  --otro:#2A2925; --otro-ink:#E2DFD6; --exam:#FF6F64; --exam-soft:#3A1E1E; --exam-ink:#FF9F97;
  --ok:#4CC98A; --ok-soft:#173326; --ok-ink:#4CC98A; --pri-strong:#3D3BF3; --night:#0B0B19; --night-ink:#FFFFFF; --shadow:rgba(0,0,0,.4);
  --badge-bg:#D3D2FF; --badge-ink:#16153A; --pri-fill:#5754E8; --exam-fill:#C9372D; --toast-link:#3D3BF3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121220; --surface:#1C1B2E; --ink:#EEEDF7; --mute:#A3A2B8; --line:#2D2C44;
  --pri:#8A88FF; --pri-ink:#FFFFFF; --pri-soft:#26254A; --pri-sub:#D3D2FF;
  --clase:#26283A; --clase-ink:#E0E2EE; --trabajo:#3D2F14; --trabajo-ink:#FFD891;
  --traslado:#13303D; --traslado-ink:#A6DDF5; --comida:#2B2F16; --comida-ink:#D9E59A; --curso:#123532; --curso-ink:#93E0D6;
  --deporte:#1D3327; --deporte-ink:#A8E6C3; --ocio:#3B1C2B; --ocio-ink:#F7B3D2; --casa:#2A2340; --casa-ink:#D2C5F5;
  --otro:#2A2925; --otro-ink:#E2DFD6; --exam:#FF6F64; --exam-soft:#3A1E1E; --exam-ink:#FF9F97;
  --ok:#4CC98A; --ok-soft:#173326; --ok-ink:#4CC98A; --pri-strong:#3D3BF3; --night:#0B0B19; --night-ink:#FFFFFF; --shadow:rgba(0,0,0,.4);
  --badge-bg:#D3D2FF; --badge-ink:#16153A; --pri-fill:#5754E8; --exam-fill:#C9372D; --toast-link:#3D3BF3; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body.wm{background:#3D3BF3}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
/* Los títulos que reciben el foco por código (al abrir una hoja) no son controles: sin contorno. */
h1[tabindex="-1"]:focus-visible,h2[tabindex="-1"]:focus-visible,[data-foco]:focus-visible{outline:none}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:8px 10px;border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute);padding-block:4px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pri);font-weight:600}
.tab .av{width:40px;height:40px}
/* type */
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:600}
.kicker{font-size:13px;color:var(--mute);font-weight:500}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row-h{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.hero{background:var(--pri-fill);color:var(--pri-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:var(--pri-ink);opacity:.9}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.hero-t{font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance}
/* La evaluación del día, primero en Hoy */
.evhoy{border:1.5px solid var(--exam)}
.evhoy .eyebrow,.evhoy-a{color:var(--exam-ink)}
.evhoy-t{font-size:20px;font-weight:700;line-height:1.25}
.evhoy-a{font-weight:600}
.note{background:var(--pri-soft);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.note b{color:var(--pri)}
.warn{background:var(--exam-soft);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.warn b{color:var(--exam-ink)}
.night{background:var(--night);color:var(--night-ink);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.night .sub{opacity:.75;font-size:13px}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--pri);border-radius:14px;padding:10px 12px;font-size:13px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:52px;border-radius:14px;font-weight:600;font-size:16px;padding:0 18px;width:100%}
.btn.pri{background:var(--pri-fill);color:var(--pri-ink)}
.btn.light{background:var(--surface);color:var(--pri)}
.btn.sec{background:var(--surface);color:var(--pri);border:1.5px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--exam-ink);border:1.5px solid var(--line)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--pri-soft);color:var(--pri)}
.pill.solid{background:var(--pri-fill);color:var(--pri-ink)}
.pill.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.dashed{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--pri);color:var(--pri);border-radius:16px;padding:10px 12px;font-weight:600;width:100%}
.dashed .grow{text-align:left}
.mic{width:36px;height:36px;border-radius:50%;background:var(--pri-fill);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.mic svg{width:18px;height:18px}
.ico{width:22px;height:22px;flex:none}
/* avatar */
.av{border-radius:50%;background:linear-gradient(135deg,#3D3BF3,#A855F7);display:grid;place-items:center;flex:none;color:#fff}
.av svg{width:55%;height:55%}
/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;width:100%}
.ag .t{font-size:13px;color:var(--mute);font-weight:500;padding-top:12px}
.blk{border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.blk b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.blk small{font-size:13px;opacity:.85}
.k-estudio small,.k-examen small,.k-hecho small,.k-libre small{opacity:1}
.k-clase{background:var(--clase);color:var(--clase-ink)}
.k-trabajo{background:var(--trabajo);color:var(--trabajo-ink)}
.k-traslado{background:var(--traslado);color:var(--traslado-ink)}
.k-comida{background:var(--comida);color:var(--comida-ink)}
.k-curso{background:var(--curso);color:var(--curso-ink)}
.k-deporte{background:var(--deporte);color:var(--deporte-ink)}
.k-ocio{background:var(--ocio);color:var(--ocio-ink)}
.k-casa{background:var(--casa);color:var(--casa-ink)}
.k-otro{background:var(--otro);color:var(--otro-ink)}
/* Ícono de la categoría dentro del bloque: el color nunca va solo */
.blk b .ki{display:inline-flex;width:16px;height:16px;margin-right:6px;vertical-align:-2px}
.blk b .ki svg,.sw .ki svg{width:100%;height:100%}
.sw .ki{display:inline-flex;width:22px;height:22px}
.ico .ki,.ico .ki svg{display:block;width:100%;height:100%}
/* Lo que se liberó solo ese día */
.k-libre{background:transparent;color:var(--ok-ink);border:1.5px dashed var(--ok)}
/* «Tu día» completo: un hueco libre se toca para agregar algo. La barra del día es decorativa: el resumen va en texto. */
.k-hueco{background:transparent;color:var(--mute);border:1.5px dashed var(--mute)}
.k-hueco small{opacity:1}
.dia-res{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.dia-res p{margin:0}
.barra-dia{position:relative;height:12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.barra-dia i{position:absolute;top:0;bottom:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 30%,transparent)}
.dia-res p span{white-space:nowrap}
.k-excepcion{background:repeating-linear-gradient(135deg,var(--clase) 0 8px,var(--surface) 8px 16px);color:var(--clase-ink);border:1px solid var(--line)}
.k-estudio{background:var(--pri-fill);color:var(--pri-ink)}
.k-hecho{background:var(--ok-soft);color:var(--ok-ink)}
.k-examen{background:var(--exam-fill);color:#fff}
.k-dormir{background:var(--night);color:var(--night-ink)}
/* Lo que ya pasó: se ve atenuado sin bajar el contraste del texto (con opacidad quedaba en 2.5:1) */
.ag.past .blk{background:var(--surface);color:var(--mute);border:1px dashed var(--line)}
.ag.past .blk small{opacity:1}
.day.past:not([aria-pressed="true"]) b{color:var(--mute)}
.stack.past .item{background:transparent;border-style:dashed}
.stack.past .item b,.stack.past .item .tag{color:var(--mute)!important}
.stack.past .sw{background:var(--line);color:var(--mute)}
/* lists */
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.sw{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo .item{text-align:left}
/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.day span{font-size:12px;color:var(--mute);font-weight:500}
.day b{font-size:17px;font-weight:600}
.day[aria-pressed="true"]{background:var(--pri-fill);border-color:var(--pri-fill);color:var(--pri-ink)}
.day[aria-pressed="true"] span{color:var(--pri-ink);opacity:.9}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--pri)}
.day[aria-pressed="true"] .dot{background:var(--pri-ink)}
.day .dot.x{background:var(--exam)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;color:var(--pri);font-weight:700}
.stat span{font-size:12px;color:var(--mute)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;max-width:84%;white-space:pre-line;display:flex;flex-direction:column;gap:8px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--pri-fill);color:var(--pri-ink);border-color:var(--pri-fill);border-radius:16px 16px 4px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.inbar{display:flex;gap:10px;align-items:center;padding-block:8px}
.inbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:13px 16px}
.inbar .mic{width:48px;height:48px}
.inbar .mic svg{width:22px;height:22px}
/* forms */
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f select,.clave input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:400;color:var(--ink);font-size:16px;width:100%;min-width:0}
.clave{position:relative;display:block}
.clave input{padding-right:88px}
.clave .ver{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:44px;padding:0 12px;font-size:13px;font-weight:600;color:var(--pri);border-radius:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:340px){.two:has(input[type=time]){grid-template-columns:minmax(0,1fr)}}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dpick label{display:grid;place-items:center;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink)}
.dpick input{position:absolute;opacity:0;pointer-events:none}
.dpick input:checked+span{color:var(--pri-ink)}
.dpick label:has(input:focus-visible){outline:2px solid var(--pri);outline-offset:2px}
.dpick label:has(input:checked){background:var(--pri-fill);border-color:var(--pri-fill);color:var(--pri-ink)}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
/* Categoría: opciones de radio con ícono y nombre, de 44 px de alto. La elegida lleva borde de su color de texto. */
.tipos-f{border:0;margin:0;padding:0;min-width:0}
.tipos-f legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--mute)}
.tipos{display:flex;flex-wrap:wrap;gap:8px}
.tipo{position:relative}
.tipo input{position:absolute;opacity:0;pointer-events:none}
.tipo>span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;border:2px solid transparent}
.tipo>span .ki{display:inline-flex;width:18px;height:18px}.tipo>span .ki svg{width:100%;height:100%}
.tipo input:checked+span{border-color:currentColor}
.tipo input:checked+span::after{content:"✓";font-weight:700}
.tipo input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.tramo{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.aviso-cruce{color:var(--trabajo-ink);font-weight:600}
/* Vacío sigue en el árbol de accesibilidad (aria-live) pero sin dejar hueco */
.aviso-cruce:empty{margin-top:-10px}
.opt:has(input:checked){border-color:var(--pri)}
.opt input{accent-color:var(--pri);width:20px;height:20px;flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,25,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;
  padding-block:20px max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
/* En una hoja larga, nada se encoge para caber: la hoja se desplaza (antes la tabla de planes quedaba debajo de los botones). */
.sheet>*{flex-shrink:0}
/* full overlays */
.full{position:fixed;inset:0;z-index:40;background:var(--night);color:var(--night-ink);display:flex;justify-content:center}
.full .in{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.full .top{width:100%;display:flex;justify-content:space-between;font-size:14px;opacity:.75}
.full .glass{background:rgba(255,255,255,.08);border-radius:16px;padding:14px;width:100%;text-align:left;display:flex;gap:12px;align-items:center}

<body>
<div class="app" id="app">
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div>
<div id="layer"></div>
<div id="toastbox" role="status" aria-live="polite"></div>
<div id="anuncio" class="sr-only" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/*LOGIC-START*/
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0);};
const fmt=m=>{m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+':'+pad(m%60);};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayDiff=(a,b)=>Math.round((fromYmd(b)-fromYmd(a))/864e5);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C=['D','L','M','M','J','V','S'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const EVAL_TYPES={parcial:{label:'Parcial',h:5,exam:true},examen:{label:'Examen',h:5,exam:true},final:{label:'Final',h:6,exam:true},practica:{label:'Práctica',h:3,exam:true},control:{label:'Control',h:2,exam:true},entrega:{label:'Entrega',h:4,exam:false},exposicion:{label:'Exposición',h:3,exam:false}};
// Categorías de rutinas y de lo que pasa un solo día. El orden es el de los formularios.
const COMMIT_TYPES={clase:'Clases',trabajo:'Trabajo',traslado:'Traslado',comida:'Comidas',curso:'Curso o taller',deporte:'Deporte',ocio:'Ocio y descanso',casa:'Familia y casa',otro:'Otro'};
// Un tipo que esta versión no conoce (por ejemplo, datos de una versión más nueva) se muestra como «Otro».
const tipoRutina=t=>COMMIT_TYPES[t]?t:'otro';
const uid=()=>Math.random().toString(36).slice(2,9);
const hrs=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`;};
const fechaLarga=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;};
const fechaCorta=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;};

function subtract(wins,s,e){const out=[];for(const w of wins){if(e<=w.s||s>=w.e){out.push(w);continue;}if(s>w.s)out.push({s:w.s,e:s});if(e<w.e)out.push({s:e,e:w.e});}return out;}
// Un día de estudio va de la hora de despertar a la de dormir. Si se duerme después de medianoche (00:30),
// el día termina en el minuto 1470; un horario que termina al día siguiente (22:00–06:00) funciona igual.
const MARGEN_DESPERTAR=30;  // nadie estudia apenas abre los ojos
function finDelDia(S){const w=toMin(S.wake);let s=toMin(S.sleep);if(s<=w)s+=1440;return s;}
function intervalo(start,end){const s=toMin(start);let e=toMin(end);if(e<s)e+=1440;return{s,e};}
function busyFor(state,date){const wd=fromYmd(date).getDay(),ayer=(wd+6)%7,prev=ymd(addDays(fromYmd(date),-1));const b=[];
  // Lo liberado solo ese día ("hoy no tengo clases", "salgo temprano", un rato de ocio para estudiar) se descuenta
  // de esa rutina o de ese evento de un día.
  const libres=(c,d,desfase)=>state.exceptions.filter(x=>x.libre&&x.ref===c.id&&x.date===d).map(x=>{const r=intervalo(x.start,x.end);return[r.s+desfase,r.e+desfase];});
  const poner=(c,s,e,extra,quitar)=>{let partes=[{s,e}];for(const [ls,le] of quitar)partes=subtract(partes,ls,le);
    for(const q of partes)if(q.e>q.s)b.push({s:q.s,e:q.e,kind:tipoRutina(c.type),label:c.name,ref:c.id,...extra});};
  for(const c of state.commitments){const r=intervalo(c.start,c.end);
    if(c.days.includes(wd))poner(c,r.s,r.e,{},libres(c,date,0));
    if(r.e>1440&&c.days.includes(ayer))poner(c,0,r.e-1440,{cola:true},libres(c,prev,-1440));}  // sigue desde anoche
  for(const x of state.exceptions){if(x.libre)continue;const r=intervalo(x.start,x.end),base={kind:'excepcion',label:x.label,ref:x.id,cat:x.cat};
    if(x.date===date)poner(x,r.s,r.e,base,libres(x,date,0));
    else if(x.date===prev&&r.e>1440)poner(x,0,r.e-1440,{...base,cola:true},libres(x,prev,-1440));}
  return b;}
// Rutinas con varios horarios (decisión del 28-oct): cada horario es un compromiso y los de una misma rutina
// comparten grupo. Así el formato de los datos guardados no cambia (v:1).
function agruparRutinas(cs){const out=[],ix={};
  for(const c of cs){const k=c.grupo||c.id;if(ix[k]===undefined){ix[k]=out.length;out.push({id:c.id,grupo:c.grupo||null,name:c.name,type:c.type,tramos:[]});}out[ix[k]].tramos.push(c);}
  return out;}
// Rutinas con las que se cruza un horario {days,start,end}, sin contar las de excluir (los horarios de la misma rutina).
// Un horario que pasa la medianoche también se cruza con lo que hay temprano al día siguiente.
function crucesTramo(cs,t,excluir){if(!t.days.length||!HHMM.test(t.start)||!HHMM.test(t.end)||t.start===t.end)return[];
  const r=intervalo(t.start,t.end),out=[];
  for(const c of cs){if(excluir.includes(c.id))continue;const q=intervalo(c.start,c.end);
    const mismo=t.days.some(d=>c.days.includes(d))&&r.s<q.e&&q.s<r.e;
    const sigueT=r.e>1440&&t.days.some(d=>c.days.includes((d+1)%7))&&r.e-1440>q.s;
    const sigueC=q.e>1440&&c.days.some(d=>t.days.includes((d+1)%7))&&q.e-1440>r.s;
    if(mismo||sigueT||sigueC)out.push(c);}
  return out;}
// Todo lo ocupado dentro de un día de estudio, incluida la madrugada siguiente cuando se duerme después de medianoche.
function ocupadoMarco(state,date,fin){const o=busyFor(state,date).map(b=>[b.s,b.e]);
  for(const x of state.done)if(x.date===date)o.push([toMin(x.start),toMin(x.start)+x.min]);
  for(const e of state.evals)if(e.date===date)o.push([toMin(e.time)-30,toMin(e.time)+120]);
  if(fin>1440){const m=ymd(addDays(fromYmd(date),1));
    for(const b of busyFor(state,m))if(!b.cola)o.push([b.s+1440,b.e+1440]);
    for(const x of state.done)if(x.date===m)o.push([toMin(x.start)+1440,toMin(x.start)+1440+x.min]);
    for(const e of state.evals)if(e.date===m)o.push([toMin(e.time)+1410,toMin(e.time)+1560]);}
  return o;}
function evalDeadline(ev,S){const t=EVAL_TYPES[ev.type]||EVAL_TYPES.parcial;
  if(t.exam)return{date:ymd(addDays(fromYmd(ev.date),-1)),end:finDelDia(S)};
  return{date:ev.date,end:Math.min(toMin(ev.time)-60,finDelDia(S))};}
function doneFor(state,id){return state.done.filter(x=>x.evalId===id).reduce((a,x)=>a+x.min,0);}

// Motor de horarios: reparte las horas que pide cada evaluación en los huecos libres reales.
// Con soloIds, reparte solo esas evaluaciones (las demás siguen ocupando la hora de su examen).
function plan(state,now,soloIds){
  const S=state.settings,wake=toMin(S.wake)+MARGEN_DESPERTAR,sleep=finDelDia(S);
  const today=ymd(now),nowMin=now.getHours()*60+now.getMinutes();
  const evs=state.evals.filter(e=>!soloIds||soloIds.includes(e.id)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let last=ymd(addDays(now,6));for(const e of evs)if(e.date>last)last=e.date;
  const nDays=Math.min(dayDiff(today,last),60);const days={};
  for(let i=0;i<=nDays;i++){const d=ymd(addDays(fromYmd(today),i));let wins=wake<sleep?[{s:wake,e:sleep}]:[];
    if(i===0)wins=subtract(wins,0,Math.ceil((nowMin+10)/15)*15);
    for(const [s,e] of ocupadoMarco(state,d,sleep))wins=subtract(wins,s,e);
    days[d]={wins,load:0,free:wins.reduce((a,w)=>a+w.e-w.s,0)};}
  for(const x of state.done)if(days[x.date])days[x.date].load+=x.min;
  const blocks=[],unmet={};
  for(const ev of evs){
    let rem=Math.max(0,Math.round(ev.hours*60)-doneFor(state,ev.id));
    const dl=evalDeadline(ev,S);
    if(dl.date<today){unmet[ev.id]=ev.date<today?0:rem;continue;}
    const dlist=Object.keys(days).filter(d=>d<=dl.date).sort();
    const evLoad={};let progress=true;
    while(rem>=10&&progress){progress=false;
      for(const d of dlist){if(rem<10)break;const day=days[d];
        const avail=Math.min(S.maxDay-day.load,120-(evLoad[d]||0));
        const need=S.minBlock;  // ningún bloque más corto que el mínimo, aunque falte menos tiempo
        if(avail<need)continue;
        const limit=d===dl.date?dl.end:sleep;
        const cands=day.wins.map(w=>({s:w.s,e:Math.min(w.e,limit)})).filter(w=>w.e-w.s>=need);
        if(!cands.length)continue;
        cands.sort((a,b)=>(b.e-b.s)-(a.e-a.s)||a.s-b.s);
        const w=cands[0];let len=Math.min(S.block,Math.max(rem,need),avail,w.e-w.s);
        len=Math.floor(len/5)*5;if(len<need)continue;
        let st=w.s;if(w.e-w.s>=len+180&&st<600)st=Math.min(600,w.e-len);
        blocks.push({evalId:ev.id,date:d,s:st,e:st+len});
        day.wins=subtract(day.wins,st,st+len+10);day.load+=len;evLoad[d]=(evLoad[d]||0)+len;rem-=len;progress=true;}}
    unmet[ev.id]=rem>=10?rem:0;}
  blocks.sort((a,b)=>(a.date+fmt(a.s)).localeCompare(b.date+fmt(b.s)));
  return{blocks,unmet,days};
}
// Plan Gratis: el que se armó al empezar la semana, contado con honestidad. Un bloque que ya pasó sin estudiarse
// no cuenta como agendado: esas horas vuelven a faltar y el bloque queda en «perdidos» hasta que la persona diga si lo estudió.
const claveBloque=b=>`${b.evalId}|${b.date}|${b.s}`;
// Cuándo termina un bloque: si pasa la medianoche, termina al día siguiente.
// Un bloque armado ya se estudió si algo anotado de esa evaluación cae dentro (lo de después de medianoche se guarda con el día siguiente).
function estudiado(state,b){const sig=ymd(addDays(fromYmd(b.date),1));
  return state.done.some(x=>{if(x.evalId!==b.evalId)return false;const s=toMin(x.start)+(x.date===b.date?0:x.date===sig?1440:NaN);return s<b.e&&s+x.min>b.s;});}
function finBloque(b){return b.e>=1440?{date:ymd(addDays(fromYmd(b.date),1)),min:b.e-1440}:{date:b.date,min:b.e};}
function planCongelado(state,f,now){const t=ymd(now),nm=now.getHours()*60+now.getMinutes(),S=state.settings;
  const evs=new Map(state.evals.map(e=>[e.id,e])),vistos=new Set(Array.isArray(f.vistos)?f.vistos:[]);
  const hecho=b=>estudiado(state,b);
  const aTiempo=b=>{const dl=evalDeadline(evs.get(b.evalId),S);return b.date<dl.date||(b.date===dl.date&&b.e<=dl.end);};
  const paso=b=>{const f=finBloque(b);return f.date<t||(f.date===t&&f.min<=nm);};
  const vivos=f.blocks.filter(b=>evs.has(b.evalId)&&!hecho(b)&&aTiempo(b));
  const blocks=vivos.filter(b=>b.date>=t);
  const perdidos=vivos.filter(b=>paso(b)&&evs.get(b.evalId).date>=t&&!vistos.has(claveBloque(b)));
  const unmet={},unplanned={};
  for(const e of state.evals){const r=Math.max(0,Math.round(e.hours*60)-doneFor(state,e.id));
    if(f.evalIds.includes(e.id)){const fut=vivos.filter(b=>b.evalId===e.id&&!paso(b)).reduce((a,b)=>a+b.e-b.s,0);unmet[e.id]=e.date>=t&&r-fut>=10?r-fut:0;}
    else if(e.date>=t&&r>=10)unplanned[e.id]=r;}
  return{blocks,unmet,unplanned,perdidos,days:{},frozen:true};}
// Gratis: bloques armados que todavía no pasan y que ahora caen encima de algo ocupado (una rutina o algo de un día).
// Un bloque después de medianoche se compara también con lo que empieza temprano al día siguiente. Con filtro, solo
// cuenta lo ocupado que pasa el filtro (p. ej., solo el ocio).
function bloquesQueChocan(state,f,now,filtro){const t=ymd(now),nm=now.getHours()*60+now.getMinutes(),evs=new Set(state.evals.map(e=>e.id)),pasa=x=>!filtro||filtro(x);
  return f.blocks.filter(b=>{const fin=finBloque(b);if(!evs.has(b.evalId)||fin.date<t||(fin.date===t&&fin.min<=nm))return false;
    const o=busyFor(state,b.date).filter(pasa).map(x=>[x.s,x.e]);
    if(b.e>1440)for(const x of busyFor(state,ymd(addDays(fromYmd(b.date),1))))if(!x.cola&&pasa(x))o.push([x.s+1440,x.e+1440]);
    return o.some(([s,e])=>s<b.e&&b.s<e);});}
// Gratis: una evaluación nueva entra sola al horario ya armado, en los huecos libres, sin mover lo que ya estaba.
// Los bloques armados que aún no pasan cuentan como estudio de su día (para el máximo diario) y como ocupados,
// con los 10 minutos de pausa que el motor deja después de cada bloque.
function sumarAlCongelado(state,f,ids,now){const t=ymd(now);
  const nuevas=state.evals.filter(e=>ids.includes(e.id)&&e.date>=t&&!f.evalIds.includes(e.id)).map(e=>e.id);
  if(!nuevas.length)return{blocks:[],unmet:{}};
  const armado=f.blocks.filter(b=>finBloque(b).date>=t).map(b=>{const sig=b.s>=1440;return{date:sig?ymd(addDays(fromYmd(b.date),1)):b.date,s:sig?b.s-1440:b.s,len:b.e-b.s};});
  const p=plan({...state,done:[...state.done,...armado.map(x=>({evalId:'',date:x.date,start:fmt(x.s),min:x.len}))],
    exceptions:[...state.exceptions,...armado.map(x=>({date:x.date,start:fmt(x.s),end:fmt(x.s+x.len+10),label:''}))]},now,nuevas);
  return{blocks:p.blocks,unmet:p.unmet};}
function agendaFor(state,P,date){
  const it=[];const ev=id=>state.evals.find(e=>e.id===id);
  for(const b of busyFor(state,date))it.push(b.cola?{...b,sub:'Sigue desde anoche'}:{...b});
  for(const x of state.exceptions)if(x.libre&&x.date===date){const r=intervalo(x.start,x.end);it.push({s:r.s,e:r.e,kind:'libre',label:x.label,ref:x.id});}

// Pro = hay cuenta y su plan Pro sigue vigente. El plan lo decide Supabase; aquí se guarda para usarlo sin internet.
function isPro(){const s=state.sub;return !!state.cuenta&&!!s&&s.tier==='pro'&&!!s.until&&s.until>ymd(now());}
function addMonths(d,n){const r=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r;}

function newEvalCount(items){const t=ymd(now());return items.filter(i=>i.kind==='eval'&&i.date>=t).length;}

// Firma de todo lo que cambia el plan. Con sin, sin esas evaluaciones (para saber si el plan estaba al día antes de agregarlas).
function planSig(sin){const S=state.settings;return JSON.stringify([state.commitments,state.evals.filter(e=>!sin||!sin.includes(e.id)).map(e=>[e.id,e.type,e.date,e.time,e.hours]),state.exceptions,S.wake,S.sleep,S.maxDay,S.block,S.minBlock]);}
// Gratis (decisión del 28-oct): las evaluaciones nuevas entran solas en los huecos libres, sin mover lo ya armado.
// Devuelve los minutos que agendó. Si el plan estaba al día, sigue al día; si había otros cambios, sigue pidiendo rearmar.
function agendarNuevas(ids){const f=state.frozen;if(isPro()||!state.onboarded||!f||!ids.length)return 0;
  const fresco=f.sig===planSig(ids),r=sumarAlCongelado(state,f,ids,now());
  f.blocks=[...f.blocks,...r.blocks];f.unmet={...f.unmet,...r.unmet};f.evalIds=[...new Set([...f.evalIds,...ids])];
  if(fresco)f.sig=planSig();save();return r.blocks.reduce((a,b)=>a+b.e-b.s,0);}
function armWeek(initial){const p=plan(state,now());
  state.frozen={week:mondayOf(now()),at:ymd(now()),initial:!!initial,sig:planSig(),blocks:p.blocks,unmet:p.unmet,evalIds:state.evals.map(e=>e.id)};save();return p;}
function canArm(){const f=state.frozen;return !f||f.initial||f.week<mondayOf(now());}
function planStale(){return !!state.frozen&&state.frozen.sig!==planSig();}
function nextArmDate(){return ymd(addDays(fromYmd(mondayOf(now())),7));}
function frozenPlan(){return planCongelado(state,state.frozen,now());}
// Un bloque marcado como estudiado se guarda con su fecha y hora reales (si empieza después de medianoche, es del día siguiente).
function hechoDeBloque(evalId,date,s,e){return{id:uid(),evalId,date:s>=1440?ymd(addDays(fromYmd(date),1)):date,start:fmt(s),min:e-s};}
// Valida lo guardado: una suscripción o un plan congelado mal formados vuelven a valores seguros en vez de romper la vista.
function ensureState(){const s=state.sub;
  if(!s||typeof s!=='object')state.sub=freeSub();
  else{if(!Array.isArray(s.history))s.history=[];if(s.tier==='pro'&&(!PRICES[s.period]||!s.until))state.sub=freeSub(s.history);}
  if(!state.cuenta||typeof state.cuenta!=='object'||!state.cuenta.id)state.cuenta=null;
  if(!state.cuenta&&state.sub.tier==='pro')state.sub=freeSub(state.sub.history);
  const f=state.frozen;if(f===undefined||(f&&(!Array.isArray(f.blocks)||!Array.isArray(f.evalIds)||!f.week)))state.frozen=null;
  if(state.borrador&&!borradorVigente(state.borrador,now()))state.borrador=null;
  if(!isPro()&&state.onboarded&&!state.frozen)armWeek(true);
  if(state.completar&&state.onboarded&&pasosCompletar().every(x=>x.ok)){state.completar=false;save();}
  // Gratis: un plan inicial que aún no tiene bloques se rearma solo (no hay nada que mover), y lo que quedó
  // «sin agendar» con versiones anteriores entra solo en los huecos libres.
  const g=state.frozen;
  if(!isPro()&&state.onboarded&&g){if(g.initial&&!g.blocks.length&&planStale())armWeek(true);
    else{const t=ymd(now()),ids=state.evals.filter(e=>e.date>=t&&!g.evalIds.includes(e.id)).map(e=>e.id);if(ids.length)agendarNuevas(ids);}}}
// Plan desde Supabase: la base de datos decide (vencimientos y renovaciones incluidos); aquí solo se refleja.
const MEDIO_APP={yape:'yape',plin:'plin',tarjeta:'card',cortesia:'cortesia'},MEDIO_DB={yape:'yape',plin:'plin',card:'tarjeta'};
const medioNombre=k=>METHODS[k]?METHODS[k].name:k==='cortesia'?'Cortesía del equipo':'';
function subDesdeFila(f){const h=(state.sub&&state.sub.history)||[];
  if(!f||f.plan!=='pro'||!PRICES[f.periodo]||!f.hasta)return freeSub(h);
  return{tier:'pro',period:f.periodo,method:MEDIO_APP[f.medio]||f.medio,since:f.desde,until:f.hasta,autoRenew:!!f.renovacion_automatica,demo:f.demo!==false,history:h};}
function aplicarFila(f,avisar){const antes=state.sub||freeSub(),era=isPro();state.sub=subDesdeFila(f);const es=isPro();
  if(era&&!es)armWeek(true);else if(!es&&state.onboarded&&!state.frozen)armWeek(true);
  save();
  if(avisar){if(era&&!es)toast('Tu LIA Pro terminó. Volviste a Gratis y tus datos siguen aquí.');
    else if(es&&antes.autoRenew&&antes.until&&state.sub.until>antes.until)toast('LIA Pro se renovó por un mes más (demo: sin cobro real).');}
  return es;}

function now(){return new Date();}

function enDias(date){const n=dayDiff(ymd(now()),date);return n<0?'Pasó':n===0?'Hoy':n===1?'Mañana':`En ${n} días`;}
function tagColor(date){const n=dayDiff(ymd(now()),date);return n<=1?'var(--exam-ink)':n<=3?'var(--trabajo-ink)':'var(--pri)';}
function swColor(type){return type==='entrega'||type==='exposicion'?'k-trabajo':type==='parcial'||type==='final'||type==='examen'?'k-examen':'k-estudio';}

// Tocar una rutina deja liberarla ese día; tocar algo de un solo día lo abre para editarlo.
function rowHTML(x,date){const isToday=date===ymd(now());const nm=now().getHours()*60+now().getMinutes();const past=isToday&&x.e<=nm;
  const act=x.kind==='estudio'?`data-a="block" data-ev="${x.block.evalId}" data-d="${x.block.date}" data-s="${x.block.s}" data-e="${x.block.e}"`:x.kind==='examen'?`data-a="edit-eval" data-id="${x.ref}"`:x.kind==='excepcion'?`data-a="edit-ex" data-id="${x.ref}"`:x.kind==='libre'?`data-a="del-ex" data-id="${x.ref}"`:(COMMIT_TYPES[x.kind]?`data-a="commit-dia" data-id="${x.ref}" data-d="${x.cola?ymd(addDays(fromYmd(date),-1)):date}"`:'');
  const sub=x.kind==='excepcion'?(x.sub||'Solo este día'):x.kind==='libre'?'Toca para deshacer':x.sub||'';
  const k=x.kind==='excepcion'&&x.cat?tipoRutina(x.cat):x.kind,cat=COMMIT_TYPES[k]?icoRutina(k):'',catSr=COMMIT_TYPES[k]?`<span class="sr-only"> (${COMMIT_TYPES[k]})</span>`:'';
  return `<button class="ag ${past?'past':''}" ${act}><span class="t tnum">${fmt(x.s)}</span><span class="blk k-${k}"><b>${cat}${esc(x.label)}${catSr}</b><small class="tnum">${fmt(x.s)} – ${fmt(x.e)}${sub?' · '+esc(sub):''}</small></span></button>`;}

function resumenDiaHTML(date,P0){const r=resumenDia(state,P0,date),S=state.settings;if(!r.despierto)return '';
  const pct=m=>Math.round((m-r.tramos[0].s)/r.despierto*1000)/10;
  const partes=[r.ocupado?`Ocupado ${hrs(r.ocupado)}`:'',r.estudio?`Estudio ${hrs(r.estudio)}`:'',r.libre?`Libre ${hrs(r.libre)}`:'Sin tiempo libre'].filter(Boolean).map(x=>`<span>${x}</span>`).join(' · ');
  return `<div class="dia-res"><p class="small muted">De ${S.wake} a ${S.sleep}: ${partes}</p><div class="barra-dia" aria-hidden="true">${r.tramos.filter(x=>x.k!=='libre').map(x=>`<i class="k-${x.k}" style="left:${pct(x.s)}%;width:${pct(x.e)-pct(x.s)}%"></i>`).join('')}</div></div>`;}
function agendaHTML(date,P0){const it=[...agendaFor(state,P0,date),...huecosDia(state,P0,date,now()).map(h=>({...h,kind:'hueco'}))].sort((a,b)=>a.s-b.s);
  const sleep=`<div class="ag"><span class="t tnum">${state.settings.sleep}</span><span class="blk k-dormir"><b>A dormir</b><small>${state.evals.some(e=>e.date===ymd(addDays(fromYmd(date),1)))?'Mañana tienes evaluación: descansa':'Sin amanecidas'}</small></span></div>`;
  if(!it.length)return `<div class="agenda"><div class="card muted small">Día libre: no hay rutinas ni estudio programado.</div>${sleep}</div>`;
  return `${resumenDiaHTML(date,P0)}<div class="agenda">${it.map(x=>x.kind==='hueco'?huecoHTML(x,date):rowHTML(x,date)).join('')}${sleep}</div>`;}

function conflicts(){const n=now(),t=ymd(n),nm=n.getHours()*60+n.getMinutes(),S=state.settings;
  const ev=state.evals.filter(e=>{const dl=evalDeadline(e,S);return dl.date>t||(dl.date===t&&dl.end>nm);}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const out=[];

  // paso 3: resumen

   ${falt.length?`<div class="note"><span class="ico" style="color:var(--pri)">${I.spark}</span><div class="small"><b>${tot?'Casi listo: me':'Me'} ${faltaTxt(falt.reduce((a,e)=>a+p.unmet[e.id],0))} para ${falt.length===1?esc(falt[0].course):falt.map(e=>`${esc(e.course)} (${hrs(p.unmet[e.id])})`).join(' y ')}.</b><br>En Hoy te propongo cómo hacer espacio.</div></div>`:''}

// Campo para escribirle (o dictarle) a Lía. El ejemplo va debajo, a la vista: no desaparece al empezar a escribir.

// "22:00 – 06:00 del día siguiente" cuando el horario cruza la medianoche.
function horario(c){return `${c.start} – ${c.end}${toMin(c.end)<toMin(c.start)?' del día siguiente':''}`;}
function duracion(c){const r=intervalo(c.start,c.end);return r.e-r.s;}
function diasTxt(ds){const s=[...ds].sort((a,b)=>((a+6)%7)-((b+6)%7));const k=s.join();
  if(k==='1,2,3,4,5')return'Lun a Vie';if(k==='1,2,3,4,5,6')return'Lun a Sáb';if(s.length===7)return'Todos los días';if(k==='6,0')return'Fines de semana';
  return s.map(d=>cap(DIAS[d].slice(0,3))).join(', ');}
function evalItem(e){const p=P();const need=e.hours*60,done=doneFor(state,e.id),pl=p.blocks.filter(b=>b.evalId===e.id).reduce((a,b)=>a+b.e-b.s,0);
  return `<button class="item" data-a="edit-eval" data-id="${e.id}" style="align-items:flex-start"><span class="sw ${swColor(e.type)}">${EVAL_TYPES[e.type].label[0]}</span><span class="grow stack" style="gap:6px"><span><b>${EVAL_TYPES[e.type].label} · ${esc(e.course)}</b><br><span class="small muted">${cap(fechaCorta(e.date))} · ${e.time} · ${done?`${hrs(done)} de ${hrs(need)} estudiadas`:`${hrs(need)} de estudio`}</span></span>
   <span class="bar"><i style="width:${Math.min(100,Math.round(done/need*100))}%"></i></span>
   ${p.unmet[e.id]>0?`<span class="small" style="color:var(--exam-ink);font-weight:600">${cap(faltaTxt(p.unmet[e.id]))} sin hueco</span>`:p.unplanned&&p.unplanned[e.id]?`<span class="small" style="color:var(--trabajo-ink);font-weight:600">Sin agendar · entra cuando rearmes tu semana</span>`:pl?`<span class="small muted">${hrs(pl)} ya agendadas</span>`:''}</span><span class="tag" style="color:${tagColor(e.date)}">${enDias(e.date)}</span></button>`;}

// Lo que falta estudiar y no está en el horario: sin hueco (no entró) o, en Gratis, sin agendar (se agregó a mitad de semana;
// desde la 0.5.0 ensureState() las agenda solas, así que solo queda como respaldo).
// Solo cuenta lo que todavía se puede estudiar: el día de un examen ya no se estudia para él.
function sinHorario(p){const n=now(),t=ymd(n),nm=n.getHours()*60+n.getMinutes(),S=state.settings;
  return state.evals.filter(e=>{const dl=evalDeadline(e,S);return dl.date>t||(dl.date===t&&dl.end>nm);})
    .map(e=>{const sh=p.unmet[e.id]||0,sa=(p.unplanned&&p.unplanned[e.id])||0;return{e,min:sh+sa,agendar:sa>0};}).filter(x=>x.min>=10)
    .sort((a,b)=>(a.e.date+a.e.time).localeCompare(b.e.date+b.e.time));}
function faltaTxt(m){return `${m>=60&&m<120?'falta':'faltan'} ${hrs(m)}`;}
// Por qué falta tiempo y qué se puede hacer. En Gratis, rearmar solo se sugiere si de verdad ubicaría más horas.
function consejoFalta(pend){const ante=`antes de ${pend.length>1?'tus evaluaciones':'tu evaluación'}`;
  if(isPro())return{txt:`No encontré horas libres ${ante}.`};
  const falta=pend.reduce((s,x)=>s+x.min,0),nuevo=plan(state,now()),gana=falta-pend.reduce((s,x)=>s+(nuevo.unmet[x.e.id]||0),0);
  if(gana>=10){if(canArm())return{txt:`Si rearmas tu semana, Lía puede ubicar ${hrs(gana)} más.`,a:'arm',btn:'Rearmar mi semana'};
    const por=pend.some(x=>x.agendar)?'En Gratis, lo que agregas a mitad de semana entra cuando rearmas tu horario':'En Gratis tu horario no se reacomoda solo';
    return{txt:`${por}: podrás rearmarlo desde el ${fechaLarga(nextArmDate())}. Si estudias por tu cuenta, anótalo para que cuente.`,a:'anotar',btn:'Anotar lo que estudié'};}
  if(canArm())return{txt:`No encontré horas libres ${ante}.`};
  return{txt:`No encontré horas libres ${ante}. Si estudias por tu cuenta, anótalo para que cuente.`,a:'anotar',btn:'Anotar lo que estudié'};}
const accionHTML=(c,cls)=>`<button class="${cls}" data-a="${c.a}"${c.t?` data-t="${c.t}"`:''}${c.ev?` data-ev="${c.ev}"`:''}>${c.btn}</button>`;
// No alcanza el tiempo (iteración 2): «Casi listo», con un arreglo de un toque y «Ver otras opciones», en vez de una alarma.
// Primero, si hay, un rato de ocio; el ocio está protegido, así que solo se usa si la persona dice que sí (decisión 5).
function arregloFalta(pend){const x=pend[0],o=ocioParaEstudio(state,P(),x.e.id,now());
  if(o)return{txt:`Puedo usar ${hrs(o.e-o.s)} de tu ocio: ${o.label}, el ${fechaCorta(o.date)} de ${fmt(o.s)} a ${fmt(o.e)}. Solo si tú quieres.`,a:'usar-ocio',ev:x.e.id,btn:'Usar ese tiempo'};

function tituloFalta(pend){const tot=pend.reduce((a,x)=>a+x.min,0);return `Me ${faltaTxt(tot)} para ${pend.length===1?esc(pend[0].e.course):`${pend.length} evaluaciones`}`;}
const listaFalta=pend=>pend.length>1?esc(pend.map(x=>`${x.e.course}: ${hrs(x.min)}`).join(' · ')):'';
function heroFalta(pend){const c=arregloFalta(pend),l=listaFalta(pend),ev=pend[0].e.id,algo=pend.some(x=>x.e.hours*60-doneFor(state,x.e.id)>x.min);

// Todas las formas de hacer espacio, para elegir.
function sheetOpcionesFalta(id){const p=P(),pend=sinHorario(p),x=pend.find(y=>y.e.id===id)||pend[0];if(!x)return '';

// El día de una evaluación, eso va primero en Hoy.

// «Completa tu semana»: lo que falta para que Lía arme el horario, para quien saltó pasos del registro.
// Desaparece cuando están las tres cosas (ensureState apaga state.completar).
function pasosCompletar(){const t=ymd(now()),S=state.settings,nR=state.commitments.length;
  const prox=state.evals.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  return[{ok:nR>0,a:'add-commit',t:'Agrega tus rutinas',d:'Clases, trabajo, traslados: lo que se repite cada semana.',hecho:`Tus rutinas: ${nR} ${nR===1?'registrada':'registradas'}`},
    {ok:S.suenoListo!==false,a:'sueno',t:'Revisa tus horas de sueño',d:`Ahora duermes de ${S.sleep} a ${S.wake}.`,hecho:`Tu sueño: de ${S.sleep} a ${S.wake}`},

   <ul class="todo">${ps.map(x=>x.ok?`<li class="row-h"><span class="check" aria-hidden="true">${I.check}</span><span class="small muted"><span class="sr-only">Listo: </span>${esc(x.hecho)}</span></li>`
     :`<li><button class="item" data-a="${x.a}"><span class="sw" style="background:var(--pri-soft);color:var(--pri)">${I.plus.replace('<svg','<svg width="20" height="20" aria-hidden="true"')}</span><span class="grow"><b>${x.t}</b><br><span class="small muted">${esc(x.d)}</span></span></button></li>`).join('')}</ul></section>`;}
function sheetSueno(){const S=state.settings;return `<form class="stack" data-form="sueno" style="gap:14px"><div class="grab"></div><h2>Tus horas de sueño</h2>

  <div class="two"><label class="f">Me despierto<input type="time" id="su-wake" name="wake" required value="${S.wake}"></label><label class="f">Me duermo<input type="time" id="su-sleep" name="sleep" required value="${S.sleep}"></label></div>
  <button class="btn pri" type="submit">Guardar</button><button class="btn sec" type="button" data-a="close">Cancelar</button></form>`;}
function vHoy(){const n=now(),t=ymd(n),p=P(),nm=n.getHours()*60+n.getMinutes(),compl=completarHTML();
  const next=p.blocks.find(b=>b.date>t||b.e>nm),pend=sinHorario(p);

    hero=`<section class="hero"><span class="eyebrow">Tu próximo bloque · ${esc(when)}</span><span class="big tnum">${fmt(next.s)} – ${fmt(next.e)}</span><span style="opacity:.9;font-weight:500">${esc(e.course)} · para tu ${EVAL_TYPES[e.type].label.toLowerCase()} del ${fechaCorta(e.date)}</span>
     <div style="height:6px"></div>${isPro()?`<button class="btn light" data-a="start" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">Empezar a estudiar</button>`
       :`<button class="btn light" data-a="done-block" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">Ya lo estudié</button>`}
     <button class="small" style="color:var(--pri-ink);opacity:.9;text-align:center;padding:6px" data-a="move" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">¿No puedes a esa hora? Lía lo mueve${isPro()?'':PRO_TAG}</button></section>`;}

  else if(state.evals.some(vigente))hero='';  // queda estudio, pero ya no hay tiempo antes de la evaluación (p. ej., el día del examen)

    faltaH=`<section class="card stack" aria-labelledby="casi-t" style="gap:6px"><span class="eyebrow">Casi listo</span><b id="casi-t">${tituloFalta(pend)}</b>${l?`<span class="small muted">${l}</span>`:''}<span class="small">${esc(c.txt)}</span>
     <div class="chips" style="margin-top:6px">${c.a?accionHTML(c,'pill solid'):''}<button class="pill ${c.a?'ghost':'solid'}" data-a="falta-opciones" data-ev="${pend[0].e.id}">Ver otras opciones</button></div></section>`;}
  const prox=state.evals.filter(e=>vigente(e)&&e!==evHoy).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  let pc='';if(prox){const need=prox.hours*60,done=doneFor(state,prox.id),x=pend.find(y=>y.e.id===prox.id),dl=evalDeadline(prox,state.settings);
    const listo=need-done<10,vencido=dl.date<t||(dl.date===t&&dl.end<=nm);  // vencido: ya no queda tiempo para estudiar antes de la evaluación

  return `${demoBanner()}<div class="between" style="align-items:flex-end"><div><div class="kicker">${cap(fechaLarga(t))}</div><h1>${state.settings.name?`Hola, ${esc(state.settings.name)}`:'Hoy'}</h1></div>${botonAgregar()}</div>${evHoy?evalHoyHTML(evHoy,nm):''}${avisoIOS()}${sugerenciaHTML()}${freeBanner()}${perdidosHTML(p)}${hero}${compl}${faltaH}${cfH}${pc}<h2>Tu día</h2>${agendaHTML(t,p)}${night}`;}
// Gratis: los bloques que pasaron sin marcarse. Lía pregunta si se estudiaron; lo que no, ya cuenta como pendiente.
function perdidosHTML(p){const l=p.perdidos||[];if(!l.length)return '';

function vSemana(){const n=now(),t=ymd(n),p=P();

  const study=days.reduce((a,d)=>a+p.blocks.filter(b=>b.date===d).reduce((x,b)=>x+b.e-b.s,0)+state.done.filter(x=>x.date===d).reduce((x,y)=>x+y.min,0),0);

  ${freeWeekLine()}<div class="days">${days.map(d=>{const dt=fromYmd(d);const hasS=p.blocks.some(b=>b.date===d);const hasE=state.evals.some(e=>e.date===d);
    const que=hasE&&hasS?', con evaluación y estudio':hasE?', con evaluación':hasS?', con estudio':'';
    return `<button class="day ${d<t?'past':''}" data-a="sel" data-d="${d}" aria-pressed="${d===ui.sel}" aria-label="${cap(DIAS[dt.getDay()])} ${dt.getDate()}${d===t?', hoy':''}${que}"><span>${DIAS_C[dt.getDay()]}</span><b class="tnum">${dt.getDate()}</b><i class="dot ${hasE?'x':''}" style="${hasS||hasE?'':'visibility:hidden'}"></i></button>`;}).join('')}</div>

// ---------- Hojas (formularios) ----------
// ---------- Rutinas: un solo formulario, con uno o varios horarios ----------
// El formulario vive en ui.rutina mientras está abierto, para agregar o quitar horarios sin perder lo escrito.
const FRANJAS={manana:['08:00','12:00','Mañana'],tarde:['14:00','18:00','Tarde'],noche:['19:00','22:00','Noche']};
function rutinaDesde(id,pre){const c=id&&state.commitments.find(x=>x.id===id);
  if(c){const g=c.grupo?state.commitments.filter(x=>x.grupo===c.grupo):[c];
    return{id:c.id,ids:g.map(x=>x.id),grupo:c.grupo||null,type:tipoRutina(c.type),name:c.name,tramos:g.map(x=>({days:[...x.days],start:x.start,end:x.end}))};}
  if(pre&&pre.kind==='commit')return{id:'',ids:[],grupo:null,type:tipoRutina(pre.type),name:pre.name||'',tramos:[{days:[...(pre.days||[])],start:pre.start||'',end:pre.end||''}]};
  return{id:'',ids:[],grupo:null,type:'',name:'',tramos:[{days:pre&&pre.date?[fromYmd(pre.date).getDay()]:[],start:(pre&&pre.start)||'',end:(pre&&pre.end)||''}]};}
// Selector de categoría: opciones de radio con ícono y nombre (las flechas del teclado cambian la opción).
function tiposChips(name,sel,{req=false,titulo='Tipo'}={}){return `<fieldset class="tipos-f"><legend>${titulo}</legend><div class="tipos">${Object.entries(COMMIT_TYPES).map(([k,v])=>`<label class="tipo"><input type="radio" name="${name}" value="${k}" ${sel===k?'checked':''}${req?' required':''}><span class="k-${k}">${icoRutina(k)}${v}</span></label>`).join('')}</div></fieldset>`;}
// Con qué se cruza un horario del formulario: otras rutinas y los otros horarios de esta misma.
function crucesTexto(r,i){const t=r.tramos[i],otros=r.tramos.map((x,j)=>({...x,id:'#'+j,name:`el horario ${j+1}`})).filter((x,j)=>j!==i);
  const cs=[...crucesTramo(state.commitments,t,r.ids),...crucesTramo(otros,t,[])];if(!cs.length)return '';
  const c=cs[0];return `Se cruza con ${c.name} (${horario(c)})${cs.length>1?` y ${cs.length-1} más`:''}. Puedes guardarlo igual.`;}
const cruza=t=>t.start&&t.end&&toMin(t.end)<toMin(t.start);
function tramoHTML(r,i){const t=r.tramos[i],n=r.tramos.length,sfx=i?`-${i}`:'';
  return `<div class="tramo stack" role="group" aria-labelledby="tr${i}-t" style="gap:10px">
   <div class="between"><span class="eyebrow" id="tr${i}-t">${n>1?`Horario ${i+1}`:'Horario'}</span>${n>1?`<button type="button" class="linkbtn" data-a="tramo-quitar" data-i="${i}" aria-label="Quitar el horario ${i+1}${t.start&&t.end?`, de ${t.start} a ${t.end}`:''}">Quitar</button>`:''}</div>
   <div class="dpick" role="group" aria-label="Días del horario ${i+1}">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="d${i}" value="${d}" aria-label="${cap(DIAS[d])}" ${t.days.includes(d)?'checked':''}><span aria-hidden="true">${DIAS_C[d]}</span></label>`).join('')}</div>
   <div class="chips">${Object.entries(FRANJAS).map(([k,[a,b,l]])=>`<button type="button" class="pill ghost" data-a="franja" data-i="${i}" data-v="${k}" aria-label="${l}, de ${a} a ${b}">${l}</button>`).join('')}<button type="button" class="pill ghost" data-a="franja" data-i="${i}" data-v="otra">Otra hora</button></div>
   <div class="two"><label class="f">Desde<input type="time" id="c-start${sfx}" name="s${i}" required value="${t.start}"></label><label class="f">Hasta<input type="time" id="c-end${sfx}" name="e${i}" required value="${t.end}" aria-describedby="nx${i}"></label></div>
   <p class="small muted" id="nx${i}" style="margin:-4px 0 0"${cruza(t)?'':' hidden'}>Termina al día siguiente.</p>
   <p class="small aviso-cruce" id="cr${i}" aria-live="polite" style="margin:0">${esc(crucesTexto(r,i))}</p>
   ${r.err&&r.err.i===i?`<p class="ferr" role="alert">${esc(r.err.msg)}</p>`:''}</div>`;}
function sheetRutina(){const r=ui.rutina;
  return `<form class="stack" data-form="rutina" style="gap:14px"><div class="grab"></div><h2>${r.id?'Editar rutina':'Nueva rutina'}</h2>
  <p class="muted small" style="margin:0">Lo que se repite cada semana. Lía no pone estudio en esas horas.</p>
  ${tiposChips('ru-tipo',r.type,{req:true})}
  <label class="f">Nombre (opcional)<input id="c-name" name="nombre" maxlength="40" value="${esc(r.name)}" placeholder="${r.type?esc(COMMIT_TYPES[r.type]):'Clases en la U, Trabajo, Gimnasio…'}"></label>
  ${r.tramos.map((t,i)=>tramoHTML(r,i)).join('')}
  <button type="button" class="dashed" data-a="tramo-mas">${I.plus.replace('<svg','<svg class="ico" aria-hidden="true"')}<span class="grow">Agregar otro horario</span></button>

// Lee el formulario abierto (lo escrito manda sobre ui.rutina).
function leerRutina(){const r=ui.rutina,f=document.querySelector('form[data-form="rutina"]');if(!r||!f)return r;const fd=new FormData(f);
  r.type=String(fd.get('ru-tipo')||r.type||'');r.name=String(fd.get('nombre')||'');
  r.tramos=r.tramos.map((t,i)=>({days:fd.getAll('d'+i).map(Number),start:String(fd.get('s'+i)||''),end:String(fd.get('e'+i)||'')}));return r;}
function abrirRutina(id,pre){ui.rutina=rutinaDesde(id,pre);ui.agregarPre=null;ui.sheet=sheetRutina();render();}
function pintarRutina(foco){ui.sheet=sheetRutina();render();const el=foco&&document.querySelector(foco);if(el)el.focus();}
// Avisos que cambian mientras se escribe, sin volver a dibujar la hoja (así el foco no salta).
function refrescarTramos(){const r=leerRutina();if(!r)return;r.tramos.forEach((t,i)=>{const c=document.getElementById('cr'+i),nx=document.getElementById('nx'+i);
  if(c){const v=crucesTexto(r,i);if(c.textContent!==v)c.textContent=v;}if(nx)nx.hidden=!cruza(t);});}
// Guarda la rutina: un compromiso por horario y, si son varios, con un mismo grupo. Reusa los ids para no perder
// lo que se liberó solo un día; lo liberado de un horario que se quitó se borra con él.
function guardarRutina(r){snapshot();const name=r.name.trim()||COMMIT_TYPES[r.type],grupo=r.tramos.length>1?(r.grupo||uid()):null,usados=[];
  r.tramos.forEach((t,i)=>{const id=r.ids[i]||uid();usados.push(id);
    const o={name,type:r.type,days:[...new Set(t.days)].sort((a,b)=>a-b),start:t.start,end:t.end},cur=state.commitments.find(c=>c.id===id);
    if(cur){Object.assign(cur,o);if(grupo)cur.grupo=grupo;else delete cur.grupo;}else state.commitments.push({id,...o,...(grupo?{grupo}:{})});});
  quitarRutinas(r.ids.filter(id=>!usados.includes(id)));save();}
// Gratis (decisión 5): si algo de ocio cae sobre estudio ya armado, ese estudio pasa a otro hueco libre sin tocar lo demás,
// y se avisa. Lo que no entra queda como «falta» y Hoy propone qué hacer (entre otras cosas, usar el ocio).
function reubicarOcio(){const f=state.frozen;if(isPro()||!f)return '';const c=bloquesQueChocan(state,f,now(),esOcio);if(!c.length)return '';
  const r=reubicarCongelado(state,f,c,now()),mov=c.reduce((a,b)=>a+b.e-b.s,0),ids=c.map(b=>b.evalId);
  const ubic=Math.min(mov,r.nuevos.filter(b=>ids.includes(b.evalId)).reduce((a,b)=>a+b.e-b.s,0));f.blocks=r.blocks;save();
  const cursos=[...new Set(ids.map(id=>(evById(id)||{}).course).filter(Boolean))].join(' y ');
  if(ubic>=mov)return `Para respetar tu ocio, moví ${hrs(mov)} de estudio de ${cursos} a otro hueco libre.`;
  if(ubic)return `Para respetar tu ocio, moví ${hrs(ubic)} de estudio de ${cursos} a otro hueco libre. Para ${hrs(mov-ubic)} no encontré espacio: en Hoy te propongo qué hacer.`;
  return `Ese rato era de estudio de ${cursos} y no encontré otro hueco libre: en Hoy te propongo qué hacer.`;}
// Qué decirle en Gratis al guardar una rutina: si choca con lo armado, con qué; si no, que no choca.
function textoRutinaGratis(){const c=bloquesQueChocan(state,state.frozen,now());
  if(c.length){const b=c[0],e=evById(b.evalId),d=b.s>=1440?ymd(addDays(fromYmd(b.date),1)):b.date;return `Guardado. Choca con tu bloque de ${e?e.course:'estudio'} del ${fechaCorta(d)} a las ${fmt(b.s)}. En Gratis no reorganizo sola: ${canArm()?'puedes rearmar tu semana ahora':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}.`;}
  return planStale()?'Guardado. Tu horario Gratis se actualiza cuando rearmes tu semana.':'Guardado. No choca con tu estudio.';}
function quitarRutinas(ids){if(!ids.length)return;state.commitments=state.commitments.filter(c=>!ids.includes(c.id));state.exceptions=state.exceptions.filter(x=>!(x.libre&&ids.includes(x.ref)));}
// En las listas, una rutina con varios horarios es una sola fila.
function rutinaItem(g){const t=tipoRutina(g.type),tot=g.tramos.reduce((a,c)=>a+c.days.length*duracion(c),0);
  return `<button class="item" data-a="edit-commit" data-id="${g.id}"><span class="sw k-${t}">${icoRutina(t)}</span><span class="grow"><b>${esc(g.name)}</b><br><span class="small muted">${COMMIT_TYPES[t]} · ${g.tramos.map(c=>`${diasTxt(c.days)} ${horario(c)}`).join(' · ')}</span></span><span class="tag muted">${hrs(tot)}</span></button>`;}
const listaRutinas=()=>agruparRutinas(state.commitments).map(rutinaItem).join('');

// ---------- Algo de un solo día (cumpleaños, cita, turno extra) ----------
// Nada se guarda sin hora (decisión del 28-oct): la fecha y las dos horas son obligatorias.
function eventoDesde(id,pre){const x=id&&state.exceptions.find(y=>y.id===id&&!y.libre);
  if(x)return{id:x.id,label:x.label,cat:tipoRutina(x.cat||'otro'),date:x.date,start:x.start,end:x.end};
  return{id:'',label:(pre&&pre.label)||'',cat:(pre&&pre.cat)||'otro',date:(pre&&pre.date)||'',start:(pre&&pre.start)||'',end:(pre&&pre.end)||''};}

  <button class="btn pri" type="submit">Guardar</button>${v.id?`<button class="btn danger" type="button" data-a="del-ex" data-id="${v.id}">Eliminar</button>`:''}<button class="btn sec" type="button" data-a="close">Cancelar</button></form>`;}

// Las horas de estudio son opcionales: si quedan vacías, Lía usa lo usual para ese tipo de evaluación.
// Nada se guarda sin fecha ni hora (decisión del 28-oct): en una evaluación nueva vienen vacías, salvo que se sepan.
// Con pre, el formulario se abre con esos datos encima: los de una evaluación nueva o los que cambian en una que ya está.
function sheetEval(id,pre){const base={id:'',type:'parcial',course:'',date:'',time:'',hours:''},desde=pre||{};
  const dato=Object.fromEntries(Object.keys(base).filter(k=>k!=='id'&&desde[k]!==undefined&&desde[k]!==null&&desde[k]!=='').map(k=>[k,desde[k]]));
  const cur=state.evals.find(x=>x.id===id),e=cur?{...cur,...dato}:{...base,...dato};
  return `<form class="stack" data-form="eval" data-id="${e.id}" style="gap:14px"><div class="grab"></div><h2>${e.id?'Editar evaluación':'Nueva evaluación'}</h2>
  <div class="two"><label class="f">Tipo<select id="e-type" name="type" data-a-change="etype">${Object.entries(EVAL_TYPES).map(([k,v])=>`<option value="${k}" ${e.type===k?'selected':''}>${v.label}</option>`).join('')}</select></label>
  <label class="f">Horas de estudio (opcional)<input type="number" id="e-hours" name="hours" min="1" max="40" step="0.5" inputmode="decimal" value="${e.hours}" placeholder="${(EVAL_TYPES[e.type]||EVAL_TYPES.parcial).h}, lo usual"></label></div>
  <label class="f">Curso<input id="e-course" name="course" required value="${esc(e.course)}" placeholder="Cálculo II"></label>
  <div class="two"><label class="f">Fecha<input type="date" id="e-date" name="date" required value="${e.date}"${e.id?'':` min="${ymd(now())}"`}></label><label class="f">Hora<input type="time" id="e-time" name="time" required value="${e.time}"></label></div>
  <button class="btn pri" type="submit">Guardar</button>${e.id?`<button class="btn danger" type="button" data-a="del-eval" data-id="${e.id}">Eliminar</button>`:''}<button class="btn sec" type="button" data-a="close">Cancelar</button></form>`;}
function sheetBlock(d){const e=evById(d.ev),n=now(),t=ymd(n),f=finBloque({date:d.d,e:+d.e}),paso=f.date<t||(f.date===t&&f.min<=n.getHours()*60+n.getMinutes());
  const head=`<div class="grab"></div><span class="eyebrow">${paso?'Bloque que ya pasó':'Bloque de estudio'}</span><h2>${esc(e?e.course:'')} · ${fmt(+d.s)} – ${fmt(+d.e)}</h2><p class="muted" style="margin:0">${cap(fechaLarga(d.d))} · para tu ${e?EVAL_TYPES[e.type].label.toLowerCase():''} del ${e?fechaCorta(e.date):''}</p>`;

  return `${head}

function sheetPerdidos(){const l=P().perdidos||[];

// ---------- Planes y pago (modo demo) ----------
const WHY={
 evals:{t:'Agrega más evaluaciones con LIA Pro',d:`En Gratis puedes tener hasta ${FREE_EVALS} evaluaciones próximas. Con Pro no hay límite.`},
 voice:{t:'Háblale a Lía con LIA Pro',d:'Dicta tus horarios y tus exámenes en vez de escribirlos.'},
 reorg:{t:'Deja que Lía reorganice tu semana',d:'Con Pro, cuando algo cambia, Lía mueve tus bloques de estudio al instante.'},
 session:{t:'Modo sesión con LIA Pro',d:'Temporizador y modo concentración para cada bloque. Al terminar, Lía suma lo que estudiaste.'},
 rearm:{t:'Rearma tu semana cuando quieras',d:''},
 plans:{t:'Pásate a LIA Pro',d:'Lía arma tu horario y lo reorganiza sola cuando algo cambia. Sin límite de evaluaciones, con voz y modo sesión.'}};
function openPaywall(why,ctx){const prev=ui.pay||{};ui.pay={why,ctx:ctx||null,period:prev.period||'ciclo',method:prev.method||'yape'};ui.sheet=sheetPaywall();render();}
function rememberChoice(name,key){const el=document.querySelector(`input[name="${name}"]:checked`);if(el&&ui.pay)ui.pay[key]=el.value;}
function planOpt(k,sel){const p=PRICES[k];
  const sub=k==='ciclo'?`4 meses de Pro · equivale a ${soles(p.amount/p.months)} al mes · pago único`:'Pagas mes a mes · lo dejas cuando quieras';
  return `<label class="plan" for="per-${k}"><input type="radio" name="period" id="per-${k}" value="${k}" ${sel===k?'checked':''}><span class="grow stack" style="gap:3px"><span class="between"><b>${p.name}</b><span class="price">${soles(p.amount)}${k==='mes'?'<span class="small muted" style="font-weight:500"> al mes</span>':''}</span></span><span class="small muted">${sub}</span>${k==='ciclo'?`<span><span class="save">Ahorras ${soles(SAVE_CICLO)} (${SAVE_PCT}%)</span></span>`:''}</span></label>`;}
function sheetPaywall(){const why=ui.pay.why,w=WHY[why]||WHY.plans,c=ui.pay.ctx||{};
  const d=why==='rearm'?`En Gratis armas tu horario una vez por semana. Puedes volver a armarlo desde el ${fechaLarga(nextArmDate())}. Con Pro, Lía lo reorganiza cada vez que algo cambia.`:w.d;
  const alt=why==='session'&&c.ev?`<button class="btn sec" data-a="done-block" data-ev="${c.ev}" data-d="${c.d}" data-s="${c.s}" data-e="${c.e}">Solo marcar como estudiado</button>`:'';
  return `<div class="grab"></div><div class="row-h"><span class="pro" aria-hidden="true">PRO</span><span class="eyebrow">LIA Pro</span></div>
  <h2 style="font-size:22px;text-wrap:balance">${esc(w.t)}</h2><p class="muted" style="margin:0">${esc(d)}</p>
  <div class="stack" role="radiogroup" aria-label="Elige tu plan">${planOpt('ciclo',ui.pay.period)}${planOpt('mes',ui.pay.period)}</div>
  <button class="btn pri" data-a="pay-continue">Continuar</button>${state.cuenta?'':'<p class="small muted" style="margin:0;text-align:center">Para pasarte a Pro necesitas una cuenta: la creas en el siguiente paso.</p>'}${alt}
  <button class="linkbtn" style="text-align:center" data-a="plans">Comparar planes</button>
  <button class="btn sec" data-a="close">Ahora no</button>`;}
function sheetCheckout(){const per=ui.pay.period,p=PRICES[per],m=ui.pay.method;
  const base=isPro()&&state.sub.until>ymd(now())?fromYmd(state.sub.until):now();
  const until=fechaSub(ymd(addMonths(base,p.months)));
  const note=per==='mes'?'Con tarjeta se renueva sola cada mes hasta que canceles. Con Yape o Plin pagas mes a mes: al vencer vuelves a Gratis y tus datos se quedan.':'Pago único: no se renueva solo. Al terminar vuelves a Gratis y tus datos se quedan.';

function sheetSuccess(){const s=state.sub;
  const line=s.autoRenew?`Se renueva el ${fechaSub(s.until)} con tu tarjeta.`:`Tienes Pro hasta el ${fechaSub(s.until)}.`;
  const w=ui.pay.why,c=ui.pay.ctx||{};

  return `<div class="grab"></div><span class="big-check">${I.check}</span><h2 style="text-align:center;font-size:22px">Ya tienes LIA Pro</h2>

function claveFoco(el){if(!el||el===document.body||!el.dataset)return null;
  if(el.id)return '#'+CSS.escape(el.id);
  const d=el.dataset;if(!d.a)return null;
  return `[data-a="${CSS.escape(d.a)}"]`+['t','d','v','id','ev','s','k','why'].filter(k=>d[k]!==undefined).map(k=>`[data-${k}="${CSS.escape(d[k])}"]`).join('');}

  const destino=hay?(enCapa&&!L.querySelector('[data-foco]')?clave:null):(habia?abridor:clave);if(!hay&&habia)abridor=null;
  let el=destino&&(hay?L:app).querySelector(destino);

  if(b){const r=respuestaBorrador(b,q,state,n0);if(r){responder(q,from,r,n0);return;}}
  if(from==='chat'&&iaPosible()&&navigator.onLine!==false){
    if(ui.pensando){const i=document.getElementById('chat-in');if(i&&!i.value)i.value=q;anunciar('Espera un momento: Lía está respondiendo.');return;}
    // Cambiar o quitar una evaluación lo resuelven las reglas: la IA todavía no lo sabe hacer y lo leería como una evaluación nueva.
    const c=cambioDeEval(q,state,n0);if(c){responder(q,from,c,n0);return;}
    const el=iaEleccion();
    if(el===null){ui.iaPendiente=q;ui.sheet=sheetIA();render();return;}
    if(el==='si'){conIA(q);return;}}
  const n=now();responder(q,from,interpret(q,state,n),n);}
// Responde una intención (de las reglas o de la IA). Con eco:false, el mensaje de la persona ya está en el chat.
function responder(q,from,r,n,{eco=true}={}){
  if(from==='chat'&&eco)state.chat.push({from:'me',text:q});
  // En Gratis, sin cupo para otra evaluación, avisa del límite antes de preguntar lo que falta (no tiene sentido
  // pedir la hora de algo que no se va a poder guardar). Una evaluación sin fecha todavía cuenta como próxima.
  if(r.intent==='pregunta'&&r.borrador&&r.borrador.intent==='add'){const t=ymd(n),nuevas=r.borrador.items.filter(i=>i.kind==='eval'&&(!i.date||i.date>=t)).length;
    if(nuevas&&nuevas>evalRoom()){state.borrador=null;ui.pending=null;ui.blockedItems=null;
      if(from==='chat'){liaSay(limitMsg(),{cta:'evals'});render();}else{save();openPaywall('evals');}return;}}
  // Falta un dato: Lía lo pregunta y guarda lo entendido. En el chat, con respuestas rápidas.
  if(r.intent==='pregunta'){state.borrador={intent:r.borrador.intent,items:r.borrador.items,i:r.borrador.i,at:n.getTime()};ui.pending=null;  // la pregunta reemplaza una propuesta sin confirmar
    if(from==='chat'){liaSay(r.texto,{opciones:r.opciones||[]});render();}else{save();toast(r.texto);}return;}
  // Si no entendió la respuesta a su pregunta, la repite (el borrador sigue).
  const b=borradorVigente(state.borrador,n)?state.borrador:null;
  if(r.intent==='help'&&b){const it=b.items[b.i],p=preguntaPara(it,faltaDe(it),state,n);
    if(from==='chat'){liaSay(`No te entendí. ${p.texto}`,{opciones:p.opciones});render();}else toast(`No te entendí. ${p.texto}`);return;}
  state.borrador=null;
  // Una evaluación que cambió o se canceló: en el chat, Lía propone y la persona confirma; en la caja de Evaluaciones
  // se aplica de una vez, con Deshacer (como lo que se agrega ahí).
  if(r.intent==='cambiaEval'||r.intent==='quitaEval'){const e=evById(r.evalId),decir=t=>{if(from==='chat'){liaSay(t);render();}else toast(t);};
    if(!e){decir('No encontré esa evaluación. Revísala en Evaluaciones.');return;}
    const c=r.intent==='quitaEval'?{accion:'quitar',evalId:e.id}:{accion:'mover',evalId:e.id,date:r.date||e.date,time:r.time||e.time};
    if(c.accion==='mover'&&c.date===e.date&&c.time===e.time){decir(`${cap(nombreEval(e))} ya es el ${fechaCorta(e.date)} a las ${e.time}.`);return;}
    if(from==='chat'){ui.pending={cambio:c,q};save();render();
      anunciar(c.accion==='quitar'?`Lía entendió: quitar ${nombreEval(e)} del ${fechaCorta(e.date)}. Elige Quitar o Mantener.`:`Lía entendió: ${nombreEval(e)} pasa del ${fechaCorta(e.date)} a las ${e.time} al ${fechaCorta(c.date)} a las ${c.time}. Confirma o corrige.`);return;}
    toast(aplicarCambioEval(c),true);rerenderKeepScroll();return;}
  if(r.intent==='aviso'&&r.deCambio&&from!=='chat'){toast(r.texto);return;}
  if(r.intent==='add'){const ok=r.items;
    if(newEvalCount(ok)>evalRoom()){ui.blockedItems=ok;if(from==='chat'){liaSay(limitMsg(),{cta:'evals'});render();}else openPaywall('evals',{items:ok});return;}
    if(from==='chat'){ui.pending={items:ok,q};save();render();anunciar(`Lía entendió: ${ok.map(resumenItem).join('; ')}. Confirma o corrige.`);return;}
    const hecho=applyItems(ok);
    toast(`Lía agregó: ${ok.map(resumenItem).join('; ')}.${textoAgendado(hecho.ids)}`,true);rerenderKeepScroll();return;}
  if(from!=='chat'){toast(from==='commit'?'No te entendí. Prueba: “clases de lunes a viernes de 8 a 1”.':'No te entendí. Prueba: “parcial de Química el viernes a las 10”.');return;}
  if(r.intent==='except'){const exs=r.exs;
    if(isPro()&&state.settings.autonomy==='ask'){ui.pending={exs,q};render();anunciar(`Lía entendió: ${exs.map(x=>`${x.label}, ${fechaCorta(x.date)}, ${horario(x)}`).join('; ')}. Confirma o corrige.`);return;}
    const m=aplicarCambio(exs);liaSay(m.texto,m.opts);ui.pending=null;render();return;}
  if(r.intent==='aviso'){liaSay(r.texto);render();return;}
  if(r.intent==='log'){
    const e=evById(r.evalId),hoy=r.date===ymd(n);snapshot();
    state.done.push({id:uid(),evalId:e.id,date:r.date,start:hoy?fmt(Math.max(0,n.getHours()*60+n.getMinutes()-r.min)):'20:00',min:r.min});save();
    const falta=Math.max(0,Math.round(e.hours*60)-doneFor(state,e.id));
    liaSay(`Anoté ${hrs(r.min)} de ${e.course} (${hoy?'hoy':fechaCorta(r.date)}). ${falta?`Te ${faltaTxt(falta)}.`:'Ya completaste las horas que pedía.'}`,{undo:true});render();return;}
  if(r.intent==='agenda'){const p=P();const it=agendaFor(state,p,r.date);
    liaSay(it.length?`${cap(fechaLarga(r.date))}:\n${it.map(x=>`${fmt(x.s)}–${fmt(x.e)}  ${x.label}`).join('\n')}\nDuermes a las ${state.settings.sleep}.`:`${cap(fechaLarga(r.date))} lo tienes libre.`);render();return;}
  if(r.intent==='progress'){const p=P();const up=state.evals.filter(e=>e.date>=ymd(n));
    liaSay(up.length?up.map(e=>{const d=doneFor(state,e.id),need=e.hours*60;return `${e.course}: ${hrs(d)} de ${hrs(need)}${p.unmet[e.id]>0?` (${faltaTxt(p.unmet[e.id])} sin hueco)`:''}`;}).join('\n'):'No tienes evaluaciones próximas. ¿Me dices cuándo es la siguiente?');render();return;}
  if(r.intent==='next'){const e=state.evals.filter(e=>e.date>=ymd(n)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
    liaSay(e?`Tu próxima evaluación es ${EVAL_TYPES[e.type].label.toLowerCase()} de ${e.course}, el ${fechaLarga(e.date)} a las ${e.time}.`:'No tienes evaluaciones registradas.');render();return;}
  if(r.intent==='replan'&&!isPro()){
    if(canArm()){const p0=armWeek(false);liaSay(`Listo, armé tu semana: tienes ${hrs(p0.blocks.reduce((a,b)=>a+b.e-b.s,0))} de estudio agendadas.`);}
    else liaSay(`Ya armaste tu semana. En Gratis puedes volver a armarla desde el ${fechaLarga(nextArmDate())}. Con LIA Pro la reorganizo cuando quieras.`,{cta:'rearm'});
    render();return;}
  if(r.intent==='replan'){liaSay(`Listo, reorganicé todo: tienes ${hrs(P().blocks.reduce((a,b)=>a+b.e-b.s,0))} de estudio agendadas.`);render();return;}
  liaSay('Todavía entiendo frases simples. Prueba con:\n• “Parcial de Cálculo el jueves a las 9”\n• “Pasaron mi parcial de Cálculo al viernes”\n• “Trabajo de lunes a viernes de 3 a 7”\n• “Hoy salgo del trabajo a las 9”\n• “Mañana no tengo clases”\n• “Ayer estudié 2 horas de Cálculo”\n• “¿Qué tengo mañana?”\nPara mover un bloque, tócalo en Hoy o en Semana.');render();}
// ---------- Lía con IA: envío a la función lia-ia ----------
const IA_TIEMPO=15000;  // ms; la función corta a los 12 s, esto cubre la red del teléfono
const IA_NIVEL_GRATUITO=true;  // nivel gratuito de Gemini: el aviso dice que Google puede usar los mensajes
// Los topes (25 al día y 300 al mes) los pone usar_ia() en Supabase (migración cupo_ia); si cambian, cambia también estos textos y el aviso.
const IA_AVISOS={
  cupo_dia:'Ya usaste tus 25 mensajes con IA de hoy. Hasta mañana te respondo con lo básico.',
  cupo_mes:'Ya usaste tus 300 mensajes con IA de este mes. Hasta el próximo mes te respondo con lo básico.',
  sesion:'Tu sesión venció: vuelve a iniciarla en Perfil para usar la IA. Mientras, te respondo con lo básico.',
  solo_pro:'La IA es parte de LIA Pro. Te respondo con lo básico.',
  ocupado:'La IA no respondió esta vez, así que te respondo con lo básico.'};
function pedirIA(cuerpo){
  return sb().then(c=>c.auth.getSession()).then(({data})=>{const t=data&&data.session&&data.session.access_token;
    if(!t)return{ok:false,error:'sesion'};
    const ctl=new AbortController(),reloj=setTimeout(()=>ctl.abort(),IA_TIEMPO);
    return fetch(`${SB_CFG.url}/functions/v1/lia-ia`,{method:'POST',signal:ctl.signal,
        headers:{'Content-Type':'application/json',apikey:SB_CFG.key,Authorization:`Bearer ${t}`},body:JSON.stringify(cuerpo)})
      .then(res=>res.json().catch(()=>null).then(d=>res.ok&&d&&d.ok?d:{ok:false,error:(d&&d.error)||'ocupado'}))
      .finally(()=>clearTimeout(reloj));});}
// Con IA: el mensaje aparece de inmediato, Lía "piensa" y responde con la propuesta revisada por validarIA().
// Sin respuesta útil (error, sin cupo, o la IA no entendió), responde con las reglas como siempre.
// El historial y el contexto se toman al enviar: lo que pase mientras Lía piensa no cambia lo que se preguntó.
async function conIA(q){const n=now(),cuerpo={mensaje:q,historial:historialIA(state.chat),contexto:contextoIA(state,n)};
  state.chat.push({from:'me',text:q});save();ui.pensando=true;render();anunciar('Lía está pensando…');
  let r=null,aviso='';
  try{const d=await pedirIA(cuerpo);
    if(d.ok){if(typeof d.restantes_dia==='number')ui.iaRestantes=d.restantes_dia;const v=validarIA(d.respuesta,state,n);if(v.intent!=='help')r=v;}
    else{aviso=IA_AVISOS[d.error]||IA_AVISOS.ocupado;if(d.error==='cupo_dia'||d.error==='cupo_mes')ui.iaRestantes=0;
      if(d.error==='solo_pro')refrescarPlan(true).catch(()=>{});}}
  catch(e){aviso=IA_AVISOS.ocupado;}
  conservarBorrador(()=>{ui.pensando=false;if(aviso)liaSay(aviso);responder(q,'chat',r||interpret(q,state,n),n,{eco:false});});}
// Si la persona empezó a escribir mientras Lía pensaba, lo que escribió sigue en la caja cuando llega la respuesta.
function conservarBorrador(fn){const i=document.getElementById('chat-in'),v=i?i.value:'';fn();const j=document.getElementById('chat-in');if(j&&v&&!j.value)j.value=v;}
function sheetIA(){return `<div class="grab"></div><h2>Lía con IA</h2>
  <p class="muted" style="margin:0">Para entender lo que escribes, Lía envía tu mensaje y un resumen de tu horario (cursos, evaluaciones y rutinas) a Gemini, la IA de Google, en Estados Unidos. No envía tu nombre ni tu correo.</p>
  <p class="muted" style="margin:0">${IA_NIVEL_GRATUITO?'Por ahora usamos la versión gratuita de Gemini, así que Google puede usar esos mensajes para mejorar sus productos. No escribas datos personales que no quieras compartir.':'Google no usa esos mensajes para mejorar sus productos.'}</p>
  <p class="small muted" style="margin:0">Tienes 25 mensajes con IA al día. Sin internet o si la IA falla, Lía sigue entendiendo frases simples. Puedes apagarla cuando quieras en Perfil.</p>
  <button class="btn pri" data-a="ia-si">Usar Lía con IA</button><button class="btn sec" data-a="ia-no">Ahora no</button>`;}
// Si la persona cierra el aviso sin elegir, su mensaje se responde con las reglas y la próxima vez se le vuelve a preguntar.
function soltarPendienteIA(){const q=ui.iaPendiente;ui.iaPendiente=null;if(q){const n=now();responder(q,'chat',interpret(q,state,n),n);}else render();}
// Aplica cambios de un día (algo que ocupa o algo que se libera) y devuelve qué decirle a la persona.
// Con quitar, reemplaza un evento que se editó (Deshacer lo devuelve como estaba).
function aplicarCambio(exs,{quitar}={}){const p0=P(),fresco=!!state.frozen&&!planStale();snapshot();if(quitar)state.exceptions=state.exceptions.filter(x=>x.id!==quitar&&!(x.libre&&x.ref===quitar));for(const ex of exs)state.exceptions.push({id:uid(),...ex});save();
  const p1=P(),ex=exs[0],r=intervalo(ex.start,ex.end),dia=fechaCorta(ex.date);
  const nuevos=()=>p1.blocks.filter(b=>b.date===ex.date&&!p0.blocks.some(x=>x.date===b.date&&x.s===b.s&&x.evalId===b.evalId));
  if(ex.libre){const que=ex.label==='Salida temprano'?`el ${dia} sales a las ${ex.start}`:`el ${dia} no tienes ${exs.map(x=>x.label.replace(/^Sin /,'')).join(' ni ')}`;
    if(!isPro())return{texto:`Listo: ${que}. En Gratis no reorganizo sola: ${canArm()?'rearma tu semana para usar ese tiempo':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}.`,opts:{undo:true,cta:canArm()?null:'reorg'}};
    const cursos=[...new Set(nuevos().map(b=>evById(b.evalId).course))];
    return{texto:`Listo: ${que}.${cursos.length?` Usé ese tiempo para estudiar ${cursos.join(' y ')}.`:''}`,opts:{undo:true}};}
  const msg=`Anotado: ${ex.label.charAt(0).toLowerCase()+ex.label.slice(1)} el ${dia} de ${ex.start} a ${ex.end}.`,choca=b=>b.date===ex.date&&b.s<r.e&&b.e>r.s;
  if(!isPro()){const hit=p1.blocks.filter(choca);
    if(!hit.length){alDiaSiNoChoca(fresco);return{texto:msg+' No choca con tu estudio.',opts:{undo:true}};}
    if(esOcio({kind:'excepcion',cat:ex.cat})&&state.frozen){const t=reubicarOcio();alDiaSiNoChoca(fresco);return{texto:`${msg} ${t}`,opts:{undo:true}};}
    const e=evById(hit[0].evalId);
    return{texto:msg+` Choca con tu bloque de ${e?e.course:'estudio'} a las ${fmt(hit[0].s)}. En Gratis no reorganizo sola: ${canArm()?'puedes rearmar tu semana ahora':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}. Con LIA Pro lo muevo al instante.`,opts:{undo:true,cta:'reorg'}};}
  let extra=' No chocaba con tu estudio.';
  if(p0.blocks.some(choca)){const g={};for(const b of nuevos()){const c=evById(b.evalId).course;(g[c]=g[c]||[]).push(fmt(b.s));}
    extra=Object.keys(g).length?` Moví ${Object.entries(g).map(([c,ts])=>`${c} a las ${ts.join(' y ')}`).join('; ')}.`:' Reacomodé tus bloques en otros días.';}
  return{texto:msg+extra+` Igual duermes a las ${state.settings.sleep}.`,opts:{undo:true}};}

let rec=null;
function startMic(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback=()=>{ui.listen=null;render();const el=document.getElementById(target);if(el)el.focus();toast('Para dictar, toca el micrófono de tu teclado y habla.');};
  if(!SR){fallback();return;}
  try{rec=new SR();rec.lang='es-PE';rec.interimResults=true;rec.continuous=false;ui.listen={target,text:''};render();
    rec.onresult=e=>{ui.listen&&(ui.listen.text=Array.from(e.results).map(r=>r[0].transcript).join(''));const l=document.getElementById('live');if(l&&ui.listen)l.textContent=ui.listen.text;};
    rec.onerror=e=>{rec=null;if(e.error==='no-speech'){ui.listen=null;render();toast('No te escuché. Inténtalo de nuevo.');}else fallback();};
    rec.onend=()=>{if(ui.listen){const t=ui.listen.text,tg=ui.listen.target;ui.listen=null;render();if(t)submitVoice(tg,t);}};
    rec.start();}catch(e){fallback();}}
function stopMic(useIt){if(!ui.listen)return;const t=ui.listen.text,tg=ui.listen.target;ui.listen=null;try{rec&&(rec.onend=null,rec.stop());}catch(e){}rec=null;render();if(useIt&&t)submitVoice(tg,t);}

// El cliente de Supabase se carga solo cuando hace falta: quien usa Gratis sin cuenta nunca lo descarga.
let sbCliente=null;
function sb(){if(!cuentasActivas())return Promise.reject(new Error('sin-config'));
  if(!sbCliente)sbCliente=new Promise((res,rej)=>{if(window.supabase){res();return;}
      const el=document.createElement('script');el.src='vendor/supabase.js';el.onload=()=>res();el.onerror=()=>rej(new Error('sin-cliente'));document.head.appendChild(el);})
    .then(()=>{const c=window.supabase.createClient(SB_CFG.url,SB_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit',storageKey:'lia.auth'}});
      c.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>alCambiarSesion(ev,session),0);});return c;})
    .catch(e=>{sbCliente=null;throw e;});
  return sbCliente;}
function sbRpc(fn,args){return sb().then(c=>c.rpc(fn,args||{})).then(({data,error})=>{if(error)throw error;return data;});}
function mensajeError(e){const m=String((e&&(e.message||e.error_description||e.msg))||''),code=String((e&&(e.code||e.error_code))||'');
  if(m==='sin-config')return 'Las cuentas todavía no están activadas en esta versión de LIA.';
  if(m==='sin-cliente'||/Failed to fetch|NetworkError|Load failed|network/i.test(m)||navigator.onLine===false)return 'Sin conexión. Revisa tu internet e inténtalo otra vez.';
  if(code==='invalid_credentials'||/Invalid login credentials/i.test(m))return 'El correo o la contraseña no coinciden.';
  if(code==='user_already_exists'||/already registered/i.test(m))return 'Ya hay una cuenta con ese correo. Inicia sesión.';

  if(!Number.isFinite(g.inicio))delete g.inicio;
  ui.session=nuevaSesion(g);ui.session.preguntar=false;
  if(ui.session.running&&ui.session.elapsed()>=ui.session.total){const s=ui.session,e=evById(s.ev),min=minutosSesion(s);cerrarSesion();registrarSesion(s,min);render();
    toast(`Tu sesión terminó mientras LIA estaba cerrada. Registré ${hrs(min)} de ${e.course}.`,true);return;}
  render();tick();pedirPantalla();})();
iniciarCuentas();
setInterval(()=>{if(!ui.session&&!ui.sheet&&!ui.listen&&!document.activeElement.matches('input,select'))rerenderKeepScroll();},60000);
</script>
