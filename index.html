<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIA</title>
<meta name="description" content="Lía arma tu horario de estudio en las horas que de verdad tienes libres. Para universitarios que estudian y trabajan.">
<meta name="theme-color" content="#3D3BF3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LIA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="LIA · Tu horario de estudio">
<meta property="og:description" content="Lía arma tu horario de estudio en las horas que de verdad tienes libres.">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Base: márgenes seguros del teléfono (notch y barra inferior). */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
/* Inter 4 (SIL Open Font License 1.1, ver fonts/OFL.txt), alojada aquí para que la app funcione sin internet. */
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: one-column phone app (max 440px) — scrolling view + fixed tab bar; sheets slide up from the bottom. */
/* Colores: --x es el acento (texto, bordes, foco), --x-fill el relleno que lleva texto blanco encima, --x-soft el fondo suave
   y --x-ink el texto sobre ese fondo. Cada par texto/fondo llega a 4.5:1 en claro y en oscuro (pruebas de contraste). */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1C1B29; --mute:#6B6A7B; --line:#E6E2D9;
  --pri:#3D3BF3; --pri-ink:#FFFFFF; --pri-soft:#ECEBFF; --pri-sub:#C9C8FF;
  --clase:#E8EBF2; --clase-ink:#1C1B29; --trabajo:#FFE6BA; --trabajo-ink:#5A3B00;
  --otro:#E4F1EA; --otro-ink:#1F4D33; --exam:#FF5A4E; --exam-soft:#FFEFEC; --exam-ink:#B4271B;
  --ok:#1E9E5A; --ok-soft:#E3F7EC; --ok-ink:#13703F; --pri-strong:#3D3BF3; --night:#16153A; --night-ink:#FFFFFF; --shadow:rgba(28,27,41,.10);
  --badge-bg:#3D3BF3; --badge-ink:#FFFFFF;
  /* Rellenos con texto blanco encima (4.5:1 o más) y enlace dentro del aviso */
  --pri-fill:#3D3BF3; --exam-fill:#CF3529; --toast-link:#C9C8FF;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121220; --surface:#1C1B2E; --ink:#EEEDF7; --mute:#A3A2B8; --line:#2D2C44;
  --pri:#8A88FF; --pri-ink:#FFFFFF; --pri-soft:#26254A; --pri-sub:#D3D2FF;
  --clase:#26283A; --clase-ink:#E0E2EE; --trabajo:#3D2F14; --trabajo-ink:#FFD891;
  --otro:#1D3327; --otro-ink:#A8E6C3; --exam:#FF6F64; --exam-soft:#3A1E1E; --exam-ink:#FF9F97;
  --ok:#4CC98A; --ok-soft:#173326; --ok-ink:#4CC98A; --pri-strong:#3D3BF3; --night:#0B0B19; --night-ink:#FFFFFF; --shadow:rgba(0,0,0,.4);
  --badge-bg:#D3D2FF; --badge-ink:#16153A; --pri-fill:#5754E8; --exam-fill:#C9372D; --toast-link:#3D3BF3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121220; --surface:#1C1B2E; --ink:#EEEDF7; --mute:#A3A2B8; --line:#2D2C44;
  --pri:#8A88FF; --pri-ink:#FFFFFF; --pri-soft:#26254A; --pri-sub:#D3D2FF;
  --clase:#26283A; --clase-ink:#E0E2EE; --trabajo:#3D2F14; --trabajo-ink:#FFD891;
  --otro:#1D3327; --otro-ink:#A8E6C3; --exam:#FF6F64; --exam-soft:#3A1E1E; --exam-ink:#FF9F97;
  --ok:#4CC98A; --ok-soft:#173326; --ok-ink:#4CC98A; --pri-strong:#3D3BF3; --night:#0B0B19; --night-ink:#FFFFFF; --shadow:rgba(0,0,0,.4);
  --badge-bg:#D3D2FF; --badge-ink:#16153A; --pri-fill:#5754E8; --exam-fill:#C9372D; --toast-link:#3D3BF3; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body.wm{background:#3D3BF3}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
/* Los títulos que reciben el foco por código (al abrir una hoja) no son controles: sin contorno. */
h1[tabindex="-1"]:focus-visible,h2[tabindex="-1"]:focus-visible,[data-foco]:focus-visible{outline:none}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:8px 10px;border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute);padding-block:4px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pri);font-weight:600}
.tab .av{width:40px;height:40px}
/* type */
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:600}
.kicker{font-size:13px;color:var(--mute);font-weight:500}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row-h{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.hero{background:var(--pri-fill);color:var(--pri-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:var(--pri-ink);opacity:.9}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.hero-t{font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance}
/* La evaluación del día, primero en Hoy */
.evhoy{border:1.5px solid var(--exam)}
.evhoy .eyebrow,.evhoy-a{color:var(--exam-ink)}
.evhoy-t{font-size:20px;font-weight:700;line-height:1.25}
.evhoy-a{font-weight:600}
.note{background:var(--pri-soft);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.note b{color:var(--pri)}
.warn{background:var(--exam-soft);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.warn b{color:var(--exam-ink)}
.night{background:var(--night);color:var(--night-ink);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.night .sub{opacity:.75;font-size:13px}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--pri);border-radius:14px;padding:10px 12px;font-size:13px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:52px;border-radius:14px;font-weight:600;font-size:16px;padding:0 18px;width:100%}
.btn.pri{background:var(--pri-fill);color:var(--pri-ink)}
.btn.light{background:var(--surface);color:var(--pri)}
.btn.sec{background:var(--surface);color:var(--pri);border:1.5px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--exam-ink);border:1.5px solid var(--line)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--pri-soft);color:var(--pri)}
.pill.solid{background:var(--pri-fill);color:var(--pri-ink)}
.pill.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.dashed{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--pri);color:var(--pri);border-radius:16px;padding:10px 12px;font-weight:600;width:100%}
.dashed .grow{text-align:left}
.mic{width:36px;height:36px;border-radius:50%;background:var(--pri-fill);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.mic svg{width:18px;height:18px}
.ico{width:22px;height:22px;flex:none}
/* avatar */
.av{border-radius:50%;background:linear-gradient(135deg,#3D3BF3,#A855F7);display:grid;place-items:center;flex:none;color:#fff}
.av svg{width:55%;height:55%}
/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;width:100%}
.ag .t{font-size:13px;color:var(--mute);font-weight:500;padding-top:12px}
.blk{border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.blk b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.blk small{font-size:13px;opacity:.85}
.k-estudio small,.k-examen small,.k-hecho small,.k-libre small{opacity:1}
.k-clase{background:var(--clase);color:var(--clase-ink)}
.k-trabajo{background:var(--trabajo);color:var(--trabajo-ink)}
.k-traslado,.k-otro{background:var(--otro);color:var(--otro-ink)}
/* Lo que se liberó solo ese día */
.k-libre{background:transparent;color:var(--ok-ink);border:1.5px dashed var(--ok)}
.k-excepcion{background:repeating-linear-gradient(135deg,var(--clase) 0 8px,var(--surface) 8px 16px);color:var(--clase-ink);border:1px solid var(--line)}
.k-estudio{background:var(--pri-fill);color:var(--pri-ink)}
.k-hecho{background:var(--ok-soft);color:var(--ok-ink)}
.k-examen{background:var(--exam-fill);color:#fff}
.k-dormir{background:var(--night);color:var(--night-ink)}
/* Lo que ya pasó: se ve atenuado sin bajar el contraste del texto (con opacidad quedaba en 2.5:1) */
.ag.past .blk{background:var(--surface);color:var(--mute);border:1px dashed var(--line)}
.ag.past .blk small{opacity:1}
.day.past:not([aria-pressed="true"]) b{color:var(--mute)}
.stack.past .item{background:transparent;border-style:dashed}
.stack.past .item b,.stack.past .item .tag{color:var(--mute)!important}
.stack.past .sw{background:var(--line);color:var(--mute)}
/* lists */
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.sw{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.day span{font-size:12px;color:var(--mute);font-weight:500}
.day b{font-size:17px;font-weight:600}
.day[aria-pressed="true"]{background:var(--pri-fill);border-color:var(--pri-fill);color:var(--pri-ink)}
.day[aria-pressed="true"] span{color:var(--pri-ink);opacity:.9}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--pri)}
.day[aria-pressed="true"] .dot{background:var(--pri-ink)}
.day .dot.x{background:var(--exam)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;color:var(--pri);font-weight:700}
.stat span{font-size:12px;color:var(--mute)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;max-width:84%;white-space:pre-line;display:flex;flex-direction:column;gap:8px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--pri-fill);color:var(--pri-ink);border-color:var(--pri-fill);border-radius:16px 16px 4px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.inbar{display:flex;gap:10px;align-items:center;padding-block:8px}
.inbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:13px 16px}
.inbar .mic{width:48px;height:48px}
.inbar .mic svg{width:22px;height:22px}
/* forms */
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f select,.clave input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:400;color:var(--ink);font-size:16px;width:100%;min-width:0}
.clave{position:relative;display:block}
.clave input{padding-right:88px}
.clave .ver{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:44px;padding:0 12px;font-size:13px;font-weight:600;color:var(--pri);border-radius:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:340px){.two:has(input[type=time]){grid-template-columns:minmax(0,1fr)}}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dpick label{display:grid;place-items:center;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink)}
.dpick input{position:absolute;opacity:0;pointer-events:none}
.dpick input:checked+span{color:var(--pri-ink)}
.dpick label:has(input:focus-visible){outline:2px solid var(--pri);outline-offset:2px}
.dpick label:has(input:checked){background:var(--pri-fill);border-color:var(--pri-fill);color:var(--pri-ink)}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.opt:has(input:checked){border-color:var(--pri)}
.opt input{accent-color:var(--pri);width:20px;height:20px;flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,25,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;
  padding-block:20px max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
/* En una hoja larga, nada se encoge para caber: la hoja se desplaza (antes la tabla de planes quedaba debajo de los botones). */
.sheet>*{flex-shrink:0}
/* full overlays */
.full{position:fixed;inset:0;z-index:40;background:var(--night);color:var(--night-ink);display:flex;justify-content:center}
.full .in{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.full .top{width:100%;display:flex;justify-content:space-between;font-size:14px;opacity:.75}
.full .glass{background:rgba(255,255,255,.08);border-radius:16px;padding:14px;width:100%;text-align:left;display:flex;gap:12px;align-items:center}
.halo{width:160px;height:160px;border-radius:50%;background:rgba(110,108,255,.12);display:grid;place-items:center;position:relative}
.halo::before{content:"";position:absolute;inset:20px;border-radius:50%;background:rgba(110,108,255,.25);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.halo .av{position:relative}
.transcript{font-size:21px;font-weight:600;line-height:1.3;min-height:56px}
.stopb{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center}
.stopb i{width:22px;height:22px;border-radius:5px;background:#FF5A4E}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring .c b{font-size:52px;font-weight:700;letter-spacing:-.02em}
/* welcome */
.welcome{background:#3D3BF3;color:#fff;padding-block:20px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.welcome h1{font-size:32px;color:#fff}
.welcome .preview{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;color:#1C1B29}
.welcome .preview .k-clase{background:#E8EBF2;color:#1C1B29}.welcome .preview .k-trabajo{background:#FFE6BA;color:#5A3B00}.welcome .preview .k-estudio{background:#3D3BF3;color:#fff}
.welcome .btn.light{background:#fff;color:#3D3BF3}
.welcome .btn.ghostw{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:20px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--pri)}
.check{width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.check svg{width:14px;height:14px}
.check.no{background:var(--exam-soft);color:var(--exam-ink)}
.tip{margin:0;font-size:13px;color:var(--mute);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tip b{color:var(--ink)}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;width:min(408px,calc(100% - 32px));font-size:14px;box-shadow:0 8px 24px var(--shadow)}
.toast.arriba{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
.toast button{color:var(--toast-link);font-weight:700;white-space:nowrap}
/* planes: LIA Gratis y LIA Pro */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pro{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.06em;line-height:1;padding:3px 6px;border-radius:6px;background:var(--badge-bg);color:var(--badge-ink);vertical-align:middle;flex:none}
.btn.pri .pro,.pill.solid .pro,.hero .pro{background:var(--pri-ink);color:var(--pri-strong)}
.hero .btn.light .pro{background:var(--badge-bg);color:var(--badge-ink)}
.mic.lock{position:relative}
/* Áreas de toque de al menos 44 px sin cambiar el tamaño visible */
.pill,.mic,button.ico,.toast button{position:relative}
.pill::before{content:"";position:absolute;inset:-5px 0}
.mic::before{content:"";position:absolute;inset:-4px}
.inbar .mic::before{inset:0}  /* ya miden 48 px y están junto al borde */
button.ico::before{content:"";position:absolute;inset:-11px}
.toast button::before{content:"";position:absolute;inset:-12px -8px}
.mic.lock::after{content:"PRO";position:absolute;top:-7px;right:0;font-size:8px;font-weight:700;letter-spacing:.04em;line-height:1;padding:2px 4px;border-radius:5px;background:var(--badge-bg);color:var(--badge-ink)}
.plan{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer}
.plan:has(input:checked){border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.plan input{accent-color:var(--pri);width:20px;height:20px;flex:none;margin:1px 0 0}
.plan .price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.save{display:inline-block;font-size:12px;font-weight:600;color:var(--ok-ink);background:var(--ok-soft);border-radius:6px;padding:2px 6px}
.demo-note{font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.demo-note b{color:var(--ink)}
.cmp{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 6px;border-bottom:1px solid var(--line)}
.cmp thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.cmp tbody th{color:var(--mute);font-weight:500;width:28%}
.cmp td:last-child{font-weight:500}
.soon{display:inline-block;font-size:11px;font-weight:500;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:2px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--pri-soft);border-top-color:var(--pri);animation:spin .9s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
.big-check{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;align-self:center}
.big-check svg{width:28px;height:28px}
.linkbtn{font-size:13px;font-weight:600;color:var(--pri);padding:6px 0;min-height:44px}
.ferr{margin:0;font-size:13px;font-weight:600;color:var(--exam-ink)}
.btn[disabled]{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="app" id="app">
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div>
<div id="layer"></div>
<div id="toastbox" role="status" aria-live="polite"></div>
<div id="anuncio" class="sr-only" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/*LOGIC-START*/
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0);};
const fmt=m=>{m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+':'+pad(m%60);};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayDiff=(a,b)=>Math.round((fromYmd(b)-fromYmd(a))/864e5);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C=['D','L','M','M','J','V','S'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const EVAL_TYPES={parcial:{label:'Parcial',h:5,exam:true},examen:{label:'Examen',h:5,exam:true},final:{label:'Final',h:6,exam:true},practica:{label:'Práctica',h:3,exam:true},control:{label:'Control',h:2,exam:true},entrega:{label:'Entrega',h:4,exam:false},exposicion:{label:'Exposición',h:3,exam:false}};
const COMMIT_TYPES={clase:'Clases',trabajo:'Trabajo',traslado:'Traslado',otro:'Otro'};
const uid=()=>Math.random().toString(36).slice(2,9);
const hrs=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`;};
const fechaLarga=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;};
const fechaCorta=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;};

function subtract(wins,s,e){const out=[];for(const w of wins){if(e<=w.s||s>=w.e){out.push(w);continue;}if(s>w.s)out.push({s:w.s,e:s});if(e<w.e)out.push({s:e,e:w.e});}return out;}
// Un día de estudio va de la hora de despertar a la de dormir. Si se duerme después de medianoche (00:30),
// el día termina en el minuto 1470; un horario que termina al día siguiente (22:00–06:00) funciona igual.
const MARGEN_DESPERTAR=30;  // nadie estudia apenas abre los ojos
function finDelDia(S){const w=toMin(S.wake);let s=toMin(S.sleep);if(s<=w)s+=1440;return s;}
function intervalo(start,end){const s=toMin(start);let e=toMin(end);if(e<s)e+=1440;return{s,e};}
function busyFor(state,date){const wd=fromYmd(date).getDay(),ayer=(wd+6)%7,prev=ymd(addDays(fromYmd(date),-1));const b=[];
  // Lo liberado solo ese día ("hoy no tengo clases", "salgo temprano") se descuenta de ese compromiso.
  const libres=(c,d,desfase)=>state.exceptions.filter(x=>x.libre&&x.ref===c.id&&x.date===d).map(x=>{const r=intervalo(x.start,x.end);return[r.s+desfase,r.e+desfase];});
  const poner=(c,s,e,extra,quitar)=>{let partes=[{s,e}];for(const [ls,le] of quitar)partes=subtract(partes,ls,le);
    for(const q of partes)if(q.e>q.s)b.push({s:q.s,e:q.e,kind:c.type,label:c.name,ref:c.id,...extra});};
  for(const c of state.commitments){const r=intervalo(c.start,c.end);
    if(c.days.includes(wd))poner(c,r.s,r.e,{},libres(c,date,0));
    if(r.e>1440&&c.days.includes(ayer))poner(c,0,r.e-1440,{cola:true},libres(c,prev,-1440));}  // sigue desde anoche
  for(const x of state.exceptions){if(x.libre)continue;const r=intervalo(x.start,x.end);
    if(x.date===date)b.push({s:r.s,e:r.e,kind:'excepcion',label:x.label,ref:x.id});
    else if(x.date===prev&&r.e>1440)b.push({s:0,e:r.e-1440,kind:'excepcion',label:x.label,ref:x.id,cola:true});}
  return b;}
// Todo lo ocupado dentro de un día de estudio, incluida la madrugada siguiente cuando se duerme después de medianoche.
function ocupadoMarco(state,date,fin){const o=busyFor(state,date).map(b=>[b.s,b.e]);
  for(const x of state.done)if(x.date===date)o.push([toMin(x.start),toMin(x.start)+x.min]);
  for(const e of state.evals)if(e.date===date)o.push([toMin(e.time)-30,toMin(e.time)+120]);
  if(fin>1440){const m=ymd(addDays(fromYmd(date),1));
    for(const b of busyFor(state,m))if(!b.cola)o.push([b.s+1440,b.e+1440]);
    for(const x of state.done)if(x.date===m)o.push([toMin(x.start)+1440,toMin(x.start)+1440+x.min]);
    for(const e of state.evals)if(e.date===m)o.push([toMin(e.time)+1410,toMin(e.time)+1560]);}
  return o;}
function evalDeadline(ev,S){const t=EVAL_TYPES[ev.type]||EVAL_TYPES.parcial;
  if(t.exam)return{date:ymd(addDays(fromYmd(ev.date),-1)),end:finDelDia(S)};
  return{date:ev.date,end:Math.min(toMin(ev.time)-60,finDelDia(S))};}
function doneFor(state,id){return state.done.filter(x=>x.evalId===id).reduce((a,x)=>a+x.min,0);}

// Motor de horarios: reparte las horas que pide cada evaluación en los huecos libres reales.
function plan(state,now){
  const S=state.settings,wake=toMin(S.wake)+MARGEN_DESPERTAR,sleep=finDelDia(S);
  const today=ymd(now),nowMin=now.getHours()*60+now.getMinutes();
  const evs=state.evals.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let last=ymd(addDays(now,6));for(const e of evs)if(e.date>last)last=e.date;
  const nDays=Math.min(dayDiff(today,last),60);const days={};
  for(let i=0;i<=nDays;i++){const d=ymd(addDays(fromYmd(today),i));let wins=wake<sleep?[{s:wake,e:sleep}]:[];
    if(i===0)wins=subtract(wins,0,Math.ceil((nowMin+10)/15)*15);
    for(const [s,e] of ocupadoMarco(state,d,sleep))wins=subtract(wins,s,e);
    days[d]={wins,load:0,free:wins.reduce((a,w)=>a+w.e-w.s,0)};}
  for(const x of state.done)if(days[x.date])days[x.date].load+=x.min;
  const blocks=[],unmet={};
  for(const ev of evs){
    let rem=Math.max(0,Math.round(ev.hours*60)-doneFor(state,ev.id));
    const dl=evalDeadline(ev,S);
    if(dl.date<today){unmet[ev.id]=ev.date<today?0:rem;continue;}
    const dlist=Object.keys(days).filter(d=>d<=dl.date).sort();
    const evLoad={};let progress=true;
    while(rem>=10&&progress){progress=false;
      for(const d of dlist){if(rem<10)break;const day=days[d];
        const avail=Math.min(S.maxDay-day.load,120-(evLoad[d]||0));
        const need=S.minBlock;  // ningún bloque más corto que el mínimo, aunque falte menos tiempo
        if(avail<need)continue;
        const limit=d===dl.date?dl.end:sleep;
        const cands=day.wins.map(w=>({s:w.s,e:Math.min(w.e,limit)})).filter(w=>w.e-w.s>=need);
        if(!cands.length)continue;
        cands.sort((a,b)=>(b.e-b.s)-(a.e-a.s)||a.s-b.s);
        const w=cands[0];let len=Math.min(S.block,Math.max(rem,need),avail,w.e-w.s);
        len=Math.floor(len/5)*5;if(len<need)continue;
        let st=w.s;if(w.e-w.s>=len+180&&st<600)st=Math.min(600,w.e-len);
        blocks.push({evalId:ev.id,date:d,s:st,e:st+len});
        day.wins=subtract(day.wins,st,st+len+10);day.load+=len;evLoad[d]=(evLoad[d]||0)+len;rem-=len;progress=true;}}
    unmet[ev.id]=rem>=10?rem:0;}
  blocks.sort((a,b)=>(a.date+fmt(a.s)).localeCompare(b.date+fmt(b.s)));
  return{blocks,unmet,days};
}
// Plan Gratis: el que se armó al empezar la semana, contado con honestidad. Un bloque que ya pasó sin estudiarse
// no cuenta como agendado: esas horas vuelven a faltar y el bloque queda en «perdidos» hasta que la persona diga si lo estudió.
const claveBloque=b=>`${b.evalId}|${b.date}|${b.s}`;
// Cuándo termina un bloque: si pasa la medianoche, termina al día siguiente.
function finBloque(b){return b.e>=1440?{date:ymd(addDays(fromYmd(b.date),1)),min:b.e-1440}:{date:b.date,min:b.e};}
function planCongelado(state,f,now){const t=ymd(now),nm=now.getHours()*60+now.getMinutes(),S=state.settings;
  const evs=new Map(state.evals.map(e=>[e.id,e])),vistos=new Set(Array.isArray(f.vistos)?f.vistos:[]);
  const sig=d=>ymd(addDays(fromYmd(d),1));
  // Lo estudiado después de medianoche se guarda con la fecha del día siguiente.
  const hecho=b=>state.done.some(x=>{if(x.evalId!==b.evalId)return false;const s=toMin(x.start)+(x.date===b.date?0:x.date===sig(b.date)?1440:NaN);return s<b.e&&s+x.min>b.s;});
  const aTiempo=b=>{const dl=evalDeadline(evs.get(b.evalId),S);return b.date<dl.date||(b.date===dl.date&&b.e<=dl.end);};
  const paso=b=>{const f=finBloque(b);return f.date<t||(f.date===t&&f.min<=nm);};
  const vivos=f.blocks.filter(b=>evs.has(b.evalId)&&!hecho(b)&&aTiempo(b));
  const blocks=vivos.filter(b=>b.date>=t);
  const perdidos=vivos.filter(b=>paso(b)&&evs.get(b.evalId).date>=t&&!vistos.has(claveBloque(b)));
  const unmet={},unplanned={};
  for(const e of state.evals){const r=Math.max(0,Math.round(e.hours*60)-doneFor(state,e.id));
    if(f.evalIds.includes(e.id)){const fut=vivos.filter(b=>b.evalId===e.id&&!paso(b)).reduce((a,b)=>a+b.e-b.s,0);unmet[e.id]=e.date>=t&&r-fut>=10?r-fut:0;}
    else if(e.date>=t&&r>=10)unplanned[e.id]=r;}
  return{blocks,unmet,unplanned,perdidos,days:{},frozen:true};}
function agendaFor(state,P,date){
  const it=[];const ev=id=>state.evals.find(e=>e.id===id);
  for(const b of busyFor(state,date))it.push(b.cola?{...b,sub:'Sigue desde anoche'}:{...b});
  for(const x of state.exceptions)if(x.libre&&x.date===date){const r=intervalo(x.start,x.end);it.push({s:r.s,e:r.e,kind:'libre',label:x.label,ref:x.id});}
  for(const e of state.evals)if(e.date===date)it.push({s:toMin(e.time),e:toMin(e.time)+120,kind:'examen',label:`${EVAL_TYPES[e.type].label} · ${e.course}`,ref:e.id});
  for(const x of state.done)if(x.date===date){const e=ev(x.evalId);it.push({s:toMin(x.start),e:toMin(x.start)+x.min,kind:'hecho',label:`Estudiaste ${e?e.course:''}`,ref:x.id});}
  for(const b of P.blocks)if(b.date===date){const e=ev(b.evalId);it.push({s:b.s,e:b.e,kind:'estudio',label:`Estudiar ${e?e.course:''}`,sub:e?`Para: ${EVAL_TYPES[e.type].label} ${fechaCorta(e.date)}`:'',ref:b.evalId,block:b});}
  it.sort((a,b)=>a.s-b.s);return it;
}

// ---------- Lectura de frases (sin IA) ----------
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const DAYW={domingo:0,domingos:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,sabados:6};
const EVAL_KW={parcial:'parcial',parciales:'parcial',examen:'examen',examenes:'examen',tarea:'entrega',tareas:'entrega',proyecto:'entrega',monografia:'entrega',informe:'entrega',ensayo:'entrega',final:'final',finales:'final',practica:'practica',pc:'practica',pc1:'practica',pc2:'practica',pc3:'practica',pc4:'practica',control:'control',quiz:'control',lab:'control',laboratorio:'control',entrega:'entrega',entrego:'entrega',entregar:'entrega',entregable:'entrega',exposicion:'exposicion',expongo:'exposicion',sustentacion:'exposicion',sustento:'exposicion'};
const COMMIT_KW={trabajo:'trabajo',trabajar:'trabajo',trabajando:'trabajo',chamba:'trabajo',chambeo:'trabajo',turno:'trabajo',clase:'clase',clases:'clase',traslado:'traslado',viaje:'traslado',gimnasio:'otro',gym:'otro',ingles:'otro',voluntariado:'otro',almuerzo:'otro',futbol:'otro',iglesia:'otro',academia:'otro'};
const NUMW={una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};
const MESN={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
const TIMECTX=new Set(['las','la','de','a','desde','hasta','y','entre']);
function tokenize(text){
  const raw=text.replace(/[“”"¿?¡!]/g,' ').replace(/(\d)(am|pm|hrs|hr|h)\b/gi,'$1 $2').replace(/([ap])\.\s?m\.?/gi,'$1m').replace(/,/g,' , ').split(/\s+/).filter(Boolean);
  const toks=raw.map(o=>({o:o.replace(/[.;]+$/,''),n:norm(o).replace(/[.;]+$/,'')}));
  for(let i=0;i<toks.length;i++){const t=toks[i];if(NUMW[t.n]&&i>0&&TIMECTX.has(toks[i-1].n)){t.n=String(NUMW[t.n]);}}
  return toks;}
const H='(\\d{1,2})(?::(\\d{2}))?(?:\\s*(am|pm))?';
function partOf(ns){const m=ns.match(/\b(?:en|por|de|a) (?:la|las) (manana|tarde|noche)s?\b/)||ns.match(/\b(tarde|noche)s?\b/);return m?m[1]:null;}
// Parte del día pegada a una hora: "10 de la noche", "6 de la mañana", "2 de la madrugada", "12 del mediodía".
const Q='(?:\\s+(?:(?:de|en|por)\\s+la|del)\\s+(manana|tarde|noche|madrugada|mediodia))?';
const HQ=H+Q;
function adj(h,m,ap,part){h=+h;m=+m||0;if(ap){if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;}
  else if(part==='noche'&&h===12)h=0;
  else if((part==='tarde'||part==='noche'||part==='mediodia')&&h<12)h+=12;
  else if(part!=='manana'&&part!=='madrugada'&&h>=1&&h<=6)h+=12;return h*60+m;}
// Lecturas posibles de una hora en minutos: "6" puede ser 06:00 o 18:00; "6 am" o "6 de la mañana", solo 06:00.
function horasPosibles(h,m,ap,q){h=+h;m=+m||0;if(h>24||m>59)return[];if(h>12)return[h%24*60+m];
  const am=h%12*60+m,pm=(h%12+12)*60+m;
  if(ap==='am'||q==='madrugada')return[am];
  if(q==='manana')return[h===12?720+m:am];
  if(ap==='pm'||q==='tarde'||q==='mediodia')return[pm];
  if(q==='noche')return[h===12?m:pm];
  return h===12?[720+m,m]:[am,pm];}
// La lectura más probable de un rango: que dure 12 h o menos, que no cruce la medianoche, que no empiece
// de madrugada y, si empatan, la de siempre (de 1 a 6 sin aclarar es de la tarde). Si cruza, el fin pasa de 1440.
function rangoProbable(a,b,parte){const pg=a[2]||a[3]||b[2]||b[3]?null:parte;
  const qa=a[3]||pg,qb=b[3]||pg,hab=adj(a[0],a[1],a[2],qa);let mejor=null;
  for(const s of horasPosibles(a[0],a[1],a[2],qa))for(const e0 of horasPosibles(b[0],b[1],b[2],qb)){
    let e=e0===0&&s>0?1440:e0,cruza=false;if(e<=s){e+=1440;cruza=true;}
    const pen=[e-s>720?1:0,cruza?1:0,s<360?1:0,s===hab?0:1].join();
    if(!mejor||pen<mejor.pen)mejor={s,e,pen};}
  return mejor?[mejor.s,mejor.e]:null;}
function parseTimes(ns){const part=partOf(ns);
  let m=ns.match(new RegExp(`\\b(?:de|desde|entre)\\s+(?:las\\s+|la\\s+)?${HQ}\\s+(?:a|hasta|y)\\s+(?:las\\s+|la\\s+)?${HQ}`));
  if(!m)m=ns.match(new RegExp(`\\b(\\d{1,2}):(\\d{2})(?:\\s*(am|pm))?${Q}\\s*(?:-|a|hasta)\\s*${HQ}`));
  if(m){const r=rangoProbable(m.slice(1,5),m.slice(5,9),part);if(r)return{range:r,part};}
  m=ns.match(new RegExp(`\\b(?:hasta(?:\\s+las|\\s+la)?|salgo\\b.{0,25}?\\ba(?:\\s+las|\\s+la)?)\\s+${HQ}`));
  if(m)return{until:adj(m[1],m[2],m[3],m[4]||part),part,crudo:m.slice(1,5)};
  m=ns.match(new RegExp(`\\b(?:a las|a la|las)\\s+${HQ}`));
  if(m)return{at:adj(m[1],m[2],m[3],m[4]||part),part,crudo:m.slice(1,5)};
  m=ns.match(/\b(\d{1,2}):(\d{2})(?:\s*(am|pm))?/);
  if(m)return{at:adj(m[1],m[2],m[3],part),part,crudo:[m[1],m[2],m[3],null]};
  m=ns.match(/\b(\d{1,2})\s*(am|pm)\b/);
  if(m)return{at:adj(m[1],0,m[2],part),part,crudo:[m[1],null,m[2],null]};
  return{part};}
function nextWeekday(now,wd,allowToday){let d=(wd-now.getDay()+7)%7;if(d===0&&!allowToday)d=7;return ymd(addDays(now,d));}
function parseDate(ns,now){
  if(/\bpasado manana\b/.test(ns))return ymd(addDays(now,2));
  const ns2=ns.replace(/\b(?:en|por|de|a) (?:la|las) mananas?\b/g,' ');
  if(/\bhoy\b/.test(ns2))return ymd(now);
  if(/\bmanana\b/.test(ns2))return ymd(addDays(now,1));
  let m=ns.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})\b/);
  const mk=(d,mo)=>{let y=now.getFullYear();let dt=new Date(y,mo-1,d);if(dt<addDays(now,-1))dt=new Date(y+1,mo-1,d);return ymd(dt);};
  if(m)return mk(+m[1],+m[2]);
  m=ns.match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b/);
  if(m)return mk(+m[1],MESN[m[2]]);

function parseClause(toks,now,prev,S){

    const doble=toks[iN].n==='trabajo'&&TRABAJO_ENTREGA.test((toks[iN+1]||{}).n||'');
    const resto=extractCourse(toks,doble?iN+1:iN,true);

    if(!range)return{kind:'commit',type,name,error:`¿A qué hora es ${name.toLowerCase()}? Por ejemplo: “de 3 a 7”.`};

const EVENTO=/\b(cumpleanos|reunion|cita|fiesta|matrimonio|boda|evento|consulta|dentista|entrevista|partido|velorio|tramite|concierto)\b/;

// "No tengo clases", "cancelaron mi clase", "hoy no voy a trabajar": ese compromiso no va ese día.
const NO_VA=/\b(cancelaron|cancelo|suspendieron|suspendio|no hay|no tengo|no tendre|no voy a (?:ir|tener|trabajar)|no voy al?|no ire|no trabajo|no entro)\b/;

function interpret(text,state,now){

  if(/\b(que tengo|que me toca|mi agenda|como esta mi)\b/.test(ns)){const d=parseDate(ns,now)||ymd(now);return{intent:'agenda',date:d};}
  if(/\b(cuanto me falta|cuantas horas|como voy)\b/.test(ns))return{intent:'progress'};
  if(/\b(cuando es|proximo examen|siguiente examen)\b/.test(ns))return{intent:'next'};
  const hasEval=toks.some(t=>EVAL_KW[t.n]);
  // Estudio que ya hiciste: "ayer estudié 2 horas de cálculo".

    if(!min)return{intent:'log',error:'¿Cuánto tiempo estudiaste? Dime, por ejemplo: “ayer estudié 2 horas de Cálculo”.'};

    if(!e){const op=state.evals.filter(x=>x.date>=ymd(now)).map(x=>x.course);
      return{intent:'log',min,date,error:op.length?`¿De qué evaluación? Dime, por ejemplo: “ayer estudié ${hrs(min)} de ${op[0]}”. Tienes: ${op.join(', ')}.`:'Todavía no tienes evaluaciones. Agrega una y luego anotamos lo que estudiaste.'};}

    const date=parseDate(ns,now)||ymd(now);const tm=parseTimes(ns);const wake=toMin(S.wake),sleep=finDelDia(S);

      const cands=(tm.crudo?horasPosibles(...tm.crudo):[tm.until!=null?tm.until:tm.at]).flatMap(x=>[x,x+1440]);
      if(c){const r=intervalo(c.start,c.end);
        const x=cands.filter(v=>v>r.e&&v<=r.e+720||!quedo&&v>r.s&&v<r.e).sort((a,b)=>Math.abs(a-r.e)-Math.abs(b-r.e))[0];

        if(x<r.e){const ex={date,start:fmt(x),end:fmt(r.e),label:'Salida temprano',libre:true,ref:c.id};return{intent:'except',exs:[ex],ex};}

function newEvalCount(items){const t=ymd(now());return items.filter(i=>i.kind==='eval'&&i.date>=t).length;}
function limitMsg(){return `En Gratis puedes tener hasta ${FREE_EVALS} evaluaciones próximas y ya tienes ${upcomingEvals()}. Con LIA Pro no hay límite.`;}
function planSig(){const S=state.settings;return JSON.stringify([state.commitments,state.evals.map(e=>[e.id,e.type,e.date,e.time,e.hours]),state.exceptions,S.wake,S.sleep,S.maxDay,S.block,S.minBlock]);}
function armWeek(initial){const p=plan(state,now());
  state.frozen={week:mondayOf(now()),at:ymd(now()),initial:!!initial,sig:planSig(),blocks:p.blocks,unmet:p.unmet,evalIds:state.evals.map(e=>e.id)};save();return p;}
function canArm(){const f=state.frozen;return !f||f.initial||f.week<mondayOf(now());}
function planStale(){return !!state.frozen&&state.frozen.sig!==planSig();}
function nextArmDate(){return ymd(addDays(fromYmd(mondayOf(now())),7));}
function frozenPlan(){return planCongelado(state,state.frozen,now());}
// Un bloque marcado como estudiado se guarda con su fecha y hora reales (si empieza después de medianoche, es del día siguiente).
function hechoDeBloque(evalId,date,s,e){return{id:uid(),evalId,date:s>=1440?ymd(addDays(fromYmd(date),1)):date,start:fmt(s),min:e-s};}
// Valida lo guardado: una suscripción o un plan congelado mal formados vuelven a valores seguros en vez de romper la vista.
function ensureState(){const s=state.sub;
  if(!s||typeof s!=='object')state.sub=freeSub();
  else{if(!Array.isArray(s.history))s.history=[];if(s.tier==='pro'&&(!PRICES[s.period]||!s.until))state.sub=freeSub(s.history);}
  if(!state.cuenta||typeof state.cuenta!=='object'||!state.cuenta.id)state.cuenta=null;
  if(!state.cuenta&&state.sub.tier==='pro')state.sub=freeSub(state.sub.history);
  const f=state.frozen;if(f===undefined||(f&&(!Array.isArray(f.blocks)||!Array.isArray(f.evalIds)||!f.week)))state.frozen=null;
  if(!isPro()&&state.onboarded&&!state.frozen)armWeek(true);}
// Plan desde Supabase: la base de datos decide (vencimientos y renovaciones incluidos); aquí solo se refleja.
const MEDIO_APP={yape:'yape',plin:'plin',tarjeta:'card',cortesia:'cortesia'},MEDIO_DB={yape:'yape',plin:'plin',card:'tarjeta'};
const medioNombre=k=>METHODS[k]?METHODS[k].name:k==='cortesia'?'Cortesía del equipo':'';
function subDesdeFila(f){const h=(state.sub&&state.sub.history)||[];
  if(!f||f.plan!=='pro'||!PRICES[f.periodo]||!f.hasta)return freeSub(h);
  return{tier:'pro',period:f.periodo,method:MEDIO_APP[f.medio]||f.medio,since:f.desde,until:f.hasta,autoRenew:!!f.renovacion_automatica,demo:f.demo!==false,history:h};}
function aplicarFila(f,avisar){const antes=state.sub||freeSub(),era=isPro();state.sub=subDesdeFila(f);const es=isPro();
  if(era&&!es)armWeek(true);else if(!es&&state.onboarded&&!state.frozen)armWeek(true);
  save();
  if(avisar){if(era&&!es)toast('Tu LIA Pro terminó. Volviste a Gratis y tus datos siguen aquí.');
    else if(es&&antes.autoRenew&&antes.until&&state.sub.until>antes.until)toast('LIA Pro se renovó por un mes más (demo: sin cobro real).');}
  return es;}

// ---------- Utilidades de vista ----------
function now(){return new Date();}
// Durante un dibujo el plan se calcula una sola vez: las vistas lo piden muchas veces (una por evaluación).
let dibujando=false,planDibujo=null;
function P(){if(dibujando&&planDibujo)return planDibujo;const p=isPro()||!state.onboarded||!state.frozen?plan(state,now()):frozenPlan();if(dibujando)planDibujo=p;return p;}
function evById(id){return state.evals.find(e=>e.id===id);}
function enDias(date){const n=dayDiff(ymd(now()),date);return n<0?'Pasó':n===0?'Hoy':n===1?'Mañana':`En ${n} días`;}
function tagColor(date){const n=dayDiff(ymd(now()),date);return n<=1?'var(--exam-ink)':n<=3?'var(--trabajo-ink)':'var(--pri)';}
function swColor(type){return type==='entrega'||type==='exposicion'?'k-trabajo':type==='parcial'||type==='final'||type==='examen'?'k-examen':'k-estudio';}
function rowHTML(x,date){const isToday=date===ymd(now());const nm=now().getHours()*60+now().getMinutes();const past=isToday&&x.e<=nm;
  const act=x.kind==='estudio'?`data-a="block" data-ev="${x.block.evalId}" data-d="${x.block.date}" data-s="${x.block.s}" data-e="${x.block.e}"`:x.kind==='examen'?`data-a="edit-eval" data-id="${x.ref}"`:x.kind==='excepcion'||x.kind==='libre'?`data-a="del-ex" data-id="${x.ref}"`:(['clase','trabajo','traslado','otro'].includes(x.kind)?`data-a="commit-dia" data-id="${x.ref}" data-d="${x.cola?ymd(addDays(fromYmd(date),-1)):date}"`:'');
  const sub=x.kind==='excepcion'?'Toca para quitar':x.kind==='libre'?'Toca para deshacer':x.sub||'';
  return `<button class="ag ${past?'past':''}" ${act}><span class="t tnum">${fmt(x.s)}</span><span class="blk k-${x.kind}"><b>${esc(x.label)}</b><small class="tnum">${fmt(x.s)} – ${fmt(x.e)}${sub?' · '+esc(sub):''}</small></span></button>`;}
function agendaHTML(date,P0){const it=agendaFor(state,P0,date);
  const sleep=`<div class="ag"><span class="t tnum">${state.settings.sleep}</span><span class="blk k-dormir"><b>A dormir</b><small>${state.evals.some(e=>e.date===ymd(addDays(fromYmd(date),1)))?'Mañana tienes evaluación: descansa':'Sin amanecidas'}</small></span></div>`;
  if(!it.length)return `<div class="agenda"><div class="card muted small">Día libre: no hay compromisos ni estudio programado.</div>${sleep}</div>`;
  return `<div class="agenda">${it.map(x=>rowHTML(x,date)).join('')}${sleep}</div>`;}
function demoBanner(){if(state.mode!=='example')return '';const mios=tieneMios();
  return `<div class="demo"><span>Estás viendo <b>datos de ejemplo</b>.</span><button class="pill solid" data-a="${mios?'own-restore':'start-own'}">${mios?'Volver a mis datos':'Usar mis horarios'}</button></div>`;}
// Evaluaciones que van seguidas o el mismo día, contando solo las que todavía se pueden estudiar.
function conflicts(){const n=now(),t=ymd(n),nm=n.getHours()*60+n.getMinutes(),S=state.settings;
  const ev=state.evals.filter(e=>{const dl=evalDeadline(e,S);return dl.date>t||(dl.date===t&&dl.end>nm);}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const out=[];
  for(let i=0;i<ev.length-1;i++){if(dayDiff(ev[i].date,ev[i+1].date)<=1)out.push([ev[i],ev[i+1]]);}return out;}

   <input id="dict-${kind}" name="q" placeholder="${ev?'Escribe una evaluación':'Escribe un horario'}" aria-label="${ev?'Escríbele a Lía una evaluación':'Escríbele a Lía un horario'}" aria-describedby="dict-${kind}-ej" autocomplete="off" style="flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:8px 0;font-weight:500">

// "22:00 – 06:00 del día siguiente" cuando el horario cruza la medianoche.
function horario(c){return `${c.start} – ${c.end}${toMin(c.end)<toMin(c.start)?' del día siguiente':''}`;}
function duracion(c){const r=intervalo(c.start,c.end);return r.e-r.s;}
function commitItem(c){return `<button class="item" data-a="edit-commit" data-id="${c.id}"><span class="sw k-${c.type}">${COMMIT_TYPES[c.type][0]}</span><span class="grow"><b>${esc(c.name)}</b><br><span class="small muted">${diasTxt(c.days)} · ${horario(c)}</span></span><span class="tag muted">${hrs(c.days.length*duracion(c))}</span></button>`;}
function diasTxt(ds){const s=[...ds].sort((a,b)=>((a+6)%7)-((b+6)%7));const k=s.join();
  if(k==='1,2,3,4,5')return'Lun a Vie';if(k==='1,2,3,4,5,6')return'Lun a Sáb';if(s.length===7)return'Todos los días';if(k==='6,0')return'Fines de semana';
  return s.map(d=>cap(DIAS[d].slice(0,3))).join(', ');}
function evalItem(e){const p=P();const need=e.hours*60,done=doneFor(state,e.id),pl=p.blocks.filter(b=>b.evalId===e.id).reduce((a,b)=>a+b.e-b.s,0);
  return `<button class="item" data-a="edit-eval" data-id="${e.id}" style="align-items:flex-start"><span class="sw ${swColor(e.type)}">${EVAL_TYPES[e.type].label[0]}</span><span class="grow stack" style="gap:6px"><span><b>${EVAL_TYPES[e.type].label} · ${esc(e.course)}</b><br><span class="small muted">${cap(fechaCorta(e.date))} · ${e.time} · ${done?`${hrs(done)} de ${hrs(need)} estudiadas`:`${hrs(need)} de estudio`}</span></span>
   <span class="bar"><i style="width:${Math.min(100,Math.round(done/need*100))}%"></i></span>
   ${p.unmet[e.id]>0?`<span class="small" style="color:var(--exam-ink);font-weight:600">${cap(faltaTxt(p.unmet[e.id]))} sin hueco</span>`:p.unplanned&&p.unplanned[e.id]?`<span class="small" style="color:var(--trabajo-ink);font-weight:600">Sin agendar · entra cuando rearmes tu semana</span>`:pl?`<span class="small muted">${hrs(pl)} ya agendadas</span>`:''}</span><span class="tag" style="color:${tagColor(e.date)}">${enDias(e.date)}</span></button>`;}

// Lo que falta estudiar y no está en el horario: sin hueco (no entró) o, en Gratis, sin agendar (se agregó a mitad de semana).
// Solo cuenta lo que todavía se puede estudiar: el día de un examen ya no se estudia para él.
function sinHorario(p){const n=now(),t=ymd(n),nm=n.getHours()*60+n.getMinutes(),S=state.settings;
  return state.evals.filter(e=>{const dl=evalDeadline(e,S);return dl.date>t||(dl.date===t&&dl.end>nm);})
    .map(e=>{const sh=p.unmet[e.id]||0,sa=(p.unplanned&&p.unplanned[e.id])||0;return{e,min:sh+sa,agendar:sa>0};}).filter(x=>x.min>=10)
    .sort((a,b)=>(a.e.date+a.e.time).localeCompare(b.e.date+b.e.time));}
function faltaTxt(m){return `${m>=60&&m<120?'falta':'faltan'} ${hrs(m)}`;}
// «sin hueco»: Lía no encontró horas libres; «sin agendar»: en Gratis, se agregó después de armar la semana.
function motivo(pend){const a=pend.filter(x=>x.agendar).length;return !a?'sin hueco':a===pend.length?'sin agendar':'sin horario';}
// Por qué falta tiempo y qué se puede hacer. En Gratis, rearmar solo se sugiere si de verdad ubicaría más horas.
function consejoFalta(pend){const ante=`antes de ${pend.length>1?'tus evaluaciones':'tu evaluación'}`;
  if(isPro())return{txt:`No encontré horas libres ${ante}. Sube tu máximo de estudio por día en Perfil o libera un compromiso con Lía.`,a:'tab',t:'perfil',btn:'Ir a mis ajustes'};
  const falta=pend.reduce((s,x)=>s+x.min,0),nuevo=plan(state,now()),gana=falta-pend.reduce((s,x)=>s+(nuevo.unmet[x.e.id]||0),0);
  if(gana>=10){if(canArm())return{txt:`Si rearmas tu semana, Lía puede ubicar ${hrs(gana)} más.`,a:'arm',btn:'Rearmar mi semana'};
    const por=pend.some(x=>x.agendar)?'En Gratis, lo que agregas a mitad de semana entra cuando rearmas tu horario':'En Gratis tu horario no se reacomoda solo';
    return{txt:`${por}: podrás rearmarlo desde el ${fechaLarga(nextArmDate())}. Si estudias por tu cuenta, anótalo para que cuente.`,a:'anotar',btn:'Anotar lo que estudié'};}
  if(canArm())return{txt:`No encontré horas libres ${ante}. Sube tu máximo de estudio por día o libera un compromiso, y luego rearma tu semana.`,a:'tab',t:'perfil',btn:'Ir a mis ajustes'};
  return{txt:`No encontré horas libres ${ante}. Si estudias por tu cuenta, anótalo para que cuente.`,a:'anotar',btn:'Anotar lo que estudié'};}
const accionHTML=(c,cls)=>`<button class="${cls}" data-a="${c.a}"${c.t?` data-t="${c.t}"`:''}>${c.btn}</button>`;
function heroFalta(pend){const tot=pend.reduce((a,x)=>a+x.min,0),c=consejoFalta(pend);
  const titulo=pend.length===1?`${cap(faltaTxt(tot))} de estudio para ${esc(pend[0].e.course)}.`:`${cap(faltaTxt(tot))} de estudio para ${pend.length} evaluaciones.`;
  const lista=pend.length>1?`<span style="opacity:.9">${pend.map(x=>`${esc(x.e.course)}: ${hrs(x.min)}`).join(' · ')}</span>`:'';
  return `<section class="hero"><span class="eyebrow">${motivo(pend)==='sin agendar'?'Sin agendar':'Falta tiempo'}</span><span class="hero-t">${titulo}</span>${lista}<span style="opacity:.9">${esc(c.txt)}</span><div style="height:6px"></div>${accionHTML(c,'btn light')}</section>`;}
// El día de una evaluación, eso va primero en Hoy.
function evalHoyHTML(e,nm){const ini=toMin(e.time),need=e.hours*60,done=doneFor(state,e.id),tipo=EVAL_TYPES[e.type]||EVAL_TYPES.parcial,ent=e.type==='entrega',exp=e.type==='exposicion';
  const cuando=ent?`Hasta las ${e.time}${ini>nm?` · quedan ${hrs(ini-nm)}`:''}`:ini>nm?`A las ${e.time} · en ${hrs(ini-nm)}`:`Empezó a las ${e.time}`;
  const avance=done?`<span class="small muted">Estudiaste ${hrs(Math.min(done,need))} de ${hrs(need)}.</span>`:'';
  return `<button class="card stack evhoy" data-a="tab" data-t="evals" style="text-align:left;gap:6px"><span class="eyebrow">${ent?'Hoy entregas':exp?'Hoy expones':'Hoy tienes evaluación'}</span><b class="evhoy-t">${tipo.label} · ${esc(e.course)}</b><span class="small muted tnum">${cuando}</span>${avance}<span class="small evhoy-a">${ent?'¡Éxitos con tu entrega!':exp?'¡Éxitos en tu exposición!':`¡Éxitos en tu ${tipo.label.toLowerCase()}!`}</span></button>`;}
function vHoy(){const n=now(),t=ymd(n),p=P(),nm=n.getHours()*60+n.getMinutes();
  const next=p.blocks.find(b=>b.date>t||b.e>nm),pend=sinHorario(p);
  const vigente=e=>e.date>t||(e.date===t&&toMin(e.time)+120>nm);  // la evaluación aún no termina
  const evHoy=state.evals.filter(e=>e.date===t&&vigente(e)).sort((a,b)=>a.time.localeCompare(b.time))[0];
  let hero;
  if(next){const e=evById(next.evalId);const when=next.date===t?(next.s>nm?`En ${hrs(next.s-nm)}`:'Ahora'):cap(fechaLarga(next.date));
    hero=`<section class="hero"><span class="eyebrow">Tu próximo bloque · ${esc(when)}</span><span class="big tnum">${fmt(next.s)} – ${fmt(next.e)}</span><span style="opacity:.9;font-weight:500">${esc(e.course)} · para tu ${EVAL_TYPES[e.type].label.toLowerCase()} del ${fechaCorta(e.date)}</span>
     <div style="height:6px"></div>${isPro()?`<button class="btn light" data-a="start" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">Empezar a estudiar</button>`
       :`<button class="btn light" data-a="done-block" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">Ya lo estudié</button>`}
     <button class="small" style="color:var(--pri-ink);opacity:.9;text-align:center;padding:6px" data-a="move" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">¿No puedes a esa hora? Lía lo mueve${isPro()?'':PRO_TAG}</button></section>`;}
  else if(pend.length)hero=heroFalta(pend);
  else if(state.evals.some(vigente)&&state.evals.filter(vigente).every(e=>e.hours*60-doneFor(state,e.id)<10))hero=`<section class="hero"><span class="eyebrow">Todo al día</span><span class="hero-t">Ya estudiaste lo que pedían tus evaluaciones.</span><span style="opacity:.9">Si se viene otra, agrégala y Lía reparte tus horas.</span><div style="height:6px"></div><button class="btn light" data-a="add-eval">Agregar evaluación</button></section>`;
  else if(state.evals.some(vigente))hero='';  // queda estudio, pero ya no hay tiempo antes de la evaluación (p. ej., el día del examen)
  else hero=`<section class="hero"><span class="eyebrow">Sin evaluaciones próximas</span><span class="hero-t">No tienes exámenes ni entregas por ahora.</span><span style="opacity:.9">Agrega la próxima y Lía reparte tus horas de estudio.</span><div style="height:6px"></div><button class="btn light" data-a="add-eval">Agregar evaluación</button></section>`;
  // Si hay un bloque próximo pero algo no entró, se avisa aparte (después de preguntar por los bloques sin marcar).
  let faltaH='';if(next&&pend.length&&!(p.perdidos&&p.perdidos.length)){const tot=pend.reduce((a,x)=>a+x.min,0),c=consejoFalta(pend);
    faltaH=`<div class="warn"><span class="ico" style="color:var(--exam-ink)">${I.alert}</span><div class="small"><b>${pend.length===1?`${cap(faltaTxt(tot))} ${motivo(pend)} para ${esc(pend[0].e.course)}`:`${cap(faltaTxt(tot))} de estudio ${motivo(pend)}`}</b><br>${pend.length>1?esc(pend.map(x=>`${x.e.course}: ${hrs(x.min)}`).join(' · '))+'.<br>':''}${esc(c.txt)}<div style="margin-top:8px">${accionHTML(c,'pill ghost')}</div></div></div>`;}
  const prox=state.evals.filter(e=>vigente(e)&&e!==evHoy).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  let pc='';if(prox){const need=prox.hours*60,done=doneFor(state,prox.id),x=pend.find(y=>y.e.id===prox.id),dl=evalDeadline(prox,state.settings);
    const listo=need-done<10,vencido=dl.date<t||(dl.date===t&&dl.end<=nm);  // vencido: ya no queda tiempo para estudiar antes de la evaluación
    const est=listo?' · completaste tus horas de estudio':vencido?'':x?(x.agendar?' · aún no está en tu horario: entra cuando rearmes tu semana':` · <b style="color:var(--exam-ink)">${faltaTxt(x.min)} sin hueco</b>`):' · lo que falta ya está en tu horario';
    pc=`<button class="card stack" data-a="tab" data-t="evals" style="text-align:left"><span class="between"><b>${EVAL_TYPES[prox.type].label} · ${esc(prox.course)}</b><span class="tag" style="color:${tagColor(prox.date)}">${enDias(prox.date)} ${prox.time}</span></span><span class="bar"><i style="width:${Math.min(100,Math.round(done/need*100))}%"></i></span><span class="small muted">${hrs(done)} de ${hrs(need)} estudiadas${est}</span></button>`;}
  const tom=state.evals.find(e=>e.date===ymd(addDays(n,1)));
  const tomTxt=tom?`Mañana tienes ${EVAL_TYPES[tom.type].label.toLowerCase()} de ${esc(tom.course)}. ${pend.some(x=>x.e.id===tom.id)?'Aunque falte tiempo, dormir bien te ayuda más que amanecerte.':'Con este plan llegas sin amanecerte.'}`:'Tu horario no te pide amanecerte.';
  const night=`<div class="night"><span class="ico" style="color:var(--pri-sub)">${I.moon}</span><div><b>Hoy duermes a las ${state.settings.sleep}</b><div class="sub">${tomTxt}</div></div></div>`;
  const cf=conflicts()[0];let cfH='';
  if(cf){const mismo=cf[0].date===cf[1].date,cfPend=cf.some(e=>pend.some(x=>x.e.id===e.id));
    cfH=`<div class="${cfPend?'warn':'note'}"><span class="ico" style="color:var(${cfPend?'--exam-ink':'--pri'})">${cfPend?I.alert:I.cal}</span><div class="small"><b>${mismo?`Tienes dos evaluaciones el ${fechaCorta(cf[0].date)}`:`Se te juntan ${fechaCorta(cf[0].date)} y ${fechaCorta(cf[1].date)}`}</b><br>${esc(cf[0].course)} y ${esc(cf[1].course)} van ${mismo?'el mismo día':'seguidos'}. ${cfPend?'Aún les falta tiempo de estudio.':'Ya repartí sus horas de estudio en tu horario.'}</div></div>`;}
  return `${demoBanner()}<div><div class="kicker">${cap(fechaLarga(t))}</div><h1>${state.settings.name?`Hola, ${esc(state.settings.name)}`:'Hoy'}</h1></div>${evHoy?evalHoyHTML(evHoy,nm):''}${avisoIOS()}${freeBanner()}${perdidosHTML(p)}${hero}${faltaH}${cfH}${pc}<h2>Tu día</h2>${agendaHTML(t,p)}${night}`;}
// Gratis: los bloques que pasaron sin marcarse. Lía pregunta si se estudiaron; lo que no, ya cuenta como pendiente.
function perdidosHTML(p){const l=p.perdidos||[];if(!l.length)return '';
  if(l.length===1){const b=l[0],e=evById(b.evalId),cuando=b.date===ymd(now())?'de hoy':`del ${fechaCorta(b.date)}`;
    return `<div class="note"><span class="ico" style="color:var(--pri)">${I.cal}</span><div class="grow small"><b>¿Estudiaste ${esc(e?e.course:'')}?</b><br>Tu bloque ${cuando} de ${fmt(b.s)} a ${fmt(b.e)} ya pasó y no lo marcaste.<div class="row-h" style="margin-top:8px;flex-wrap:wrap"><button class="pill solid" data-a="done-block" data-ev="${b.evalId}" data-d="${b.date}" data-s="${b.s}" data-e="${b.e}" aria-label="Sí, estudié ${esc(e?e.course:'')}">Sí, lo estudié</button><button class="pill ghost" data-a="perdido-no" data-ev="${b.evalId}" data-k="${esc(claveBloque(b))}" aria-label="No pude estudiar ${esc(e?e.course:'')}">No pude</button></div></div></div>`;}
  return `<div class="note"><span class="ico" style="color:var(--pri)">${I.cal}</span><div class="grow small"><b>Tienes ${l.length} bloques sin marcar</b><br>Suman ${hrs(l.reduce((a,b)=>a+b.e-b.s,0))}. ¿Los estudiaste? Márcalos para que Lía cuente tu avance; lo que no estudiaste queda pendiente.<div style="margin-top:8px"><button class="pill solid" data-a="perdidos">Revisar mis bloques</button></div></div></div>`;}
// En iPhone sin instalar, Safari puede borrar los datos de LIA tras 7 días sin abrirla: se avisa una vez, en Hoy.
function avisoIOS(){if(state.mode==='example'||!isIOS()||isStandalone())return '';try{if(localStorage.getItem('lia.avisoIOS'))return '';}catch(e){return '';}

function vSemana(){const n=now(),t=ymd(n),p=P();
  const mon=addDays(n,-((n.getDay()+6)%7)+7*ui.weekOffset);const days=[...Array(7)].map((_,i)=>ymd(addDays(mon,i)));
  if(!ui.sel||!days.includes(ui.sel))ui.sel=days.includes(t)?t:days[0];
  const study=days.reduce((a,d)=>a+p.blocks.filter(b=>b.date===d).reduce((x,b)=>x+b.e-b.s,0)+state.done.filter(x=>x.date===d).reduce((x,y)=>x+y.min,0),0);
  const exams=state.evals.filter(e=>days.includes(e.date)).length;

  const d0=fromYmd(days[0]),d6=fromYmd(days[6]);  // «26 de octubre – 1 de noviembre» si la semana cruza de mes

  ${freeWeekLine()}<div class="days">${days.map(d=>{const dt=fromYmd(d);const hasS=p.blocks.some(b=>b.date===d);const hasE=state.evals.some(e=>e.date===d);
    const que=hasE&&hasS?', con evaluación y estudio':hasE?', con evaluación':hasS?', con estudio':'';
    return `<button class="day ${d<t?'past':''}" data-a="sel" data-d="${d}" aria-pressed="${d===ui.sel}" aria-label="${cap(DIAS[dt.getDay()])} ${dt.getDate()}${d===t?', hoy':''}${que}"><span>${DIAS_C[dt.getDay()]}</span><b class="tnum">${dt.getDate()}</b><i class="dot ${hasE?'x':''}" style="${hasS||hasE?'':'visibility:hidden'}"></i></button>`;}).join('')}</div>
  <div class="stats"><div class="card stat"><b class="tnum">${hrs(study)}</b><span>de estudio en esta semana</span></div><div class="card stat"><b class="tnum">${exams}</b><span>${exams===1?'evaluación':'evaluaciones'} esta semana</span></div></div>
  <div class="between"><h2>${cap(fechaLarga(ui.sel))}</h2><span class="small" style="color:var(--pri);font-weight:600">${selStudy?hrs(selStudy)+' de estudio':''}</span></div>
  ${agendaHTML(ui.sel,p)}`;}

function resumeAfterPay(p){if(!p)return;const c=p.ctx||{};
  if(p.why==='evals'&&c.items){const r=c.replace&&evById(c.replace);
    if(r){snapshot();const it=c.items[0];Object.assign(r,{type:it.type,course:it.course,date:it.date,time:it.time,hours:it.hours});save();rerenderKeepScroll();toast('Guardé el cambio de tu evaluación.',true);}
    else{applyItems(c.items);rerenderKeepScroll();toast(`Lía agregó: ${c.items.map(i=>i.kind==='eval'?i.course:i.name).join(', ')}.`,true);}}

function vSession(){const s=ui.session;const e=evById(s.ev);const left=Math.max(0,s.total-s.elapsed());const pct=1-left/s.total;const C=2*Math.PI*104;
  return `<div class="full"><div class="in"><div class="top"><span>Sesión de estudio</span><button data-a="sess-exit" style="color:inherit;font-weight:600">Salir</button></div>

   <div class="c"><b class="tnum" id="clock">${clk(left)}</b><span class="small" style="opacity:.6">${s.running?'quedan de '+hrs(s.total/60000):'en pausa'}</span></div></div>
  <div class="glass">${AV(32)}<span class="small" style="opacity:.85">Modo concentración: deja el celular boca abajo. Al acabar el tiempo, vibra y suena. Si terminas antes, toca “Terminé”.</span></div>
  <div style="flex:1"></div>
  ${s.preguntar?`<div class="glass" style="flex-direction:column;align-items:stretch;text-align:left;gap:10px" role="group" aria-labelledby="sess-q"><b id="sess-q" data-foco>¿Guardas lo que estudiaste?</b><span class="small" style="opacity:.85">Llevas ${hrs(minutosSesion(s))} de ${esc(e?e.course:'')}.</span>
   <button class="btn pri" data-a="sess-done">Guardar ${hrs(minutosSesion(s))} y salir</button><button class="btn light" data-a="sess-descartar">Salir sin guardar</button><button class="btn" style="color:inherit;min-height:44px" data-a="sess-seguir">Seguir estudiando</button></div>`
   :`<div class="two" style="width:100%"><button class="btn light" data-a="sess-pause">${s.running?'Pausar':'Seguir'}</button><button class="btn pri" data-a="sess-done">Terminé</button></div>`}</div></div>`;}
// La sesión se guarda aparte para sobrevivir a una recarga o a que el teléfono cierre la app.
const KEY_SES='lia.sesion.v1';
function nuevaSesion(o){return{...o,elapsed(){return this.acc+(this.running?Date.now()-this.since:0);}};}
function guardarSesion(){const s=ui.session;try{if(s)localStorage.setItem(KEY_SES,JSON.stringify({ev:s.ev,d:s.d,s:s.s,total:s.total,acc:s.acc,since:s.since,inicio:s.inicio,running:s.running}));else localStorage.removeItem(KEY_SES);}catch(e){}}
function minutosSesion(s){return Math.floor(Math.min(s.elapsed(),s.total)/60000)||0;}
function registrarSesion(s,min){const t=new Date(s.inicio||Date.now()-min*60000);snapshot();
  state.done.push({id:uid(),evalId:s.ev,date:ymd(t),start:fmt(t.getHours()*60+t.getMinutes()),min});save();}
function pedirPantalla(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>ui.wl=l).catch(()=>{});}catch(e){}}
function cerrarSesion(){ui.session=null;guardarSesion();try{ui.wl&&ui.wl.release();}catch(e){}ui.wl=null;}
// Aviso al terminar el tiempo: vibra y suena tres tonos (el sonido se habilita al tocar "Empezar").
function avisarFin(){try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
  try{const c=ui.audio;if(!c)return;const t=c.currentTime;[660,880,990].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),d=t+i*.25;
    o.frequency.value=f;g.gain.setValueAtTime(.0001,d);g.gain.exponentialRampToValueAtTime(.25,d+.02);g.gain.exponentialRampToValueAtTime(.0001,d+.22);o.connect(g);g.connect(c.destination);o.start(d);o.stop(d+.25);});}catch(e){}}
const clk=ms=>{const t=Math.ceil(ms/1000);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`;};
function vListen(){return `<div class="full"><div class="in"><div class="top"><button data-a="listen-cancel" style="color:inherit">Cancelar</button><button data-a="listen-type" style="color:inherit">Prefiero escribir</button></div>
  <div style="flex:1"></div><div class="halo">${AV(80)}</div><span class="eyebrow" style="color:#B9B8FF">Lía te escucha…</span>
  <div class="transcript" id="live">${esc(ui.listen.text||'Habla ahora')}</div><div style="flex:1"></div>
  <button class="stopb" data-a="listen-stop" aria-label="Terminar"><i></i></button><span class="small" style="opacity:.6">Toca para terminar</span></div></div>`;}

const TABS=[['hoy','Hoy','sun'],['semana','Semana','cal'],['lia','Lía',null],['evals','Evaluaciones','list'],['perfil','Perfil','user']];
// Accesibilidad: al volver a dibujar, el foco vuelve al mismo control (o a su equivalente) en vez de perderse,
// y al cerrar una hoja vuelve al botón que la abrió.
function claveFoco(el){if(!el||el===document.body||!el.dataset)return null;
  if(el.id)return '#'+CSS.escape(el.id);
  const d=el.dataset;if(!d.a)return null;
  return `[data-a="${CSS.escape(d.a)}"]`+['t','d','v','id','ev','s','k','why'].filter(k=>d[k]!==undefined).map(k=>`[data-${k}="${CSS.escape(d[k])}"]`).join('');}
let abridor=null;
function render(){ensureState();const L=document.getElementById('layer'),a=document.activeElement,habia=!!L.firstElementChild,enCapa=habia&&L.contains(a),clave=claveFoco(a);
  dibujando=true;planDibujo=null;try{dibujar();}finally{dibujando=false;planDibujo=null;}
  const hay=!!L.firstElementChild,app=document.getElementById('app');if(hay&&!habia)abridor=clave;
  // Una capa que marca adónde va el foco ([data-foco], p. ej. la pregunta al salir de una sesión) manda sobre el foco anterior.
  const destino=hay?(enCapa&&!L.querySelector('[data-foco]')?clave:null):(habia?abridor:clave);if(!hay&&habia)abridor=null;
  let el=destino&&(hay?L:app).querySelector(destino);
  if(el&&habia&&!hay&&el.matches('input,textarea,select'))el=null;  // al cerrar una hoja no se reabre el teclado del celular
  else if(!el&&habia&&!hay){el=app.querySelector('main h1');if(el)el.setAttribute('tabindex','-1');}  // lo que abrió la hoja ya no está
  if(el&&el!==document.activeElement)el.focus({preventScroll:true});}
function dibujar(){const v=document.getElementById('view'),tabs=document.getElementById('tabs');
  const inOb=ui.welcome||!state.onboarded;
  tabs.hidden=inOb;
  if(ui.welcome)v.innerHTML=vWelcome();
  else if(!state.onboarded)v.innerHTML=vOnboarding();
  else v.innerHTML={hoy:vHoy,semana:vSemana,lia:vLia,evals:vEvals,perfil:vPerfil}[ui.tab]();
  document.body.classList.toggle('wm',!!ui.welcome);v.style.paddingTop=ui.welcome?'0':'';v.style.paddingBottom=ui.welcome?'0':'';
  tabs.innerHTML=TABS.map(([k,l,ic])=>`<button class="tab" data-a="tab" data-t="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic?I[ic]:AV(40)}<span>${l}</span></button>`).join('');
  const L=document.getElementById('layer');
  if(ui.session)L.innerHTML=vSession();
  else if(ui.listen)L.innerHTML=vListen();
  else if(ui.sheet)L.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${ui.sheet}</div></div>`;
  else L.innerHTML='';
  focusLayer(L);
  if(ui.tab==='lia'&&!inOb){const c=document.getElementById('view');c.scrollTop=c.scrollHeight;}}
// Accesibilidad: con una hoja o pantalla superpuesta abierta, el fondo queda inerte y el foco pasa a ella.
function focusLayer(L){const open=!!L.firstElementChild;document.getElementById('app').inert=open;
  if(!open)return;const box=L.querySelector('.sheet')||L.querySelector('.full .in');if(!box||box.contains(document.activeElement))return;
  const t=box.querySelector('[data-foco]')||box.querySelector('h1,h2')||box;t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(ui.listen){A['listen-cancel']();return;}
  if(ui.sheet&&!document.querySelector('.sheet .spin')){e.preventDefault();A.close();}});
function rerenderKeepScroll(){const v=document.getElementById('view');const y=v.scrollTop;render();v.scrollTop=y;}
let toastT;
// Avisos: van arriba cuando abajo hay botones que no deben taparse (bienvenida, registro, hojas y sesión),
// duran según lo que dicen y no se cierran mientras tienen el foco (para alcanzar «Deshacer» con el teclado).
function toast(msg,withUndo){const b=document.getElementById('toastbox'),arriba=!!(ui.sheet||ui.welcome||!state.onboarded||ui.session||ui.listen);
  b.innerHTML=`<div class="toast${arriba?' arriba':''}"><span style="flex:1">${esc(msg)}</span>${withUndo?'<button data-a="undo">Deshacer</button>':''}</div>`;
  const ms=Math.min(10000,Math.max(withUndo?7000:4000,String(msg).length*65));clearTimeout(toastT);
  const cerrar=()=>{if(b.contains(document.activeElement)){toastT=setTimeout(cerrar,1500);return;}b.innerHTML='';};toastT=setTimeout(cerrar,ms);}

// ---------- Acciones ----------
function blockOf(ds){return{ev:ds.ev,d:ds.d,s:+ds.s,e:+ds.e};}
function moveBlock(b){const before=P().blocks.filter(x=>x.evalId===b.ev).map(x=>x.date+x.s);snapshot();
  state.exceptions.push({id:uid(),date:b.d,start:fmt(b.s),end:fmt(b.e),label:'No disponible'});save();
  const after=P();const nb=after.blocks.find(x=>x.evalId===b.ev&&!before.includes(x.date+x.s));const e=evById(b.ev);
  const msg=nb?`Moví ${e.course} a ${nb.date===b.d?'las':fechaCorta(nb.date)+','} ${fmt(nb.s)}.`:after.unmet[b.ev]>0?`No encontré otro hueco para ${e.course}: te ${faltaTxt(after.unmet[b.ev])}.`:`Reorganicé ${e.course}: ya está cubierto en otros bloques.`;
  ui.sheet=null;rerenderKeepScroll();toast(msg,true);return msg;}
function applyItems(items){snapshot();for(const it of items){if(it.kind==='eval')state.evals.push({id:uid(),type:it.type,course:it.course,date:it.date,time:it.time,hours:it.hours});
  else state.commitments.push({id:uid(),name:it.name,type:it.type,days:it.days,start:it.start,end:it.end});}save();}
function liaSay(text,opts={}){state.chat.push({from:'lia',text,...opts});save();anunciar(`Lía: ${text}`);}
// Lo que dice Lía se lee en voz alta (lector de pantalla) sin volver a leer toda la pantalla.
function anunciar(t){const a=document.getElementById('anuncio');if(!a)return;a.textContent='';setTimeout(()=>{a.textContent=t;},60);}
function handleText(q,from){q=q.trim();if(!q)return;const n=now();const r=interpret(q,state,n);
  if(from==='chat')state.chat.push({from:'me',text:q});
  const kindOnly=from==='commit'?'commit':from==='eval'?'eval':null;
  if(r.intent==='add'){let items=r.items;const errs=items.filter(i=>i.error);const ok=items.filter(i=>!i.error);
    if(kindOnly&&ok.some(i=>i.kind!==kindOnly)&&!ok.some(i=>i.kind===kindOnly)){}
    if(errs.length&&!ok.length){if(from==='chat'){liaSay(errs[0].error);render();}else toast(errs[0].error);return;}
    if(newEvalCount(ok)>evalRoom()){ui.blockedItems=ok;if(from==='chat'){liaSay(limitMsg(),{cta:'evals'});render();}else openPaywall('evals',{items:ok});return;}
    if(from==='chat'){ui.pending={items:ok,q};save();render();return;}
    applyItems(ok);const p=P();const evs=ok.filter(i=>i.kind==='eval');
    const agendado=p.frozen?0:p.blocks.filter(b=>{const e=evById(b.evalId);return e&&evs.some(i=>i.course===e.course&&i.date===e.date);}).reduce((a,b)=>a+b.e-b.s,0);
    const fin=!evs.length?'':p.frozen?' Entra a tu horario cuando rearmes tu semana.':agendado?` Agendé ${hrs(agendado)} de estudio.`:' Todavía no encontré horas libres para estudiar.';
    toast(`Lía agregó: ${ok.map(resumenItem).join('; ')}.${fin}`,true);rerenderKeepScroll();return;}
  if(from!=='chat'){toast(from==='commit'?'No te entendí. Prueba: “clases de lunes a viernes de 8 a 1”.':'No te entendí. Prueba: “parcial de Química el viernes a las 10”.');return;}
  if(r.intent==='except'){const exs=r.exs;
    if(isPro()&&state.settings.autonomy==='ask'){ui.pending={exs,q};render();return;}
    const m=aplicarCambio(exs);liaSay(m.texto,m.opts);ui.pending=null;render();return;}
  if(r.intent==='aviso'){liaSay(r.texto);render();return;}
  if(r.intent==='log'){if(r.error){liaSay(r.error);render();return;}
    const e=evById(r.evalId),hoy=r.date===ymd(n);snapshot();
    state.done.push({id:uid(),evalId:e.id,date:r.date,start:hoy?fmt(Math.max(0,n.getHours()*60+n.getMinutes()-r.min)):'20:00',min:r.min});save();
    const falta=Math.max(0,Math.round(e.hours*60)-doneFor(state,e.id));
    liaSay(`Anoté ${hrs(r.min)} de ${e.course} (${hoy?'hoy':fechaCorta(r.date)}). ${falta?`Te ${faltaTxt(falta)}.`:'Ya completaste las horas que pedía.'}`,{undo:true});render();return;}
  if(r.intent==='agenda'){const p=P();const it=agendaFor(state,p,r.date);
    liaSay(it.length?`${cap(fechaLarga(r.date))}:\n${it.map(x=>`${fmt(x.s)}–${fmt(x.e)}  ${x.label}`).join('\n')}\nDuermes a las ${state.settings.sleep}.`:`${cap(fechaLarga(r.date))} lo tienes libre.`);render();return;}
  if(r.intent==='progress'){const p=P();const up=state.evals.filter(e=>e.date>=ymd(n));
    liaSay(up.length?up.map(e=>{const d=doneFor(state,e.id),need=e.hours*60;return `${e.course}: ${hrs(d)} de ${hrs(need)}${p.unmet[e.id]>0?` (${faltaTxt(p.unmet[e.id])} sin hueco)`:''}`;}).join('\n'):'No tienes evaluaciones próximas. ¿Me dices cuándo es la siguiente?');render();return;}
  if(r.intent==='next'){const e=state.evals.filter(e=>e.date>=ymd(n)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
    liaSay(e?`Tu próxima evaluación es ${EVAL_TYPES[e.type].label.toLowerCase()} de ${e.course}, el ${fechaLarga(e.date)} a las ${e.time}.`:'No tienes evaluaciones registradas.');render();return;}
  if(r.intent==='replan'&&!isPro()){
    if(canArm()){const p0=armWeek(false);liaSay(`Listo, armé tu semana: tienes ${hrs(p0.blocks.reduce((a,b)=>a+b.e-b.s,0))} de estudio agendadas.`);}
    else liaSay(`Ya armaste tu semana. En Gratis puedes volver a armarla desde el ${fechaLarga(nextArmDate())}. Con LIA Pro la reorganizo cuando quieras.`,{cta:'rearm'});
    render();return;}
  if(r.intent==='replan'){liaSay(`Listo, reorganicé todo: tienes ${hrs(P().blocks.reduce((a,b)=>a+b.e-b.s,0))} de estudio agendadas.`);render();return;}
  liaSay('Todavía entiendo frases simples. Prueba con:\n• “Parcial de Cálculo el jueves a las 9”\n• “Trabajo de lunes a viernes de 3 a 7”\n• “Hoy salgo del trabajo a las 9”\n• “Mañana no tengo clases”\n• “Ayer estudié 2 horas de Cálculo”\n• “¿Qué tengo mañana?”\nPara mover un bloque, tócalo en Hoy o en Semana.');render();}
// Aplica cambios de un día (algo que ocupa o algo que se libera) y devuelve qué decirle a la persona.
function aplicarCambio(exs){const p0=P();snapshot();for(const ex of exs)state.exceptions.push({id:uid(),...ex});save();
  const p1=P(),ex=exs[0],r=intervalo(ex.start,ex.end),dia=fechaCorta(ex.date);
  const nuevos=()=>p1.blocks.filter(b=>b.date===ex.date&&!p0.blocks.some(x=>x.date===b.date&&x.s===b.s&&x.evalId===b.evalId));
  if(ex.libre){const que=ex.label==='Salida temprano'?`el ${dia} sales a las ${ex.start}`:`el ${dia} no tienes ${exs.map(x=>x.label.replace(/^Sin /,'')).join(' ni ')}`;
    if(!isPro())return{texto:`Listo: ${que}. En Gratis no reorganizo sola: ${canArm()?'rearma tu semana para usar ese tiempo':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}.`,opts:{undo:true,cta:canArm()?null:'reorg'}};
    const cursos=[...new Set(nuevos().map(b=>evById(b.evalId).course))];
    return{texto:`Listo: ${que}.${cursos.length?` Usé ese tiempo para estudiar ${cursos.join(' y ')}.`:''}`,opts:{undo:true}};}
  const msg=`Anotado: ${ex.label.toLowerCase()} el ${dia} de ${ex.start} a ${ex.end}.`,choca=b=>b.date===ex.date&&b.s<r.e&&b.e>r.s;
  if(!isPro()){const hit=p1.blocks.filter(choca);
    if(!hit.length)return{texto:msg+' No choca con tu estudio.',opts:{undo:true}};
    const e=evById(hit[0].evalId);
    return{texto:msg+` Choca con tu bloque de ${e?e.course:'estudio'} a las ${fmt(hit[0].s)}. En Gratis no reorganizo sola: ${canArm()?'puedes rearmar tu semana ahora':`podrás rearmar tu semana desde el ${fechaCorta(nextArmDate())}`}. Con LIA Pro lo muevo al instante.`,opts:{undo:true,cta:'reorg'}};}
  let extra=' No chocaba con tu estudio.';
  if(p0.blocks.some(choca)){const g={};for(const b of nuevos()){const c=evById(b.evalId).course;(g[c]=g[c]||[]).push(fmt(b.s));}
    extra=Object.keys(g).length?` Moví ${Object.entries(g).map(([c,ts])=>`${c} a las ${ts.join(' y ')}`).join('; ')}.`:' Reacomodé tus bloques en otros días.';}
  return{texto:msg+extra+` Igual duermes a las ${state.settings.sleep}.`,opts:{undo:true}};}

    for(const b of l){const k=claveBloque(b);if(sel.has(k)){state.done.push(hechoDeBloque(b.evalId,b.date,b.s,b.e));min+=b.e-b.s;}else fz.vistos.push(k);}
    save();rerenderKeepScroll();toast(min?`Sumé ${hrs(min)} a tu avance.${sel.size<l.length?' Lo demás queda pendiente.':''}`:'Listo. Ese tiempo queda pendiente en tus evaluaciones.',true);return;}
  if(f.dataset.form==='commit'){const days=fd.getAll('d').map(Number);if(!days.length){toast('Elige al menos un día.');return;}
    if(toMin(fd.get('end'))===toMin(fd.get('start'))){toast('El inicio y el fin no pueden ser a la misma hora.');return;}
    snapshot();const o={name:String(fd.get('name')).trim(),type:fd.get('type'),days,start:fd.get('start'),end:fd.get('end')};
    const cur=f.dataset.id&&state.commitments.find(c=>c.id===f.dataset.id);if(cur)Object.assign(cur,o);else state.commitments.push({id:uid(),...o});
    save();ui.sheet=null;rerenderKeepScroll();toast(P().frozen?'Guardado. Tu horario Gratis se actualiza cuando rearmes tu semana.':'Guardado. Lía reorganizó tu semana.',true);return;}
  if(f.dataset.form==='eval'){const o={type:fd.get('type'),course:String(fd.get('course')).trim(),date:fd.get('date'),time:fd.get('time'),hours:Math.max(.5,+fd.get('hours')||1)};
    // Para el límite de Gratis cuenta toda evaluación que pasa a ser próxima: una nueva o una pasada a la que se le cambia la fecha.
    const cur=f.dataset.id&&state.evals.find(e=>e.id===f.dataset.id),hoy=ymd(now());
    if(o.date>=hoy&&(!cur||cur.date<hoy)&&evalRoom()<1){ui.sheet=null;openPaywall('evals',{items:[{kind:'eval',...o}],replace:cur?cur.id:null});return;}
    snapshot();
    if(cur)Object.assign(cur,o);else state.evals.push({id:uid(),...o});
    save();ui.sheet=null;const p=P();const e=state.evals.find(x=>x.course===o.course&&x.date===o.date);rerenderKeepScroll();
    toast(p.frozen?'Guardado. Entra a tu horario cuando rearmes tu semana.':e&&p.unmet[e.id]>0?`Guardado, pero ${faltaTxt(p.unmet[e.id])} sin hueco libre.`:'Guardado. Lía repartió tus horas de estudio.',true);}});

function tick(){if(!ui.session)return;const s=ui.session;const left=Math.max(0,s.total-s.elapsed());const c=document.getElementById('clock');const r=document.getElementById('ringp');
  if(c)c.textContent=clk(left);if(r){const C=2*Math.PI*104;r.setAttribute('stroke-dashoffset',C*(left/s.total));}
  if(left<=0&&s.running){avisarFin();A['sess-done']();return;}setTimeout(tick,500);}
