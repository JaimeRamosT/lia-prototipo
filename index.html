let rec=null;
function startMic(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback=()=>{ui.listen=null;render();const el=document.getElementById(target);if(el)el.focus();toast('Para dictar, toca el micrófono de tu teclado y habla.');};
  if(!SR){fallback();return;}
  try{rec=new SR();rec.lang='es-PE';rec.interimResults=true;rec.continuous=false;ui.listen={target,text:''};render();
    rec.onresult=e=>{ui.listen&&(ui.listen.text=Array.from(e.results).map(r=>r[0].transcript).join(''));const l=document.getElementById('live');if(l&&ui.listen)l.textContent=ui.listen.text;};
    rec.onerror=e=>{rec=null;if(e.error==='no-speech'){ui.listen=null;render();toast('No te escuché. Inténtalo de nuevo.');}else fallback();};
    rec.onend=()=>{if(ui.listen){const t=ui.listen.text,tg=ui.listen.target;ui.listen=null;render();if(t)submitVoice(tg,t);}};
    rec.start();}catch(e){fallback();}}
function stopMic(useIt){if(!ui.listen)return;const t=ui.listen.text,tg=ui.listen.target;ui.listen=null;try{rec&&(rec.onend=null,rec.stop());}catch(e){}rec=null;render();if(useIt&&t)submitVoice(tg,t);}
function submitVoice(target,text){const from=target==='chat-in'?'chat':target==='dict-commit'?'commit':'eval';handleText(text,from);}

// El cliente de Supabase se carga solo cuando hace falta: quien usa Gratis sin cuenta nunca lo descarga.
let sbCliente=null;
function sb(){if(!cuentasActivas())return Promise.reject(new Error('sin-config'));
  if(!sbCliente)sbCliente=new Promise((res,rej)=>{if(window.supabase){res();return;}
      const el=document.createElement('script');el.src='vendor/supabase.js';el.onload=()=>res();el.onerror=()=>rej(new Error('sin-cliente'));document.head.appendChild(el);})
    .then(()=>{const c=window.supabase.createClient(SB_CFG.url,SB_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit',storageKey:'lia.auth'}});
      c.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>alCambiarSesion(ev,session),0);});return c;})
    .catch(e=>{sbCliente=null;throw e;});
  return sbCliente;}
function sbRpc(fn,args){return sb().then(c=>c.rpc(fn,args||{})).then(({data,error})=>{if(error)throw error;return data;});}
function mensajeError(e){const m=String((e&&(e.message||e.error_description||e.msg))||''),code=String((e&&(e.code||e.error_code))||'');
  if(m==='sin-config')return 'Las cuentas todavía no están activadas en esta versión de LIA.';
  if(m==='sin-cliente'||/Failed to fetch|NetworkError|Load failed|network/i.test(m)||navigator.onLine===false)return 'Sin conexión. Revisa tu internet e inténtalo otra vez.';
  if(code==='invalid_credentials'||/Invalid login credentials/i.test(m))return 'El correo o la contraseña no coinciden.';
  if(code==='user_already_exists'||/already registered/i.test(m))return 'Ya hay una cuenta con ese correo. Inicia sesión.';
  if(code==='email_not_confirmed'||/Email not confirmed/i.test(m))return 'Primero confirma tu correo con el enlace que te enviamos.';
  if(code==='same_password'||/different from the old password/i.test(m))return 'Esa ya es tu contraseña. Elige una distinta.';
  if(code==='weak_password'||/password should/i.test(m))return 'Esa contraseña es muy débil. Usa al menos 8 caracteres.';
  const espera=m.match(/after (\d+) seconds?/i);if(espera)return `Espera ${espera[1]} segundos antes de pedir otro correo.`;
  if(code==='over_email_send_rate_limit'||/rate limit/i.test(m))return 'Se enviaron demasiados correos. Espera unos minutos e inténtalo otra vez.';
  if(code==='email_address_invalid'||/Email address .*invalid|invalid format/i.test(m))return 'Ese correo no es válido. Revísalo o usa otro.';
  if(code==='email_address_not_authorized'||/not authorized/i.test(m))return 'No pudimos enviarte el correo. Por ahora, solo el equipo de LIA puede crear cuentas.';
  if(/Error sending .*email/i.test(m))return 'No pudimos enviarte el correo. Inténtalo otra vez en unos minutos.';
  if(code==='signup_disabled'||/Signups not allowed/i.test(m))return 'Por ahora no se pueden crear cuentas nuevas.';
  if(code==='session_not_found'||code==='bad_jwt'||code==='42501'||/iniciar sesión|JWT|session/i.test(m))return 'Tu sesión venció. Vuelve a iniciar sesión.';
  if(code==='otp_expired'||/link is invalid or has expired/i.test(m))return 'El enlace ya venció. Pide uno nuevo.';
  return 'No pudimos completar la acción. Inténtalo otra vez.';}
function setCuenta(user){const nueva={id:user.id,email:user.email||''},cambio=!state.cuenta||state.cuenta.id!==nueva.id;

function tomarPagoPendiente(){let p=null;try{p=JSON.parse(localStorage.getItem(KEY_PAGO));localStorage.removeItem(KEY_PAGO);}catch(e){p=null;}
  if(!p||!PRICES[p.period]||!(Date.now()-p.t<3*864e5))return null;
  return{why:p.why||'plans',ctx:p.ctx||null,period:p.period,method:METHODS[p.method]?p.method:'yape'};}

// Cambios de sesión que no inició un formulario: al abrir la app, al volver de un enlace del correo o al vencer la sesión.
function alCambiarSesion(ev,session){if(ui.authBusy)return;const u=session&&session.user;
  if(u&&(ui.desdeRecuperar||ev==='PASSWORD_RECOVERY')){ui.desdeRecuperar=false;setCuenta(u);refrescarPlan(false).catch(()=>{});  // enlace para crear una contraseña nueva

    return;}

    if(nueva||ev==='INITIAL_SESSION')refrescarPlan(true).catch(()=>{}).then(()=>{if(correo)alConfirmarCorreo();});

function sheetCuenta(){const f=ui.cuentaForm,reg=f.modo==='registro',pro=f.paraPro?'1':'0',espera=f.esperaHasta>Date.now();

  if(f.modo==='confirmar')return `<div class="grab"></div><span class="big-check">${I.check}</span><h2 style="text-align:center">Revisa tu correo</h2><p class="muted" style="margin:0;text-align:center">Te enviamos un enlace a <b>${esc(f.email)}</b>. Ábrelo en este dispositivo para activar tu cuenta${f.paraPro?'; luego seguimos con tu pago':''}.</p>${spam}${avisosCuenta({...f,noConfirmado:false})}

  if(f.modo==='enlace-enviado')return `<div class="grab"></div><span class="big-check">${I.check}</span><h2 style="text-align:center">Revisa tu correo</h2><p class="muted" style="margin:0;text-align:center">Si hay una cuenta con <b>${esc(f.email)}</b>, te llegará un enlace para crear una contraseña nueva. Ábrelo en este dispositivo.</p>${spam}
   <button class="btn sec" data-a="cuenta-ingresar" data-pro="${pro}">Volver a iniciar sesión</button><button class="btn sec" data-a="close">Cerrar</button>`;
  if(f.modo==='recuperar')return `<form class="stack" data-form="cuenta" style="gap:14px" novalidate><div class="grab"></div><h2>Recupera tu contraseña</h2>
   <p class="muted small" style="margin:0">Te enviaremos un enlace para crear una contraseña nueva. Ábrelo en este dispositivo.</p>${correo}${avisosCuenta(f)}${enviar('Enviar enlace')}
   <button class="btn sec" type="button" data-a="cuenta-ingresar" data-pro="${pro}">Volver a iniciar sesión</button></form>`;
  if(f.modo==='nueva-clave')return `<form class="stack" data-form="cuenta" style="gap:14px" novalidate><div class="grab"></div><h2>Crea tu nueva contraseña</h2>
   <p class="muted small" style="margin:0">Para tu cuenta <b>${esc(f.email)}</b>.</p>${campoClave(f,true)}${avisosCuenta(f)}${enviar('Guardar contraseña')}
   <button class="btn sec" type="button" data-a="close">Ahora no</button></form>`;
  return `<form class="stack" data-form="cuenta" style="gap:14px" novalidate><div class="grab"></div>
   <h2>${reg?(f.paraPro?'Crea tu cuenta para pasarte a Pro':'Crea tu cuenta'):'Inicia sesión'}</h2>
   <p class="muted small" style="margin:0">${reg?'Con una cuenta, tu plan Pro te acompaña en cualquier dispositivo. Tus horarios siguen guardados solo en este teléfono.':'Entra con el correo y la contraseña de tu cuenta de LIA.'}</p>
   ${correo}${campoClave(f,reg)}
   ${reg?'':'<button class="linkbtn" type="button" data-a="cuenta-recuperar" style="align-self:flex-start;margin-top:-10px">¿Olvidaste tu contraseña?</button>'}
   ${avisosCuenta(f)}${enviar(reg?'Crear cuenta':'Iniciar sesión')}
   <button class="btn sec" type="button" data-a="${reg?'cuenta-ingresar':'cuenta-registrar'}" data-pro="${pro}">${reg?'Ya tengo cuenta':'Crear una cuenta nueva'}</button>
   <button class="btn sec" type="button" data-a="close">Cancelar</button></form>`;}
function enviarCuenta(email,pass){const f=ui.cuentaForm;if(!f||f.cargando)return;const modo=f.modo,reg=modo==='registro',clave=reg||modo==='nueva-clave';
  if(modo!=='nueva-clave')f.email=email;f.pass=pass;f.error=null;f.aviso=null;f.noConfirmado=false;
  const mal=t=>{f.error=t;pintarCuenta();};
  if(modo!=='nueva-clave'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return mal('Escribe un correo válido, por ejemplo nombre@correo.com.');
  if(modo!=='recuperar'&&(!pass||(clave&&pass.length<8)))return mal(clave?'La contraseña debe tener al menos 8 caracteres.':'Escribe tu contraseña.');
  f.cargando=true;pintarCuenta();ui.authBusy=true;
  const listo=()=>{ui.authBusy=false;f.cargando=false;};
  const abierta=()=>ui.cuentaForm===f&&!!ui.sheet;  // si la cerró mientras esperaba, no se vuelve a abrir
  const fallo=e=>{listo();f.error=mensajeError(e);f.noConfirmado=modo==='ingreso'&&/confirma tu correo/.test(f.error);if(abierta())pintarCuenta();else toast(f.error);};
  const volver=location.origin+location.pathname;
  if(modo==='recuperar'){sb().then(c=>c.auth.resetPasswordForEmail(email,{redirectTo:volver})).then(({error})=>{if(error)throw error;listo();f.modo='enlace-enviado';
      if(abierta())pintarCuenta();else toast('Te enviamos un enlace para crear una contraseña nueva.');}).catch(fallo);return;}
  if(modo==='nueva-clave'){sb().then(c=>c.auth.updateUser({password:pass})).then(({data,error})=>{if(error)throw error;listo();ui.cuentaForm=null;ui.sheet=null;
      if(data&&data.user)setCuenta(data.user);rerenderKeepScroll();toast('Listo, cambiaste tu contraseña.');}).catch(fallo);return;}
  if(reg&&f.paraPro&&ui.pay)guardarPagoPendiente(ui.pay);
  sb().then(c=>reg?c.auth.signUp({email,password:pass,options:{emailRedirectTo:volver}}):c.auth.signInWithPassword({email,password:pass}))
    .then(({data,error})=>{if(error)throw error;
      if(!data.session){listo();f.pass='';
        // Con la confirmación activada, Auth no dice que el correo ya tiene cuenta: responde sin identidades y no envía nada.
        if(reg&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){f.modo='ingreso';f.error='Ya hay una cuenta con ese correo. Inicia sesión o, si no recuerdas la contraseña, recupérala.';if(abierta())pintarCuenta();else toast(f.error);return;}
        f.modo='confirmar';f.esperaHasta=Date.now()+60000;if(abierta())pintarCuenta();else toast('Te enviamos un correo para confirmar tu cuenta.');return;}
      setCuenta(data.session.user);
      return refrescarPlan(false).catch(()=>null).then(()=>{const seguia=abierta();listo();
        const pend=tomarPagoPendiente(),p=ui.pay||pend,paraPro=f.paraPro||!!pend;
        if(paraPro&&p&&isPro()){ui.cuentaForm=null;ui.pay=null;ui.sheet=null;rerenderKeepScroll();toast('Tu cuenta ya tiene LIA Pro.');resumeAfterPay(p);return;}
        toast(reg?'Listo, creaste tu cuenta.':'Listo, iniciaste sesión.');
        if(paraPro&&p&&seguia){ui.cuentaForm=null;ui.pay=p;ui.sheet=sheetCheckout();render();}
        else{ui.cuentaForm=null;ui.sheet=null;rerenderKeepScroll();}});})
    .catch(fallo);}
function cuentaCard(){if(!cuentasActivas())return '';
  if(!state.cuenta)return `<div class="card stack"><span class="eyebrow">Tu cuenta</span><div class="small muted">Sin cuenta. Tus datos se guardan solo en este teléfono. Crea una cuenta para pasarte a Pro.</div><div class="row-h" style="flex-wrap:wrap"><button class="btn sec sm" data-a="cuenta-registrar">Crear cuenta</button><button class="btn sec sm" data-a="cuenta-ingresar">Iniciar sesión</button></div></div>`;
  return `<div class="card stack"><span class="eyebrow">Tu cuenta</span><div><b style="overflow-wrap:anywhere">${esc(state.cuenta.email)}</b><div class="small muted">${isPro()?'LIA Pro':'LIA Gratis'} · tus horarios siguen solo en este teléfono</div></div><button class="btn sec sm" data-a="cuenta-salir" style="align-self:flex-start">Cerrar sesión</button></div>`;}
Object.assign(A,{
 'cuenta-registrar':d=>abrirCuenta('registro',d.pro==='1'),
 'cuenta-ingresar':d=>abrirCuenta('ingreso',d.pro==='1'),
 'cuenta-recuperar':()=>{const f=ui.cuentaForm;abrirCuenta('recuperar',!!(f&&f.paraPro));},
 'cuenta-reenviar':()=>{const f=ui.cuentaForm;if(!f||f.cargando||f.esperaHasta>Date.now())return;f.error=null;f.aviso=null;f.cargando=true;
   sb().then(c=>c.auth.resend({type:'signup',email:f.email,options:{emailRedirectTo:location.origin+location.pathname}})).then(({error})=>{if(error)throw error;
       f.cargando=false;f.esperaHasta=Date.now()+60000;f.aviso='Te lo volvimos a enviar. Si no llega en unos minutos, revisa la carpeta de spam.';if(ui.cuentaForm===f&&ui.sheet)pintarCuenta();})
     .catch(e=>{f.cargando=false;f.error=mensajeError(e);if(ui.cuentaForm===f&&ui.sheet)pintarCuenta();});},
 'ver-clave':(d,el)=>{const i=document.getElementById('cu-pass'),f=ui.cuentaForm;if(!i)return;const ver=i.type==='password';i.type=ver?'text':'password';
   el.textContent=ver?'Ocultar':'Mostrar';el.setAttribute('aria-label',`${ver?'Ocultar':'Mostrar'} contraseña`);if(f){f.ver=ver;f.pass=i.value;ui.sheet=sheetCuenta();}},
 'cuenta-salir':()=>{ui.sheet=`<div class="grab"></div><h2>¿Cerrar sesión?</h2><p class="muted" style="margin:0">En este dispositivo vuelves a LIA Gratis. Tus horarios y evaluaciones no se borran${isPro()?', y tu plan Pro sigue en tu cuenta':''}.</p><button class="btn pri" data-a="cuenta-salir-ok">Cerrar sesión</button><button class="btn sec" data-a="close">Cancelar</button>`;render();},
 'cuenta-salir-ok':()=>{ui.sheet=null;render();ui.authBusy=true;
   const fin=()=>{ui.authBusy=false;try{localStorage.removeItem('lia.auth');}catch(e){}quitarCuenta();rerenderKeepScroll();toast('Cerraste sesión. Estás en LIA Gratis.');};
   sb().then(c=>c.auth.signOut({scope:'local'})).then(fin,fin);},
});

// ---------- App instalable ----------
const APP_VERSION='0.3.6';
let installEvt=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function calm(){const a=document.activeElement;return !ui.sheet&&!ui.session&&!ui.listen&&!(a&&a.matches('input,select'));}
function installCard(){const base='Todo se guarda solo en este teléfono, en este navegador.';
  if(isStandalone())return `<div class="card small muted">Todo se guarda solo en este teléfono, dentro de la app. Si la desinstalas o borras los datos del navegador, se pierde.</div>`;
  if(installEvt)return `<div class="card stack"><span class="small muted">${base} Instálala para abrirla como app, incluso sin internet.</span><button class="btn pri" data-a="install">Instalar LIA</button></div>`;
  if(isIOS())return `<div class="card small muted">${base} Para usarla como app, en Safari abre <b>Compartir</b> y elige <b>Agregar a inicio</b>. Instalada, Safari no borra tus datos aunque pases días sin abrirla.</div>`;
  return `<div class="card small muted">${base} Para usarla como app, busca en el menú del navegador <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>.</div>`;}
A.install=async()=>{const e=installEvt;if(!e)return;installEvt=null;try{await e.prompt();await e.userChoice;}catch(err){}rerenderKeepScroll();};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(ui.tab==='perfil'&&calm())rerenderKeepScroll();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Listo: LIA quedó instalada.');if(ui.tab==='perfil'&&calm())rerenderKeepScroll();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});

// Otra pestaña (o la app instalada) guardó cambios: se adoptan para no pisarlos después con una copia vieja.
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;let nuevo=null;try{nuevo=JSON.parse(e.newValue);}catch(err){return;}
  if(!nuevo||nuevo.v!==1)return;state=nuevo;undoStack=null;ensureState();if(calm())rerenderKeepScroll();});

render();
// Retoma una sesión de estudio que seguía abierta; si el tiempo se acabó con la app cerrada, la registra.
(function(){let g=null;try{g=JSON.parse(localStorage.getItem(KEY_SES));}catch(e){}if(!g)return;
  if(!evById(g.ev)||![g.total,g.acc,g.since].every(Number.isFinite)||!(g.total>0)){ui.session=null;guardarSesion();return;}
  if(!Number.isFinite(g.inicio))delete g.inicio;
  ui.session=nuevaSesion(g);ui.session.preguntar=false;
  if(ui.session.running&&ui.session.elapsed()>=ui.session.total){const s=ui.session,e=evById(s.ev),min=minutosSesion(s);cerrarSesion();registrarSesion(s,min);render();
    toast(`Tu sesión terminó mientras LIA estaba cerrada. Registré ${hrs(min)} de ${e.course}.`,true);return;}
  render();tick();pedirPantalla();})();
iniciarCuentas();
setInterval(()=>{if(!ui.session&&!ui.sheet&&!ui.listen&&!document.activeElement.matches('input,select'))rerenderKeepScroll();},60000);
</script>
